}

/* Collect all critical / overdue items across modules (mirrors the Reports page logic) */
function gatherCriticalItemsForNotif(){
  let items = [];
  MODULES.forEach(m=>{
    const all = loadData(m.key);
    all.forEach(r=>{
      const flagged = isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim());
      if(flagged){
        const label = r.branch || r.company || r.reqNo || r.plate || r.name || "";
        const dateVal = m.dateFieldForReports ? r[m.dateFieldForReports] : "";
        items.push({ module: ML(m,"name"), label, date: dateVal||"", status: r[m.statusField]||"", overdue: isOverdue(m,r) });
      }
    });
  });
  return items;
}
function buildEmailParams(items){
  const lines = items.map((it,i)=>
    `${i+1}. [${it.module}] ${it.label} — ${optLabel(it.status)}${it.overdue? " ("+t('overdueTag')+")":""}${it.date? " — "+it.date:""}`
  );
  return {
    to_email: getNotifConfig().email,
    subject: `GROUP FORKA — ${items.length} ${LANG==='ar'?'بند يحتاج متابعة':'item(s) need follow-up'}`,
    critical_count: String(items.length),
    items_list: lines.join("\n"),
    date: new Date().toLocaleString(LANG==="ar"?"ar-EG":"en-GB"),
  };
}
function sendNotificationEmail(manual, onDone){
  const cfg = getNotifConfig();
  const items = gatherCriticalItemsForNotif();
  if(!items.length){
    if(manual) showToast(t('notifNoCriticalNow'));
    if(onDone) onDone(false);
    return;
  }
  if(!cfg.email || !cfg.serviceId || !cfg.templateId || !cfg.publicKey){
    if(manual) alert(t('notifMissingFields'));
    if(onDone) onDone(false);
    return;
  }
  if(!window.emailjs){
    if(manual) alert(t('notifSentFail'));
    if(onDone) onDone(false);
    return;
  }
  const params = buildEmailParams(items);
  if(manual) showToast(t('notifSending'));
  emailjs.send(cfg.serviceId, cfg.templateId, params).then(()=>{
    setLastSentDate();
    if(manual) showToast(t('notifSentOk'));
    if(onDone) onDone(true);
  }).catch((err)=>{
    console.error("EmailJS send failed:", err);
    if(manual) alert(t('notifSentFail'));
    if(onDone) onDone(false);
  });
}
function maybeAutoSendNotification(){
  const cfg = getNotifConfig();
  if(!cfg.enabled) return;
  if(getLastSentDate() === todayStr()) return; // already sent today
  sendNotificationEmail(false);
}
function sendTestEmail(){
  const cfg = getNotifConfig();
  if(!cfg.email || !cfg.serviceId || !cfg.templateId || !cfg.publicKey){
    alert(t('notifMissingFields'));
    return;
  }
  if(!window.emailjs){
    alert(t('notifSentFail'));
    return;
  }
  const params = {
    to_email: cfg.email,
    subject: `GROUP FORKA — ${t('notifTestSubject')}`,
    critical_count: "0",
    items_list: t('notifTestSampleLine'),
    date: new Date().toLocaleString(LANG==="ar"?"ar-EG":"en-GB"),
  };
  showToast(t('notifSending'));
  emailjs.send(cfg.serviceId, cfg.templateId, params).then(()=>{
    showToast(t('notifSentOk'));
  }).catch((err)=>{
    console.error("EmailJS test send failed:", err);
    const detail = (err && (err.text || err.message)) ? ": " + (err.text || err.message) : "";
    alert(t('notifSentFail') + detail);
  });
}

function uploadFileToStorage(file, onProgress){
  if(!cloudEnabled || !window.firebase || !firebase.storage){ return Promise.resolve(null); }
  try{
    const storage = firebase.storage();
    const safeName = (file.name||"file").replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `attachments/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`;
    const ref = storage.ref().child(path);
    return new Promise((resolve)=>{
      try{
        const task = ref.put(file);
        task.on("state_changed",
          (snapshot)=>{ if(onProgress && snapshot.totalBytes) onProgress(Math.round((snapshot.bytesTransferred/snapshot.totalBytes)*100)); },
          (err)=>{ console.error("Storage upload failed:", err); resolve(null); },
          ()=>{ task.snapshot.ref.getDownloadURL().then(resolve).catch(()=>resolve(null)); }
        );
      }catch(e){ console.error("Storage upload error:", e); resolve(null); }
    });
  }catch(e){
    console.error("Storage upload error:", e);
    return Promise.resolve(null);
  }
}

function getCloudinaryConfig(){
  if(EMBEDDED_CLOUDINARY_CONFIG) return EMBEDDED_CLOUDINARY_CONFIG;

function saveCloudinaryConfig(cfg){ localStorage.setItem("forka_cloudinary_config", JSON.stringify(cfg)); }
function clearCloudinaryConfig(){ localStorage.removeItem("forka_cloudinary_config"); }
function uploadFileToCloudinary(file, onProgress){
  const cfg = getCloudinaryConfig();
  if(!cfg || !cfg.cloudName || !cfg.uploadPreset) return Promise.resolve(null);
  return new Promise((resolve)=>{
    try{
      const xhr = new XMLHttpRequest();
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", cfg.uploadPreset);
      xhr.timeout = 6 * 60 * 1000; // 6 minutes — generous for large video files
      xhr.open("POST", `https://api.cloudinary.com/v1_1/${cfg.cloudName}/auto/upload`, true);
      if(xhr.upload && onProgress){
        xhr.upload.onprogress = (e)=>{
          if(e.lengthComputable) onProgress(Math.round((e.loaded/e.total)*100));
        };
      }
      xhr.onload = ()=>{
        try{
          const data = JSON.parse(xhr.responseText);
          resolve(data.secure_url || null);
        }catch(e){ resolve(null); }
      };
      xhr.onerror = ()=>{ console.error("Cloudinary upload network error"); resolve(null); };
      xhr.ontimeout = ()=>{ console.error("Cloudinary upload timed out"); resolve(null); };
      xhr.send(formData);
    }catch(e){ console.error("Cloudinary upload setup error:", e); resolve(null); }
  });
}
/* Single entry point used by the attachment widget: prefer Cloudinary (free, no card),
   fall back to Firebase Storage (requires Blaze) if that's what the user configured instead. */

}

function computeRangeDates(preset, customFrom, customTo){
  if(preset==="today") return { from: todayStr(), to: todayStr() };
  if(preset==="week"){ const d=new Date(); d.setDate(d.getDate()-6); return { from:d.toISOString().slice(0,10), to: todayStr() }; }
  if(preset==="month"){ const d=new Date(); d.setDate(d.getDate()-29); return { from:d.toISOString().slice(0,10), to: todayStr() }; }
  return { from: customFrom||todayStr(), to: customTo||todayStr() };
}
function prevPeriod(from, to){
  const fromD = new Date(from), toD = new Date(to);
  const days = Math.max(1, Math.round((toD-fromD)/86400000)+1);
  const prevTo = new Date(fromD); prevTo.setDate(prevTo.getDate()-1);
  const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(days-1));
  return { from: prevFrom.toISOString().slice(0,10), to: prevTo.toISOString().slice(0,10) };
}
function recordsInRange(m, from, to, branch){
  const fromD = new Date(from), toD = new Date(to); toD.setHours(23,59,59,999);
  let data = loadData(m.key);
  if(branch && branch!=="all" && m.branchField){
    data = data.filter(r=> (r[m.branchField]||"")===branch);
  }
  if(!m.dateFieldForReports) return [];
  return data.filter(r=>{
    if(!r[m.dateFieldForReports]) return false;
    const d = new Date(r[m.dateFieldForReports]);
    return d>=fromD && d<=toD;
  });
}
function moduleSummary(m, from, to, branch){
  const recs = recordsInRange(m, from, to, branch);
  const openCount = m.statusField ? recs.filter(r=>["مفتوح","قيد التنفيذ","مجدول","قيد الإصلاح"].includes((r[m.statusField]||"").trim())).length : 0;
  const closedCount = m.statusField ? recs.filter(r=>["مغلق","منجز في موعده","منجز متأخر","تم التسليم","مكتمل"].includes((r[m.statusField]||"").trim())).length : 0;
  const critCount = recs.filter(r=> isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim())).length;
  const totalCost = m.costField ? recs.reduce((s,r)=> s+(Number(r[m.costField])||0), 0) : 0;
  return { count: recs.length, openCount, closedCount, critCount, totalCost, recs };
}
function deltaBadge(curr, prev){
  if(prev===0 && curr===0) return `<span class="badge badge-muted">${t('deltaSame')}</span>`;
  if(prev===0) return `<span class="badge badge-warning">${t('deltaUp')} ${curr}</span>`;
  const diff = curr-prev;
  const pct = Math.round((diff/prev)*100);
  if(diff===0) return `<span class="badge badge-muted">${t('deltaSame')} 0%</span>`;
  const cls = diff>0 ? "badge-danger" : "badge-success";
  const arrow = diff>0 ? t('deltaUp') : t('deltaDown');
  return `<span class="badge ${cls}">${arrow} ${Math.abs(pct)}%</span>`;
}
function svgBarChart(points, opts){
  opts = opts||{};
  const w = opts.width||640, h = opts.height||160, pad = 28;
  if(!points.length || points.every(p=>p.value===0)){
    return `<div style="padding:30px; text-align:center; color:var(--muted); font-size:13px;">${t('mrNoChartData')}</div>`;
  }
  const max = Math.max(...points.map(p=>p.value), 1);
  const bw = (w-pad*2) / points.length;
  const bars = points.map((p,i)=>{
    const bh = Math.round((p.value/max) * (h-pad*2));
    const x = pad + i*bw + bw*0.15;
    const y = h-pad-bh;
    const bwReal = bw*0.7;
    return `<rect x="${x}" y="${y}" width="${bwReal}" height="${bh}" rx="3" fill="#1F3864"/>
            <text x="${x+bwReal/2}" y="${h-pad+14}" font-size="9" text-anchor="middle" fill="#666">${p.label}</text>
            <text x="${x+bwReal/2}" y="${y-4}" font-size="9" text-anchor="middle" fill="#1F3864" font-weight="700">${p.value}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; max-width:${w}px; height:${h}px;">${bars}<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#ddd"/></svg>`;
}
function bucketRecordsByDay(recs, dateField, from, to){
  const fromD = new Date(from), toD = new Date(to);
  const days = Math.max(1, Math.round((toD-fromD)/86400000)+1);
  const buckets = [];
  for(let i=0;i<days;i++){
    const d = new Date(fromD); d.setDate(d.getDate()+i);
    const key = d.toISOString().slice(0,10);
    const label = LANG==="ar" ? d.toLocaleDateString("ar-EG",{day:"2-digit",month:"2-digit"}) : d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit"});
    const value = recs.filter(r=> (r[dateField]||"").slice(0,10)===key).length;
    buckets.push({label, value});
  }
  // collapse to max ~12 buckets by merging if too many days
  if(buckets.length>14){
    const groupSize = Math.ceil(buckets.length/14);
    const grouped = [];
    for(let i=0;i<buckets.length;i+=groupSize){
      const slice = buckets.slice(i,i+groupSize);
      grouped.push({label:slice[0].label, value: slice.reduce((s,b)=>s+b.value,0)});
    }
    return grouped;
  }
  return buckets;
}
function computeTopItems(recs, field, limit){
  const counts = {};
  recs.forEach(r=>{
    const v = (r[field]||"").trim();
    if(!v) return;
    counts[v] = (counts[v]||0)+1;
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit||5).map(([label,count])=>({label,count}));
}
function computeContractorPerfForRecords(recs, contractorField){
  const evals = loadData("contractorEval");
  const names = [...new Set(recs.map(r=>(r[contractorField]||"").trim()).filter(Boolean))];
  return names.map(name=>{
    const scores = evals.filter(e=>(e.contractor||"").trim()===name).map(e=>Number(e.weightedTotal)||0);
    const avg = scores.length ? Math.round((scores.reduce((a,b)=>a+b,0)/scores.length)*10)/10 : null;
    const jobCount = recs.filter(r=>(r[contractorField]||"").trim()===name).length;
    return { name, avg, jobCount };
  }).sort((a,b)=> (b.avg||0)-(a.avg||0));
}

  const thisWeekKey = todayStr();
  const lastSentWeek = localStorage.getItem("forka_weekly_report_lastsent") || "";
  if(lastSentWeek === thisWeekKey) return;
  const range = computeRangeDates("week");
  const lines = [];
  weekCfg.modules.forEach(key=>{
    const m = MODULES.find(x=>x.key===key);
    if(!m) return;
    const s = moduleSummary(m, range.from, range.to, "all");
    lines.push(`${m.icon} ${ML(m,"name")}: ${s.count} ${LANG==='ar'?'جديد':'new'}, ${s.openCount} ${LANG==='ar'?'مفتوح':'open'}, ${s.critCount} ${LANG==='ar'?'حرج':'critical'}${m.costField? ", "+fmtMoney(s.totalCost)+" "+t('reportCost'):""}`);
  });
  if(!window.emailjs || !notifCfg.serviceId) return;
  const params = {
    to_email: notifCfg.email,
    subject: `GROUP FORKA — ${LANG==='ar'?'التقرير الأسبوعي':'Weekly Report'} (${range.from} → ${range.to})`,
    critical_count: String(weekCfg.modules.length),
    items_list: lines.join("\n"),
    date: new Date().toLocaleString(LANG==="ar"?"ar-EG":"en-GB"),
  };
  emailjs.send(notifCfg.serviceId, notifCfg.templateId, params).then(()=>{
    localStorage.setItem("forka_weekly_report_lastsent", thisWeekKey);
  }).catch(err=> console.error("Weekly report email failed:", err));
}

/* ---- Module report page renderer (embedded inside a module's view) ---- */

      ${m.statusField ? kpiCard(t('mrClosed'), curr.closedCount, prevS.closedCount) : ""}

/* ---------------- DAILY/MONTHLY LITERAL CHECKLISTS ---------------- */
function loadChecklist(kind){
  try{ return JSON.parse(localStorage.getItem("forka_checklist_"+kind)) || {}; }catch(e){ return {}; }
}
function saveChecklist(kind, obj){ localStorage.setItem("forka_checklist_"+kind, JSON.stringify(obj)); }
function currentMonthKey(){ return todayStr().slice(0,7); }

function checklistCompletionLabel(doneCount, total){
  if(doneCount===0) return {cls:"badge-muted", text:t('checklistNone')};
  if(doneCount===total) return {cls:"badge-success", text:t('checklistCompleted')};
  return {cls:"badge-warning", text:t('checklistPartial')};
}

function renderChecklistsPage(){
  document.getElementById("topbarTitle").textContent = t('checklistsTitle');
  document.getElementById("topbarMeta").textContent = t('checklistsMeta');
  document.getElementById("topbarActions").innerHTML = langSwitcherHtml();
  bindLangSwitcher();

  const dailyItems = t('checklistDailyItems');
  const monthlyItems = t('checklistMonthlyItems');
  const dailyData = loadChecklist("daily");
  const monthlyData = loadChecklist("monthly");
  const todayKey = todayStr();
  const monthKey = currentMonthKey();
  const todayState = dailyData[todayKey] || {};
  const monthState = monthlyData[monthKey] || {};

  const checkRow = (items, state, kind, dateKey) => items.map((label,i)=>`
    <label style="display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13.5px;">
      <input type="checkbox" data-cl="${kind}::${dateKey}::${i}" ${state[i]?'checked':''} style="width:18px; height:18px;">
      <span>${label}</span>
    </label>`).join("");

  // history
  const dailyHistoryRows = [];
  for(let i=0;i<14;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const st = dailyData[key] || {};
    const doneCount = Object.values(st).filter(Boolean).length;
    const lbl = checklistCompletionLabel(doneCount, dailyItems.length);
    dailyHistoryRows.push(`<tr><td>${key}</td><td>${doneCount}/${dailyItems.length}</td><td><span class="badge ${lbl.cls}">${lbl.text}</span></td></tr>`);
  }
  const monthlyHistoryRows = [];
  for(let i=0;i<6;i++){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    const key = d.toISOString().slice(0,7);
    const st = monthlyData[key] || {};
    const doneCount = Object.values(st).filter(Boolean).length;
    const lbl = checklistCompletionLabel(doneCount, monthlyItems.length);
    monthlyHistoryRows.push(`<tr><td>${key}</td><td>${doneCount}/${monthlyItems.length}</td><td><span class="badge ${lbl.cls}">${lbl.text}</span></td></tr>`);
  }

  document.getElementById("content").innerHTML = `
    <div class="grid-cards" style="grid-template-columns:1fr 1fr;">
      <div class="card">
        <div class="label" style="margin-bottom:10px;">${t('checklistDailyTitle')}${todayKey}</div>
        <div>${checkRow(dailyItems, todayState, "daily", todayKey)}</div>
      </div>
      <div class="card">
        <div class="label" style="margin-bottom:10px;">${t('checklistMonthlyTitle')}${monthKey}</div>
        <div>${checkRow(monthlyItems, monthState, "monthly", monthKey)}</div>

  const a = document.createElement("a");

if(!state.calendarDate) state.calendarDate = new Date();
function calendarEventsForModule(){
  // {module, dateField, labelField} pairs to plot on the calendar
  return [
    { key:"pm", dateField:"nextVisit", color:"#2563eb" },
    { key:"amc", dateField:"nextVisit", color:"#C9A24B" },
    { key:"inspections", dateField:"targetDate", color:"#c0392b" },
    { key:"projects", dateField:"targetOpenDate", color:"#1f8a4c" },
    { key:"fleet", dateField:"insuranceExpiry", color:"#b8860b" },
  ];
}
function getCalendarEventsForMonth(year, month){
  const events = {}; // "YYYY-MM-DD" -> [{title, moduleKey, id, color}]
  calendarEventsForModule().forEach(cfg=>{
    const m = MODULES.find(x=>x.key===cfg.key);
    if(!m) return;
    loadData(m.key).forEach(r=>{
      const dateVal = r[cfg.dateField];
      if(!dateVal) return;
      const d = new Date(dateVal);
      if(d.getFullYear()!==year || d.getMonth()!==month) return;
      const key = d.toISOString().slice(0,10);
      const title = r.carName || r.projectName || r.item || r.company || r.equipment || r.branch || ML(m,"singular");
      if(!events[key]) events[key] = [];
      events[key].push({ title, moduleKey: m.key, id:r.id, color:cfg.color, icon:m.icon });
    });
  });
  return events;
}
function renderCalendarPage(){
  document.getElementById("topbarTitle").textContent = t('calendarTitle');
  document.getElementById("topbarMeta").textContent = t('calendarMeta');
  document.getElementById("topbarActions").innerHTML = langSwitcherHtml();
  bindLangSwitcher();

  const cd = state.calendarDate;
  const year = cd.getFullYear(), month = cd.getMonth();
  const monthNamesAr = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const monthNamesEn = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const dayNamesAr = ["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
  const dayNamesEn = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const monthNames = LANG==='ar'?monthNamesAr:monthNamesEn;
  const dayNames = LANG==='ar'?dayNamesAr:dayNamesEn;

  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay(); // 0=Sunday
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const events = getCalendarEventsForMonth(year, month);
  const todayKey = todayStr();

  let cells = "";
  for(let i=0;i<startOffset;i++){ cells += `<div class="cal-cell cal-empty"></div>`; }
  for(let day=1; day<=daysInMonth; day++){
    const dObj = new Date(year, month, day);
    const key = dObj.toISOString().slice(0,10);
    const dayEvents = events[key] || [];
    const isToday = key === todayKey;
    cells += `<div class="cal-cell ${isToday?'cal-today':''}">
      <div class="cal-daynum">${day}${isToday?` <span class="cal-today-badge">${t('calendarToday')}</span>`:''}</div>
      <div class="cal-events">
        ${dayEvents.slice(0,4).map(ev=>`<div class="cal-event" style="background:${ev.color}22; color:${ev.color}; border-inline-start:3px solid ${ev.color};" data-calevent-module="${ev.moduleKey}" data-calevent-id="${ev.id}">${ev.icon} ${ev.title}</div>`).join("")}
        ${dayEvents.length>4 ? `<div class="cal-event-more">+${dayEvents.length-4}</div>` : ""}
      </div>
    </div>`;
  }

  document.getElementById("content").innerHTML = `
    <div class="toolbar no-print" style="justify-content:center;">
      <button class="btn btn-outline btn-sm" id="calPrev">${t('calendarPrevMonth')}</button>
      <div style="font-weight:900; font-size:16px; color:var(--navy); min-width:160px; text-align:center;">${monthNames[month]} ${year}</div>
      <button class="btn btn-outline btn-sm" id="calNext">${t('calendarNextMonth')}</button>
    </div>
    <div class="cal-grid cal-header-row">
      ${dayNames.map(d=>`<div class="cal-headcell">${d}</div>`).join("")}
    </div>
    <div class="cal-grid">${cells}</div>
  `;
  document.getElementById("calPrev").onclick = ()=>{ state.calendarDate = new Date(year, month-1, 1); renderCalendarPage(); };
  document.getElementById("calNext").onclick = ()=>{ state.calendarDate = new Date(year, month+1, 1); renderCalendarPage(); };
  document.querySelectorAll("[data-calevent-module]").forEach(el=>{
    el.onclick = ()=>{
      const mk = el.dataset.caleventModule;
      const rid = el.dataset.caleventId;
      state.view = mk;
      render();
      setTimeout(()=>{
        const rec = loadData(mk).find(r=>r.id===rid);
        const mod = MODULES.find(x=>x.key===mk);
        if(rec && mod) openForm(mod, rec, true);
      }, 50);
    };
  });
}

function renderBranchComparePage(){
  document.getElementById("topbarTitle").textContent = t('branchCompareTitle');
  document.getElementById("topbarMeta").textContent = t('branchCompareMeta');
  document.getElementById("topbarActions").innerHTML = langSwitcherHtml();
  bindLangSwitcher();

  const masters = loadMasters();
  const branches = masters.branches || [];
  const branchModules = MODULES.filter(m=>m.branchField);

  const rows = branches.map(branch=>{
    let totalRequests = 0, totalCost = 0, criticalCount = 0, closedCount = 0, totalCount = 0;
    branchModules.forEach(m=>{
      const data = loadData(m.key).filter(r=>(r[m.branchField]||"").trim()===branch.trim());
      totalCount += data.length;
      if(m.key==="requests") totalRequests += data.length;
      if(m.costField) totalCost += data.reduce((s,r)=> s + (Number(r[m.costField])||0), 0);
      criticalCount += data.filter(r=> isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim())).length;
      if(m.statusField) closedCount += data.filter(r=>["مغلق","منجز في موعده","تم التسليم","مكتمل"].includes((r[m.statusField]||"").trim())).length;
    });
    const closureRate = totalCount ? Math.round((closedCount/totalCount)*100) : null;
    return { branch, totalRequests, totalCost, criticalCount, closureRate };
  }).sort((a,b)=> b.criticalCount - a.criticalCount);

  document.getElementById("content").innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>${t('bcBranch')}</th><th>${t('bcTotalRequests')}</th><th>${t('bcTotalCost')}</th>
          <th>${t('bcCritical')}</th><th>${t('bcClosureRate')}</th>
        </tr></thead>
        <tbody>
        ${rows.length ? rows.map(r=>`
          <tr>
            <td><b>${r.branch}</b></td>
            <td>${r.totalRequests}</td>
            <td>${fmtMoney(r.totalCost)}</td>
            <td>${r.criticalCount>0? `<span class="badge badge-danger">${r.criticalCount}</span>` : "0"}</td>
            <td>${r.closureRate!==null? `<span class="badge ${r.closureRate>=80?'badge-success':r.closureRate>=50?'badge-warning':'badge-danger'}">${r.closureRate}%</span>` : "—"}</td>
          </tr>`).join("") : `<tr class="empty-row"><td colspan="5">${t('mastersEmpty')}</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

/* ---------------- LOCAL PUSH NOTIFICATIONS (free — works while app is open/backgrounded) ---------------- */
function gatherCriticalItemsWithIds(){
  let items = [];
  MODULES.forEach(m=>{
    loadData(m.key).forEach(r=>{
      const flagged = isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim());
      if(flagged){
        const label = r.branch || r.company || r.reqNo || r.plate || r.name || "";
        items.push({ id: r.id, moduleName: ML(m,"name"), label });
      }
    });
  });
  return items;
}
function getPushNotifEnabled(){ return localStorage.getItem("forka_push_enabled") === "on"; }
function setPushNotifEnabled(on){
  localStorage.setItem("forka_push_enabled", on ? "on" : "off");
  if(!on && pushWatcherInterval){ clearInterval(pushWatcherInterval); pushWatcherInterval = null; }
}
function getNotifiedIds(){ try{ return new Set(JSON.parse(localStorage.getItem("forka_notified_ids"))||[]); }catch(e){ return new Set(); } }
function saveNotifiedIds(set){ localStorage.setItem("forka_notified_ids", JSON.stringify([...set])); }
function seedNotifiedIdsBaseline(){ saveNotifiedIds(new Set(gatherCriticalItemsWithIds().map(i=>i.id))); }
function showLocalNotification(title, body){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  let fired = false;
  const fireDirect = ()=>{ if(fired) return; fired = true; try{ new Notification(title, {body}); }catch(e){ console.error("Notification failed:", e); } };
  const fallbackTimer = setTimeout(fireDirect, 1500); // guard against navigator.serviceWorker.ready hanging forever
  if(navigator.serviceWorker && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(reg=>{
      clearTimeout(fallbackTimer);
      if(fired) return;
      fired = true;
      reg.showNotification(title, { body, icon:"icon-192.png", badge:"icon-192.png" });
    }).catch(()=>{
      clearTimeout(fallbackTimer);
      fireDirect();
    });
  } else {
    clearTimeout(fallbackTimer);
    fireDirect();
  }
}
let pushWatcherInterval = null;
function checkForNewCriticalItemsAndNotify(){
  if(!getPushNotifEnabled() || !("Notification" in window) || Notification.permission !== "granted") return;
  const items = gatherCriticalItemsWithIds();
  const notified = getNotifiedIds();
  const newOnes = items.filter(i=> !notified.has(i.id));
  if(newOnes.length){
    if(newOnes.length === 1){
      showLocalNotification(t('pushNotifNewCriticalTitle'), `${newOnes[0].moduleName}: ${newOnes[0].label}`);
    } else {
      showLocalNotification(t('pushNotifNewCriticalTitle'), t('pushNotifMultipleBody', newOnes.length));
    }
    newOnes.forEach(i=> notified.add(i.id));
    saveNotifiedIds(notified);
  }
}
function startPushNotifWatcher(){
  if(pushWatcherInterval) clearInterval(pushWatcherInterval);
  pushWatcherInterval = setInterval(checkForNewCriticalItemsAndNotify, 45000);
}
if(getPushNotifEnabled() && "Notification" in window && Notification.permission === "granted"){
  startPushNotifWatcher();
}
