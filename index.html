<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GROUP FORKA">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>GROUP FORKA | نظام إدارة الصيانة والمرافق والأسطول واللوجستيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<style>
  :root{
    --navy:#1F3864; --navy-dark:#15294c; --navy-light:#2c4a80;
    --gold:#C9A24B; --gold-light:#e8d9b5;
    --bg:#EEF1F6; --card:#FFFFFF; --line:#E2E6EE;
    --text:#1c2433; --muted:#6b7686;
    --danger:#c0392b; --danger-bg:#fdecea;
    --success:#1f8a4c; --success-bg:#e8f8ee;
    --warning:#b8860b; --warning-bg:#fff6e0;
    --info:#2563eb; --info-bg:#eaf1ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal','Segoe UI',Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; min-height:100vh;
  }
  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px; min-width:250px; background:linear-gradient(180deg,var(--navy),var(--navy-dark));
    color:#fff; display:flex; flex-direction:column; padding:18px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ padding:0 18px 16px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px;}
  .brand .logo{font-weight:900; font-size:20px; letter-spacing:.5px;}
  .brand .sub{font-size:12px; color:var(--gold-light); margin-top:4px; line-height:1.5;}
  .nav-group-title{font-size:11px; color:rgba(255,255,255,.5); padding:14px 18px 6px; text-transform:uppercase; letter-spacing:.05em;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 18px; cursor:pointer;
    font-size:14.5px; color:rgba(255,255,255,.88); border-inline-start:3px solid transparent; transition:.15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.12); border-inline-start-color:var(--gold); color:#fff; font-weight:700;}
  .nav-item .ic{font-size:16px; width:20px; text-align:center;}
  .nav-badge{
    margin-inline-start:auto; background:var(--gold); color:var(--navy-dark); font-weight:800;
    font-size:11px; padding:1px 7px; border-radius:10px; min-width:18px; text-align:center;
  }
  .nav-footer{margin-top:auto; padding:14px 18px; font-size:11px; color:rgba(255,255,255,.45); border-top:1px solid rgba(255,255,255,.1);}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:0; z-index:5; flex-wrap:wrap;
  }
  .topbar h1{font-size:18px; margin:0; font-weight:800; color:var(--navy);}
  .topbar .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .content{padding:22px 24px 60px; flex:1;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:8px; padding:9px 15px; font-family:inherit; font-size:13.5px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.15s; white-space:nowrap;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-light);}
  .btn-gold{background:var(--gold); color:var(--navy-dark);}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-outline{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{background:#f8d7d3;}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:6px;}
  .btn-lang{background:var(--navy-dark); color:#fff; border:1.5px solid rgba(255,255,255,.25);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- Cards / Dashboard ---------- */
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:20px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:0 1px 2px rgba(20,30,60,.04);}
  .stat-card{cursor:pointer; transition:.15s;}
  .stat-card:hover{box-shadow:0 4px 14px rgba(20,30,60,.10); transform:translateY(-1px);}
  .stat-card .top{display:flex; align-items:center; justify-content:space-between;}
  .stat-card .ic{font-size:22px;}
  .stat-card .num{font-size:30px; font-weight:900; color:var(--navy); margin:6px 0 2px;}
  .stat-card .label{font-size:13.5px; color:var(--text); font-weight:700;}
  .stat-card .sub{font-size:12px; color:var(--muted); margin-top:6px;}
  .stat-card .alert{color:var(--danger); font-weight:800;}
  .section-title{font-size:15px; font-weight:800; color:var(--navy); margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
  .section-title:before{content:""; width:4px; height:16px; background:var(--gold); border-radius:2px; display:inline-block;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px;}
  .toolbar input[type=text], .toolbar select{
    border:1.5px solid var(--line); border-radius:8px; padding:8px 12px; font-family:inherit; font-size:13.5px; background:#fff;
  }
  .toolbar input[type=text]{min-width:220px;}
  .spacer{flex:1;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:68vh;}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:700px;}
  thead th{
    background:var(--navy); color:#fff; text-align:center; padding:10px 8px; font-weight:700; white-space:nowrap; position:sticky; top:0;
  }
  tbody td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:nth-child(even){background:#FAFBFD;}
  tbody tr:hover{background:#F0F4FA;}
  tbody tr.clickable-row{cursor:pointer;}
  td.desc-cell{max-width:220px; text-align:start; white-space:normal;}
  .row-actions{display:flex; gap:5px; justify-content:center;}
  .empty-row td{padding:40px; color:var(--muted); font-size:14px;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:800; white-space:nowrap;}
  .badge-danger{background:var(--danger-bg); color:var(--danger);}
  .badge-warning{background:var(--warning-bg); color:var(--warning);}
  .badge-success{background:var(--success-bg); color:var(--success);}
  .badge-info{background:var(--info-bg); color:var(--info);}
  .badge-muted{background:#eef0f4; color:var(--muted);}

  /* ---------- Modal / Form ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,20,35,.55); display:flex; align-items:flex-start; justify-content:center;
    padding:30px 16px; overflow-y:auto; z-index:50;
  }
  .modal{background:#fff; border-radius:14px; width:100%; max-width:780px; padding:22px 26px 26px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h2{margin:0 0 4px; color:var(--navy); font-size:19px;}
  .modal .modal-sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px; font-weight:700; color:var(--text);}
  .field input, .field select, .field textarea{
    border:1.5px solid var(--line); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:13.5px; background:#fbfcfe;
  }
  .field textarea{min-height:60px; resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--navy);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; border-top:1px solid var(--line); padding-top:16px;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:11px 22px; border-radius:10px; font-size:13.5px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100;
    opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .banner{
    background:var(--warning-bg); border:1px solid #f0e0b0; color:#7a5c00; font-size:12.5px; padding:10px 14px;
    border-radius:10px; margin-bottom:16px; display:flex; gap:8px; align-items:flex-start;
  }
  .help-box{
    background:var(--info-bg); border:1px solid #cfe0fb; color:#1b3f8f; font-size:13px; padding:14px 16px;
    border-radius:10px; margin-bottom:18px; line-height:1.9;
  }
  .help-box b{color:var(--navy);}
  .help-box ol{margin:6px 0 0; padding-inline-start:20px;}

  /* ---------- Print ---------- */
  .print-only{display:none;}
  @media print{
    .no-print{display:none !important;}
    body{display:block; background:#fff;}
    .main{width:100%;}
    .content{padding:0;}
    .print-only{display:block;}
    .table-wrap{border:none; border-radius:0; max-height:none; overflow:visible;}
    table{min-width:0; font-size:11px;}
    thead th{background:#1F3864 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; color:#fff !important;}
    .badge{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    @page{ size: A4 landscape; margin:12mm; }
  }
  /* Mirrors @media print rules, applied via JS while capturing a screenshot for PDF export */
  body.generating-pdf .no-print{display:none !important;}
  body.generating-pdf .print-only{display:block !important;}
  body.generating-pdf .table-wrap{border:none; border-radius:0; max-height:none !important; overflow:visible !important;}
  body.generating-pdf .content{padding:0;}
  .print-header{display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--navy); padding-bottom:10px; margin-bottom:14px;}
  .print-header .pt-title{font-size:18px; font-weight:900; color:var(--navy);}
  .print-header .pt-meta{font-size:11px; color:#555;}

  /* ---------- Sortable table headers ---------- */
  thead th.sortable{cursor:pointer; user-select:none;}
  thead th.sortable:hover{background:var(--navy-light);}
  thead th .sort-ic{font-size:10px; opacity:.7; margin-inline-start:3px;}

  /* ---------- Photo widget ---------- */
  .photo-widget{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .photo-thumb{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .pdf-thumb-icon{
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fdecea; color:#c0392b; font-size:22px; gap:2px;
  }
  .pdf-thumb-icon span{font-size:9px; font-weight:800;}

  /* ---------- Calendar ---------- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-header-row{ margin-bottom:6px; }
  .cal-headcell{ text-align:center; font-weight:800; font-size:12px; color:var(--navy); padding:6px 0; }
  .cal-cell{ background:var(--card); border:1px solid var(--line); border-radius:8px; min-height:92px; padding:6px; display:flex; flex-direction:column; }
  .cal-cell.cal-empty{ background:transparent; border:none; }
  .cal-cell.cal-today{ border:2px solid var(--gold); background:#fffdf5; }
  .cal-daynum{ font-size:12px; font-weight:800; color:var(--text); margin-bottom:4px; }
  .cal-today-badge{ font-size:9px; background:var(--gold); color:var(--navy-dark); border-radius:8px; padding:1px 5px; font-weight:800; }
  .cal-events{ display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .cal-event{ font-size:10px; padding:2px 4px; border-radius:4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-event-more{ font-size:9.5px; color:var(--muted); padding:0 4px; }
  @media (max-width: 900px){
    .cal-cell{ min-height:60px; }
    .cal-event{ display:none; }
    .cal-daynum{ font-size:11px; }
  }
  /* ---------- QR modal ---------- */
  .qr-overlay{
    position:fixed; inset:0; background:rgba(10,14,25,.85); z-index:250;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .qr-box{ background:#fff; border-radius:16px; padding:24px; text-align:center; max-width:340px; width:100%; }
  .qr-box #qrCanvasWrap{ display:flex; justify-content:center; margin:14px 0; }
  .qr-video-wrap{ position:relative; width:100%; max-width:400px; border-radius:12px; overflow:hidden; background:#000; }
  .qr-video-wrap video{ width:100%; display:block; }
  .qr-scan-frame{ position:absolute; inset:15%; border:3px solid var(--gold); border-radius:12px; pointer-events:none; }
  .video-thumb-icon{ background:#eaf1ff !important; color:#2563eb !important; }
  .attach-status{
    position:absolute; bottom:2px; inset-inline-start:2px; font-size:11px; background:rgba(255,255,255,.9);
    border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center;
  }
  .attach-status.uploading{ animation: pulse 1.2s infinite; }
  .attach-status.failed{ background:rgba(255,235,230,.95); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb .rm{
    position:absolute; top:2px; inset-inline-end:2px; background:rgba(192,57,43,.9); color:#fff; border:none;
    width:18px; height:18px; border-radius:50%; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .photo-add-btn{
    width:64px; height:64px; border:1.5px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--muted); font-size:22px; background:#fafbfd;
  }
  .photo-count-chip{font-size:11px; background:var(--info-bg); color:var(--info); border-radius:10px; padding:2px 8px; white-space:nowrap;}

  /* ---------- Overdue tag ---------- */
  .overdue-tag{color:var(--danger); font-size:11px; font-weight:800; margin-inline-start:4px; white-space:nowrap;}

  /* ---------- KPI cards ---------- */
  .kpi-card .kpi-val{font-size:26px; font-weight:900; color:var(--navy);}
  .kpi-card .kpi-target{font-size:11px; color:var(--muted); margin-top:4px;}
  .kpi-bar{height:6px; border-radius:4px; background:#eef0f4; margin-top:8px; overflow:hidden;}
  .kpi-bar-fill{height:100%; border-radius:4px; background:var(--success);}
  .kpi-bar-fill.warn{background:var(--warning);}
  .kpi-bar-fill.bad{background:var(--danger);}

  /* ---------- Photo Lightbox ---------- */
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(10,14,25,.92); z-index:300;
    display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px;
  }
  .lightbox-img{ max-width:90vw; max-height:78vh; object-fit:contain; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox-pdf{ width:88vw; height:78vh; border:none; border-radius:8px; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox-close{
    position:absolute; top:18px; inset-inline-end:22px; background:rgba(255,255,255,.12); color:#fff; border:none;
    width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-close:hover{ background:rgba(255,255,255,.22); }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); color:#fff; border:none;
    width:48px; height:48px; border-radius:50%; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-nav:hover{ background:rgba(255,255,255,.22); }
  .lightbox-prev{ inset-inline-start:24px; }
  .lightbox-next{ inset-inline-end:24px; }
  .lightbox-counter{ color:#ddd; font-size:13px; margin-top:14px; }
  .lightbox-name{ color:#fff; font-size:13px; margin-top:6px; font-weight:700; }

  /* ---------- Mobile menu button ---------- */
  .menu-btn{display:none; background:var(--navy); color:#fff; border:none; border-radius:8px; width:38px; height:38px; font-size:18px; cursor:pointer;}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}

  /* ---------- Lock screen ---------- */
  .lock-screen{
    position:fixed; inset:0; background:linear-gradient(135deg,var(--navy),var(--navy-dark)); z-index:200;
    display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff; padding:20px;
  }
  .lock-box{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:16px; padding:34px 30px; width:100%; max-width:340px; text-align:center;}
  .lock-box .lg{font-weight:900; font-size:20px; margin-bottom:4px;}
  .lock-box .ls{font-size:12.5px; color:var(--gold-light); margin-bottom:20px;}
  .lock-box input{
    width:100%; text-align:center; font-size:22px; letter-spacing:8px; padding:12px; border-radius:10px; border:none;
    margin-bottom:14px; font-family:inherit;
  }
  .lock-box .err{color:#ffb4b4; font-size:12.5px; min-height:18px; margin-bottom:6px;}

  /* ---------- Notifications page ---------- */
  .step-card{display:flex; gap:12px; align-items:flex-start;}
  .step-num{
    width:26px; height:26px; min-width:26px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800;
  }
  .notif-status{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:20px;}
  .notif-status.on{background:var(--success-bg); color:var(--success);}
  .notif-status.off{background:#eef0f4; color:var(--muted);}
  .toggle-switch{position:relative; width:42px; height:24px; display:inline-block;}
  .toggle-switch input{opacity:0; width:0; height:0;}
  .toggle-slider{position:absolute; inset:0; background:#ccc; border-radius:24px; cursor:pointer; transition:.2s;}
  .toggle-slider:before{content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s;}
  .toggle-switch input:checked + .toggle-slider{background:var(--success);}
  .toggle-switch input:checked + .toggle-slider:before{transform:translateX(18px);}
  html[dir="rtl"] .toggle-switch input:checked + .toggle-slider:before{transform:translateX(-18px);}

  @media (max-width: 900px){
    .menu-btn{display:inline-flex; align-items:center; justify-content:center;}
    .sidebar{position:fixed; z-index:40; inset-inline-start:0; top:0; transform:translateX(100%);}
    html[dir="ltr"] .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay.open{display:block;}
    .form-grid{grid-template-columns:1fr;}
    .topbar{padding:12px 14px;}
    .content{padding:14px 14px 50px;}
    .modal{padding:18px 16px 20px;}
    .btn{padding:10px 14px;}
  }
  /* ---------- Quotes comparison widget ---------- */
  .quotes-widget{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .quote-row{display:flex; gap:8px; align-items:center; background:#fafbfd; border:1px solid var(--line); border-radius:8px; padding:8px;}
  .quote-row input[type=text], .quote-row input[type=number]{
    border:1.5px solid var(--line); border-radius:6px; padding:6px 8px; font-family:inherit; font-size:13px;
  }
  .quote-row input[type=text]{flex:2;}
  .quote-row input[type=number]{flex:1;}
  .quote-row label{display:flex; align-items:center; gap:4px; font-size:12px; white-space:nowrap;}

  /* ---------- Delay block ---------- */
  .delay-block{

  const v = STR[LANG][key];
  return typeof v === "function" ? v(...args) : v;
}
function setLang(l){
  LANG = l; localStorage.setItem("forka_lang", l);
  document.getElementById("htmlRoot").setAttribute("lang", l);

  applyStaticText();
  render();
}

function optLabel(val){
  if(!val) return "";
  if(LANG==="en") return OPT_EN[val.trim()] || val;
  return val;
}
function badge(val){
  if(!val) return "";
  const cls = STATUS_COLORS[val.trim()] || "badge-muted";
  return `<span class="badge ${cls}">${optLabel(val)}</span>`;
}

/* A conditional (showIf) field only belongs in the flat table/export view when the user has
   filtered the list to exactly the status value that field depends on. Otherwise it's mostly-empty
   clutter — it's still fully visible per-record via the "👁️ view" / edit form regardless. */
function isFieldRelevantForList(f, m, statusFilterValue, forceAll){
  if(!f.showIf) return true;
  if(forceAll) return true;
  return f.showIf.field === m.statusField && statusFilterValue === f.showIf.value;
}
function getListRelevantFields(m, statusFilterValue, forceAll){
  return m.fields.filter(f=> f.type!=="photo" && f.type!=="quotes" && isFieldRelevantForList(f, m, statusFilterValue, forceAll));
}

function translateText(text, targetLang){
  return new Promise((resolve)=>{
    if(!text || !text.toString().trim()){ resolve(text); return; }
    const srcLang = detectTextLang(text);
    if(srcLang === targetLang){ resolve(text); return; }
    const cacheKey = targetLang+"::"+text;
    if(translationCache[cacheKey]!==undefined){ resolve(translationCache[cacheKey]); return; }
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${srcLang}|${targetLang}`;
    fetch(url).then(r=>r.json()).then(data=>{
      const translated = (data && data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : text;
      translationCache[cacheKey] = translated;
      saveTranslationCache(translationCache);
      resolve(translated);
    }).catch(()=>{ resolve(text); });
  });
}
function autoTranslateDOM(root){
  if(!getAutoTranslateEnabled()) return;
  const scope = root || document;
  const els = scope.querySelectorAll('[data-autotranslate]');
  els.forEach(el=>{
    const original = el.dataset.original;
    if(!original || !original.trim()) return;
    if(detectTextLang(original) === LANG) return; // already matches current language, nothing to do
    el.style.transition = "opacity .15s";
    el.style.opacity = "0.45";
    translateText(original, LANG).then(translated=>{
      if(el.tagName==="INPUT" || el.tagName==="TEXTAREA"){ el.value = translated; }
      else { el.textContent = translated; }
      el.style.opacity = "1";
    });
  });
}

/* ---------------- KPI COMPUTATION ---------------- */
function computeKPIs(){
  const reqs = loadData("requests");
  const pm = loadData("pm");
  const veh = loadData("vehcheck");
  const amc = loadData("amc");

  // 1) Request closure rate
  const closedReqs = reqs.filter(r=>(r.status||"").trim()==="مغلق").length;
  const closureRate = reqs.length ? Math.round((closedReqs/reqs.length)*100) : null;

  // 2) Avg response time (minutes) between reportDate and arrival
  const withBoth = reqs.filter(r=>r.reportDate && r.arrival);
  let avgResponse = null;
  if(withBoth.length){
    const total = withBoth.reduce((s,r)=> s + Math.max(0,(new Date(r.arrival)-new Date(r.reportDate))/60000), 0);
    avgResponse = Math.round(total/withBoth.length);
  }

  // 3) PM on-time rate
  const pmRelevant = pm.filter(r=>["منجز في موعده","منجز متأخر","متأخر"].includes((r.status||"").trim()));
  const pmOnTime = pm.filter(r=>(r.status||"").trim()==="منجز في موعده").length;
  const pmRate = pmRelevant.length ? Math.round((pmOnTime/pmRelevant.length)*100) : null;

  // 4) Fleet readiness — latest check per plate within last 30 days
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const byPlate = {};
  veh.forEach(r=>{
    if(!r.plate || !r.date || new Date(r.date) < cutoff) return;
    if(!byPlate[r.plate] || new Date(r.date) > new Date(byPlate[r.plate].date)) byPlate[r.plate] = r;
  });
  const plates = Object.values(byPlate);
  const readyCount = plates.filter(r => r.tires!=="ضعيفة" && r.oil!=="تسريب" && r.brakes!=="تحتاج فحص").length;
  const fleetRate = plates.length ? Math.round((readyCount/plates.length)*100) : null;

  // 5) AMC active
  const amcActive = amc.filter(r=>(r.status||"").trim()==="ساري").length;

  return { closureRate, avgResponse, pmRate, fleetRate, amcActive, amcTotal: amc.length };
}

function getFilteredData(m){
  const ms = state.moduleState[m.key];
  let data = loadData(m.key);
  if(ms.status !== "all" && m.statusField){
    data = data.filter(r => (r[m.statusField]||"") === ms.status);
  }
  if(ms.search.trim()){
    const q = ms.search.trim().toLowerCase();
    data = data.filter(r => Object.values(r).some(v => (v||"").toString().toLowerCase().includes(q)));
  }
  if(m.dateFieldForReports && ms.dateRange && ms.dateRange.preset !== "all"){
    const range = ms.dateRange.preset === "custom"
      ? { from: ms.dateRange.from || todayStr(), to: ms.dateRange.to || todayStr() }
      : computeRangeDates(ms.dateRange.preset);
    const fromD = new Date(range.from), toD = new Date(range.to); toD.setHours(23,59,59,999);
    data = data.filter(r=>{
      if(!r[m.dateFieldForReports]) return false;
      const d = new Date(r[m.dateFieldForReports]);
      return d>=fromD && d<=toD;
    });
  }
  if(ms.sortKey){
    const f = m.fields.find(x=>x.key===ms.sortKey);
    data = [...data].sort((a,b)=>{
      let va = a[ms.sortKey]||"", vb = b[ms.sortKey]||"";
      if(f && f.type==="number"){ va = Number(va)||0; vb = Number(vb)||0; return (va-vb)*ms.sortDir; }
      return va.toString().localeCompare(vb.toString(), LANG==="ar"?"ar":"en") * ms.sortDir;
    });
  }
  return data;
}

  document.querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick = ()=>{ ms.activeTab = b.dataset.tab; renderModule(mKey); };
  });

  if(ms.activeTab==="report"){
    renderModuleReportTab(m);
  } else {
    renderModuleRecordsBody(m);
  }
}

function renderModuleRecordsBody(m){
  const mKey = m.key;
  const ms = state.moduleState[mKey];
  const statusOptions = m.statusField ? (m.fields.find(f=>f.key===m.statusField).options||[]) : [];

  const toolbarHtml = `
    <div class="toolbar no-print">
      <input type="text" id="searchInput" placeholder="${t('searchPlaceholder')}" value="${ms.search}">
      ${m.statusField ? `<select id="statusFilter">
        <option value="all">${t('allStatuses')}</option>
        ${statusOptions.map(o=>`<option value="${o}" ${ms.status===o?'selected':''}>${optLabel(o)}</option>`).join("")}
      </select>` : ""}
      ${m.dateFieldForReports ? `
      <select id="dateRangeFilter">
        <option value="all" ${ms.dateRange.preset==="all"?'selected':''}>${t('dateRangeAll')}</option>
        <option value="today" ${ms.dateRange.preset==="today"?'selected':''}>${t('mrToday')}</option>
        <option value="week" ${ms.dateRange.preset==="week"?'selected':''}>${t('mrWeek')}</option>
        <option value="month" ${ms.dateRange.preset==="month"?'selected':''}>${t('mrMonth')}</option>
        <option value="custom" ${ms.dateRange.preset==="custom"?'selected':''}>${t('mrCustom')}</option>
      </select>
      ${ms.dateRange.preset==="custom" ? `
        <input type="date" id="dateRangeFrom" value="${ms.dateRange.from}" style="border:1.5px solid var(--line); border-radius:8px; padding:8px 10px;">
        <input type="date" id="dateRangeTo" value="${ms.dateRange.to}" style="border:1.5px solid var(--line); border-radius:8px; padding:8px 10px;">
      ` : ""}` : ""}
      <button class="btn btn-outline btn-sm" id="btnToggleCols">${ms.showAllColumns===false ? t('showAllCols') : t('showEssentialCols')}</button>
      <div class="spacer"></div>
      <span style="font-size:12.5px;color:var(--muted)">${t('showingOf', getFilteredData(m).length, loadData(m.key).length)}</span>
    </div>
  `;

  const data = getFilteredData(m);
  const allFieldKeys = getListRelevantFields(m, ms.status).map(f=>f.key);
  const cols = ms.showAllColumns===false ? m.listColumns : allFieldKeys;
  const colLabel = k => {
    if(k==="weightedTotal") return t('rankingScore');
    return FL(m.fields.find(f=>f.key===k)) || k;
  };
  const sortArrow = k => ms.sortKey===k ? `<span class="sort-ic">${ms.sortDir===1?'▲':'▼'}</span>` : "";

  const tableHtml = `
    <div class="print-only print-header">
      <div class="pt-title">GROUP FORKA — ${ML(m,"name")}</div>
      <div class="pt-meta">${t('printedBy')}${new Date().toLocaleString(LANG==="ar"?"ar-EG":"en-GB")}${t('recordsCount')}${data.length}</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${cols.map(c=>`<th class="sortable no-print-sort" data-sort="${c}">${colLabel(c)}${sortArrow(c)}</th>`).join("")}
          <th class="no-print">${t('actions')}</th>
        </tr></thead>
        <tbody>
        ${data.length ? data.map(r=>{
          const overdue = isOverdue(m, r);
          const photoCount = (r.photos && r.photos.length) ? r.photos.length : 0;
          return `
          <tr class="clickable-row" data-rowid="${r.id}">
            ${cols.map(c=>{
              const f = m.fields.find(x=>x.key===c);
              let val = r[c]||"";
              if(f && f.type==="select"){
                val = badge(val);
                if(overdue && c===m.statusField) val += `<span class="overdue-tag">${overdueLabelFor(m)}</span>`;
                return `<td>${val}</td>`;
              }
              else if(f && f.type==="number") return `<td>${fmtMoney(val)}</td>`;
              else if(f && f.type==="textarea"){
                if(isTranslatableField(f) && val) return `<td class="desc-cell"><span data-autotranslate="1" data-original="${escapeAttr(val)}">${val}</span></td>`;
                return `<td class="desc-cell">${val}</td>`;
              }
              else if(f && isTranslatableField(f) && val){
                return `<td><span data-autotranslate="1" data-original="${escapeAttr(val)}">${val}</span></td>`;
              }
              return `<td>${val}</td>`;
            }).join("")}
            <td class="no-print"><div class="row-actions">
              ${photoCount? `<span class="photo-count-chip" data-photorow="${r.id}" style="cursor:zoom-in;">📷${photoCount}</span>`:""}
              ${m.qrEnabled? `<button class="btn btn-sm btn-outline" data-qrgen="${r.id}">🔖</button>`:""}
              <button class="btn btn-sm btn-outline" data-viewrec="${r.id}">${t('viewBtn')}</button>
              <button class="btn btn-sm btn-outline" data-edit="${r.id}">${t('edit')}</button>
              <button class="btn btn-sm btn-danger" data-del="${r.id}">${t('delete')}</button>
            </div></td>
          </tr>
        `;}).join("") : `<tr class="empty-row"><td colspan="${cols.length+1}">${t('emptyState', ML(m,"singular"))}</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  let rankingHtml = "";
  if(m.key==="contractorEval"){
    const all = loadData(m.key);
    const byContractor = {};
    all.forEach(r=>{
      if(!r.contractor) return;
      if(!byContractor[r.contractor]) byContractor[r.contractor] = [];
      byContractor[r.contractor].push(Number(r.weightedTotal)||0);
    });
    const ranked = Object.keys(byContractor).map(name=>{
      const scores = byContractor[name];
      const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
      return {name, avg: Math.round(avg*10)/10, count: scores.length};
    }).sort((a,b)=> b.avg-a.avg);
    if(ranked.length){
      rankingHtml = `
        <div class="section-title">${t('rankingTitle')}</div>
        <div class="table-wrap" style="margin-bottom:20px;">
          <table><thead><tr><th>#</th><th>${t('quotesCompany')}</th><th>${t('rankingScore')}</th><th>${t('rankingCount')}</th></tr></thead>
          <tbody>${ranked.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td><b>${r.avg}</b></td><td>${r.count}</td></tr>`).join("")}</tbody></table>
        </div>`;
    }
  }

  document.getElementById("moduleBody").innerHTML = toolbarHtml + rankingHtml + tableHtml;
  autoTranslateDOM(document.getElementById("moduleBody"));

  document.getElementById("btnAdd").onclick = ()=> openForm(m, null);
  document.getElementById("btnPrint").onclick = ()=> window.print();
  document.getElementById("btnExportPdf").onclick = ()=> exportModulePDF(m);
  document.getElementById("btnExport").onclick = ()=> exportModuleExcel(m);
  const si = document.getElementById("searchInput");
  si.oninput = ()=>{ ms.search = si.value; renderModuleRecordsBody(m); si.focus(); si.setSelectionRange(si.value.length, si.value.length); };
  const sf = document.getElementById("statusFilter");
  if(sf) sf.onchange = ()=>{ ms.status = sf.value; renderModuleRecordsBody(m); };
  const drf = document.getElementById("dateRangeFilter");
  if(drf) drf.onchange = ()=>{ ms.dateRange.preset = drf.value; renderModuleRecordsBody(m); };
  const drFrom = document.getElementById("dateRangeFrom");
  if(drFrom) drFrom.onchange = ()=>{ ms.dateRange.from = drFrom.value; renderModuleRecordsBody(m); };
  const drTo = document.getElementById("dateRangeTo");
  if(drTo) drTo.onchange = ()=>{ ms.dateRange.to = drTo.value; renderModuleRecordsBody(m); };
  document.getElementById("btnToggleCols").onclick = ()=>{
    ms.showAllColumns = ms.showAllColumns===false ? true : false;
    renderModuleRecordsBody(m);
  };

  document.querySelectorAll("th[data-sort]").forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.sort;
      if(ms.sortKey===key){ ms.sortDir *= -1; } else { ms.sortKey = key; ms.sortDir = 1; }
      renderModuleRecordsBody(m);
    };
  });

  document.querySelectorAll("tr.clickable-row[data-rowid]").forEach(tr=>{
    tr.onclick = (e)=>{
      if(e.target.closest("button, .photo-count-chip, a, input, select, textarea")) return;
      const rec = loadData(m.key).find(x=>x.id===tr.dataset.rowid);
      if(rec) openForm(m, rec, true);
    };
  });
  document.querySelectorAll("[data-photorow]").forEach(chip=>{
    chip.onclick = ()=>{
      const rec = loadData(m.key).find(x=>x.id===chip.dataset.photorow);
      if(rec && rec.photos && rec.photos.length) openLightbox(rec.photos, 0);
    };
  });
  document.querySelectorAll("[data-qrgen]").forEach(b=>{
    b.onclick = ()=>{
      const rec = loadData(m.key).find(x=>x.id===b.dataset.qrgen);
      if(rec) openQrGenerateModal(m, rec);
    };
  });
  document.querySelectorAll("[data-viewrec]").forEach(b=>{
    b.onclick = ()=>{
      const rec = loadData(m.key).find(x=>x.id===b.dataset.viewrec);
      openForm(m, rec, true);
    };
  });
  document.querySelectorAll("[data-edit]").forEach(b=>{
    b.onclick = ()=>{
      const rec = loadData(m.key).find(x=>x.id===b.dataset.edit);
      openForm(m, rec);
    };
  });
  document.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = ()=>{
      if(confirm(t('confirmDelete'))){
        const arr = loadData(m.key).filter(x=>x.id!==b.dataset.del);
        saveData(m.key, arr);
        cloudDeleteRecord(m.key, b.dataset.del);
        showToast(t('deleted'));
        renderModuleRecordsBody(m); renderNav();
      }
    };
  });
}

/* ---------------- FORM MODAL ---------------- */
function escapeHtml(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderCommentsList(comments){
  if(!comments || !comments.length) return `<div style="font-size:12.5px; color:var(--muted);">${t('commentsEmpty')}</div>`;
  return `<div style="display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto;">
    ${comments.slice().reverse().map(c=>`
      <div style="background:#fafbfd; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;">
        <div>${escapeHtml(c.text)}</div>
        <div style="font-size:10.5px; color:var(--muted); margin-top:4px;">${new Date(c.ts).toLocaleString(LANG==='ar'?'ar-EG':'en-GB')}</div>
      </div>
    `).join("")}
  </div>`;
}
function buildCommentsHtml(m, existingRec){
  if(!existingRec || !existingRec.id) return "";
  return `
    <div class="section-title" style="margin-top:18px;">${t('commentsTitle')}</div>
    <div id="commentsListWrap">${renderCommentsList(existingRec._comments)}</div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input type="text" id="newCommentInput" placeholder="${t('commentsPlaceholder')}" style="flex:1; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-family:inherit;">
      <button type="button" class="btn btn-primary btn-sm" id="btnAddComment">${t('commentsAdd')}</button>
    </div>
  `;
}
function bindCommentsHandlers(m, existingRec){
  const btn = document.getElementById("btnAddComment");
  if(!btn) return;
  btn.onclick = ()=>{
    const inp = document.getElementById("newCommentInput");
    const text = inp.value.trim();
    if(!text) return;
    const arr = loadData(m.key);
    const idx = arr.findIndex(x=>x.id===existingRec.id);
    if(idx>=0){
      if(!arr[idx]._comments) arr[idx]._comments = [];
      arr[idx]._comments.push({id:uid(), text, ts:Date.now()});
      saveData(m.key, arr);
      cloudPushRecord(m.key, arr[idx]);
      existingRec._comments = arr[idx]._comments;
      document.getElementById("commentsListWrap").innerHTML = renderCommentsList(arr[idx]._comments);
      inp.value = "";
    }
  };
}
function buildLinkedRecordsHtml(m, rec, viewMode){
  if(!viewMode || m.key!=="fleet" || !rec || !rec.plate || !rec.plate.trim()) return "";
  const plate = rec.plate.trim();
  const accidentsM = MODULES.find(x=>x.key==="accidents");
  const vehcheckM = MODULES.find(x=>x.key==="vehcheck");
  const accidents = loadData("accidents").filter(a=>(a.plate||"").trim()===plate)
    .sort((a,b)=> new Date(b.date||0)-new Date(a.date||0));
  const checks = loadData("vehcheck").filter(v=>(v.plate||"").trim()===plate)
    .sort((a,b)=> new Date(b.date||0)-new Date(a.date||0)).slice(0,10);

  const fl = (mod,key) => FL(mod.fields.find(f=>f.key===key));

  let html = `<div class="section-title" style="margin-top:18px;">${t('linkedViolationsTitle')}</div>`;
  html += accidents.length ? `
    <div class="table-wrap" style="margin-bottom:14px;"><table>
      <thead><tr><th>${fl(accidentsM,'date')}</th><th>${fl(accidentsM,'type')}</th><th>${fl(accidentsM,'desc')}</th><th>${fl(accidentsM,'status')}</th></tr></thead>
      <tbody>${accidents.map(a=>`<tr><td>${a.date||""}</td><td>${badge(a.type||"")}</td><td class="desc-cell">${a.desc||""}</td><td>${badge(a.status||"")}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">${t('noLinkedViolations')}</div>`;

  html += `<div class="section-title">${t('linkedChecksTitle')}</div>`;
  html += checks.length ? `
    <div class="table-wrap"><table>
      <thead><tr><th>${fl(vehcheckM,'date')}</th><th>${fl(vehcheckM,'tires')}</th><th>${fl(vehcheckM,'oil')}</th><th>${fl(vehcheckM,'docs')}</th></tr></thead>
      <tbody>${checks.map(c=>`<tr><td>${c.date||""}</td><td>${badge(c.tires||"")}</td><td>${badge(c.oil||"")}</td><td>${badge(c.docs||"")}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div style="font-size:12.5px; color:var(--muted);">${t('noLinkedChecks')}</div>`;

  return html;
}

function openForm(m, existing, viewMode){
  formViewOnly = !!viewMode;
  const isEdit = !!existing;
  const rec = existing ? {...existing} : {};
  if(!isEdit && m.numberField){
    const count = loadData(m.key).length + 1;
    const yr = new Date().getFullYear();
    rec[m.numberField] = `${m.numberPrefix}-${yr}-${String(count).padStart(3,"0")}`;
  }
  if(!isEdit){
    m.fields.forEach(f=>{
      if(f.type==="date" && (f.key==="date"||f.key==="reportDate")) rec[f.key] = todayStr();
      if(f.type==="datetime-local" && f.key==="reportDate"){
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        rec[f.key] = now.toISOString().slice(0,16);
      }
    });
  }

  formPhotos = (rec.photos && Array.isArray(rec.photos)) ? [...rec.photos] : [];
  formQuotes = (rec.quotes && Array.isArray(rec.quotes)) ? [...rec.quotes] : [];
  const dis = formViewOnly ? "disabled" : "";

  function renderFieldInput(f, val){
    if(f.type==="photo") return `<div id="photoWidget" class="photo-widget"></div><input type="file" id="photoFileInput" accept="image/*,application/pdf,video/*" multiple style="display:none">`;
    if(f.type==="quotes") return `<div id="quotesWidget" class="quotes-widget"></div>`;
    if(f.type==="select"){
      return `<select data-field="${f.key}" ${dis}>
        <option value=""></option>
        ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${optLabel(o)}</option>`).join("")}
      </select>`;
    }
    if(f.type==="textarea"){
      const atr = (formViewOnly && isTranslatableField(f) && val) ? `data-autotranslate="1" data-original="${escapeAttr(val)}"` : "";
      return `<textarea data-field="${f.key}" ${dis} ${atr}>${val}</textarea>`;
    }
    if(f.master){
      const atr = (formViewOnly && val) ? `data-autotranslate="1" data-original="${escapeAttr(val)}"` : "";
      return `<input type="text" data-field="${f.key}" value="${val}" list="dl_${f.master}" autocomplete="off" ${dis} ${atr}>`;
    }
    const atr = (formViewOnly && isTranslatableField(f) && val) ? `data-autotranslate="1" data-original="${escapeAttr(val)}"` : "";
    return `<input type="${f.type}" data-field="${f.key}" value="${val}" ${dis} ${atr}>`;
  }

  // group conditional fields by their (trigger field + trigger value) pair
  const condGroupsMap = {};
  m.fields.filter(f=>f.showIf).forEach(f=>{
    const gkey = f.showIf.field+"::"+f.showIf.value;
    (condGroupsMap[gkey] = condGroupsMap[gkey] || []).push(f);
  });

  const fieldsHtml = m.fields.filter(f=>!f.showIf).map(f=>{
    const val = rec[f.key]!==undefined ? rec[f.key] : "";
    const input = renderFieldInput(f, val);
    return `<div class="field ${f.full?'full':''}"><label>${FL(f)}${(f.required && !formViewOnly)?' *':''}</label>${input}</div>`;
  }).join("") + Object.entries(condGroupsMap).map(([gkey, groupFields])=>{
    const [triggerField, triggerValue] = gkey.split("::");
    const isDelay = triggerField==="status" && triggerValue==="متأخر";
    const groupDef = (m.conditionalGroups||[]).find(g=>g.field===triggerField && g.value===triggerValue);
    const titleText = groupDef ? (LANG==='ar'?groupDef.titleAr:groupDef.titleEn) : (isDelay ? t('delayBlockTitle') : (LANG==='ar'?`تفاصيل إضافية (${triggerValue})`:`Additional Details (${triggerValue})`));
    const blockClass = isDelay || (groupDef && groupDef.style==='danger') ? "delay-block"
      : (groupDef && groupDef.style==='success') ? "success-block" : "cond-block";
    const safeId = "condBlock_"+triggerField+"_"+triggerValue.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g,"");
    return `
    <div class="${blockClass}" id="${safeId}" data-condtrigger="${triggerField}" data-condvalue="${triggerValue}" style="display:none;">
      <div class="delay-title">${titleText}</div>
      <div class="form-grid">
        ${groupFields.map(f=>{
          const val = rec[f.key]!==undefined ? rec[f.key] : "";
          const input = renderFieldInput(f, val);
          return `<div class="field"><label>${FL(f)}${(f.required && !formViewOnly)?' *':''}</label>${input}</div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");

  const linkedRecordsHtml = buildLinkedRecordsHtml(m, rec, formViewOnly);
  const commentsHtml = isEdit ? buildCommentsHtml(m, existing) : "";

  const modalHtml = `
    ${buildDatalistsHtml()}
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h2>${formViewOnly? t('viewTitle') : (isEdit? t('editTitle') : t('addTitle'))}${ML(m,"singular")}</h2>
        <div class="modal-sub">${ML(m,"name")}${formViewOnly? "" : t('fieldsRequiredNote')}</div>
        <div class="form-grid">${fieldsHtml}</div>
        ${linkedRecordsHtml}
        ${commentsHtml}
        <div class="modal-actions">
          ${formViewOnly ? `
            <button class="btn btn-outline" id="btnCancel">${t('closeBtn')}</button>
            ${(m.qrEnabled && existing) ? `<button class="btn btn-gold" id="btnQrGenInModal">${t('qrGenerate')}</button>` : ""}
            <button class="btn btn-primary" id="btnSwitchToEdit">${t('edit')}</button>
          ` : `
            <button class="btn btn-outline" id="btnCancel">${t('cancel')}</button>
            ${isEdit? `<button class="btn btn-danger" id="btnDeleteInModal">${t('deleteRecord')}</button>` : ""}
            <button class="btn btn-primary" id="btnSave">${isEdit? t('saveEdits'):t('saveRecord')}</button>
          `}
        </div>
      </div>
    </div>
  `;
  document.getElementById("modalRoot").innerHTML = modalHtml;
  document.getElementById("btnCancel").onclick = closeModal;
  document.getElementById("modalOverlay").onclick = (e)=>{ if(e.target.id==="modalOverlay") closeModal(); };
  if(document.getElementById("photoWidget")) renderPhotoWidget();
  if(isEdit) bindCommentsHandlers(m, existing);
  if(formViewOnly) autoTranslateDOM(document.getElementById("modalRoot"));
  if(document.getElementById("quotesWidget")) renderQuotesWidget();

  const condBlocks = document.querySelectorAll("[data-condtrigger]");
  if(condBlocks.length){
    const triggerFieldNames = [...new Set([...condBlocks].map(b=>b.dataset.condtrigger))];
    const updateAllConditionalBlocks = ()=>{
      condBlocks.forEach(block=>{
        const triggerInput = document.querySelector(`[data-field="${block.dataset.condtrigger}"]`);
        block.style.display = (triggerInput && triggerInput.value===block.dataset.condvalue) ? "block" : "none";
      });
    };
    triggerFieldNames.forEach(tf=>{
      const triggerInput = document.querySelector(`[data-field="${tf}"]`);
      if(triggerInput) triggerInput.addEventListener("change", ()=>{
        updateAllConditionalBlocks();
        const groupDef = (m.conditionalGroups||[]).find(g=>g.field===tf && g.value===triggerInput.value);
        if(groupDef && groupDef.autoFillDateFields){
          groupDef.autoFillDateFields.forEach(fk=>{
            const el = document.querySelector(`[data-field="${fk}"]`);
            if(el && !el.value){
              const fdef = m.fields.find(f=>f.key===fk);
              if(fdef && fdef.type==="datetime-local"){
                const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
                el.value = now.toISOString().slice(0,16);
              } else {
                el.value = todayStr();
              }
            }
          });
        }
      });
    });
    updateAllConditionalBlocks();
  }
  if(formViewOnly){
    const btnSwitch = document.getElementById("btnSwitchToEdit");
    if(btnSwitch) btnSwitch.onclick = ()=>{ closeModal(); openForm(m, existing, false); };
    const btnQrInModal = document.getElementById("btnQrGenInModal");
    if(btnQrInModal) btnQrInModal.onclick = ()=> openQrGenerateModal(m, existing);
    return; // no save/delete wiring needed in view-only mode
  }
  if(isEdit){
    document.getElementById("btnDeleteInModal").onclick = ()=>{
      if(confirm(t('confirmDelete'))){
        const arr = loadData(m.key).filter(x=>x.id!==existing.id);
        saveData(m.key, arr);
        cloudDeleteRecord(m.key, existing.id);
        closeModal(); showToast(t('deleted'));
        renderModule(m.key); renderNav();
      }
    };
  }
  document.getElementById("btnSave").onclick = ()=>{
    if(anyPhotosUploading()){ alert(t('attachWaitToSave')); return; }
    const inputs = document.querySelectorAll("[data-field]");
    let newRec = isEdit ? {...existing} : { id: uid() };
    let missingRequired = [];
    inputs.forEach(inp=>{
      newRec[inp.dataset.field] = inp.value;
    });
    if(m.fields.some(f=>f.type==="photo")) newRec.photos = formPhotos.map(p=>{
      const isNonImage = isPdfAttachment(p) || isVideoAttachment(p);
      if(isNonImage && p.storageUrl){
        const { dataUrl, ...rest } = p; // uploaded successfully — drop the heavy local copy, keep the cloud link
        return { ...rest, dataUrl: null };
      }
      return p;
    });
    if(m.fields.some(f=>f.type==="quotes")) newRec.quotes = formQuotes;
    const statusVal = newRec[m.statusField];
    m.fields.forEach(f=>{
      if(!f.required) return;
      if(f.showIf){
        const triggerVal = newRec[f.showIf.field];
        if(triggerVal !== f.showIf.value) return; // not applicable, skip required check
      }
      if(!newRec[f.key]) missingRequired.push(FL(f));
    });
    if(missingRequired.length){
      alert(t('fillRequired') + missingRequired.join("\n"));
      return;
    }
    m.fields.forEach(f=>{ if(f.master && newRec[f.key]) addMasterValue(f.master, newRec[f.key]); });
    if(m.key==="contractorEval" && m.weights){
      let total = 0;
      Object.keys(m.weights).forEach(k=>{ total += (Number(newRec[k])||0) * m.weights[k]; });
      newRec.weightedTotal = Math.round(total*10)/10;
    }
    let arr = loadData(m.key);
    if(isEdit){
      arr = arr.map(x=> x.id===existing.id ? newRec : x);
    } else {
      arr.push(newRec);
    }
    saveData(m.key, arr);
    cloudPushRecord(m.key, newRec);
    if(m.key==="pm" && !newRec._nextCreated){
      const doneStatuses = ["منجز في موعده","منجز متأخر"];
      if(doneStatuses.includes((newRec.status||"").trim()) && newRec.frequency){
        if(autoScheduleNextPM(newRec)){
          newRec._nextCreated = true;
          let freshArr = loadData(m.key); // reload — autoScheduleNextPM already wrote a new record to storage
          freshArr = freshArr.map(x=> x.id===newRec.id ? newRec : x);
          saveData(m.key, freshArr);
          cloudPushRecord(m.key, newRec);
          showToast(t('pmAutoScheduledToast'));
        }
      }
    }
    closeModal();
    showToast(isEdit? t('savedEdits'):t('savedNew'));
    renderModule(m.key); renderNav();
  };
}
function autoScheduleNextPM(rec){
  const freqDays = { "يومي":1, "أسبوعي":7 };
  const freqMonths = { "شهري":1, "ربع سنوي":3, "نصف سنوي":6, "سنوي":12 };
  const freq = (rec.frequency||"").trim();
  if(!freqDays[freq] && !freqMonths[freq]) return false;
  const baseDate = rec.actualVisit ? new Date(rec.actualVisit) : new Date(todayStr());
  if(isNaN(baseDate.getTime())) return false;
  let nextDate = new Date(baseDate);
  if(freqDays[freq]) nextDate.setDate(nextDate.getDate()+freqDays[freq]);
  else nextDate.setMonth(nextDate.getMonth()+freqMonths[freq]);
  const newPm = {
    id: uid(),
    branch: rec.branch||"", equipment: rec.equipment||"", serviceType: rec.serviceType||"",
    frequency: rec.frequency, contractor: rec.contractor||"",
    lastVisit: rec.actualVisit || rec.nextVisit || "",
    nextVisit: nextDate.toISOString().slice(0,10),
    status: "مجدول",
  };
  const pmArr = loadData("pm");
  pmArr.push(newPm);
  saveData("pm", pmArr);
  cloudPushRecord("pm", newPm);
  return true;
}

function openLightbox(photos, startIndex){
  if(!photos || !photos.length) return;
  let idx = Math.max(0, Math.min(startIndex||0, photos.length-1));
  const root = document.getElementById("lightboxRoot");
  function render(){
    const p = photos[idx];
    const isPdf = isPdfAttachment(p);
    const isVideo = isVideoAttachment(p);
    const mediaSrc = p.dataUrl || p.storageUrl || "";
    const mediaHtml = isPdf
      ? `<iframe class="lightbox-pdf" src="${mediaSrc}" title="${p.name||'PDF'}"></iframe>`
      : isVideo
      ? `<video class="lightbox-img" src="${mediaSrc}" controls autoplay style="background:#000;"></video>`
      : `<img class="lightbox-img" src="${mediaSrc}" alt="${p.name||''}">`;
    root.innerHTML = `
      <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        ${photos.length>1 ? `<button class="lightbox-nav lightbox-prev" id="lightboxPrev">${LANG==='ar'?'›':'‹'}</button>` : ""}
        ${mediaHtml}
        ${photos.length>1 ? `<button class="lightbox-nav lightbox-next" id="lightboxNext">${LANG==='ar'?'‹':'›'}</button>` : ""}
        <div class="lightbox-name">${p.name||""}</div>
        ${photos.length>1 ? `<div class="lightbox-counter">${idx+1} / ${photos.length}</div>` : ""}
      </div>`;
    document.getElementById("lightboxClose").onclick = closeLightbox;
    document.getElementById("lightboxOverlay").onclick = (e)=>{ if(e.target.id==="lightboxOverlay") closeLightbox(); };
    const prevBtn = document.getElementById("lightboxPrev");
    const nextBtn = document.getElementById("lightboxNext");
    if(prevBtn) prevBtn.onclick = ()=>{ idx = (idx-1+photos.length)%photos.length; render(); };
    if(nextBtn) nextBtn.onclick = ()=>{ idx = (idx+1)%photos.length; render(); };
  }
  render();
  document.addEventListener("keydown", lightboxKeyHandler);
}
function lightboxKeyHandler(e){
  if(e.key==="Escape") closeLightbox();
}
function closeLightbox(){
  document.getElementById("lightboxRoot").innerHTML = "";
  document.removeEventListener("keydown", lightboxKeyHandler);
}

let qrScanStream = null;
function openQrScanModal(){
  if(!window.jsQR){ alert(t('qrCameraError')); return; }
  const root = document.getElementById("qrRoot");
  root.innerHTML = `
    <div class="qr-overlay" id="qrOverlay">
      <div class="qr-box" style="max-width:420px;">
        <div style="font-weight:900; color:var(--navy); font-size:14px; margin-bottom:10px;">${t('qrScanTitle')}</div>
        <div class="qr-video-wrap"><video id="qrVideo" playsinline autoplay muted></video><div class="qr-scan-frame"></div></div>
        <div style="font-size:11.5px; color:var(--muted); margin-top:10px;">${t('qrScanInstructions')}</div>
        <button class="btn btn-outline btn-sm" id="btnQrScanClose" style="margin-top:10px;">${t('qrClose')}</button>
      </div>
    </div>`;
  document.getElementById("btnQrScanClose").onclick = closeQrScan;
  document.getElementById("qrOverlay").onclick = (e)=>{ if(e.target.id==="qrOverlay") closeQrScan(); };

  navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(stream=>{
    qrScanStream = stream;
    const video = document.getElementById("qrVideo");
    if(!video) { stream.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject = stream;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    function tick(){
      if(!document.getElementById("qrVideo")) return; // modal closed
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if(code && code.data){ handleQrScanResult(code.data); return; }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }).catch(()=>{ alert(t('qrCameraError')); closeQrScan(); });
}
function closeQrScan(){
  if(qrScanStream){ qrScanStream.getTracks().forEach(t=>t.stop()); qrScanStream = null; }
  document.getElementById("qrRoot").innerHTML = "";
}
function handleQrScanResult(data){
  closeQrScan();
  const parts = (data||"").split("::");
  if(parts.length===3 && parts[0]==="FORKA"){
    const [, moduleKey, recId] = parts;
    const mod = MODULES.find(x=>x.key===moduleKey);
    const rec = mod ? loadData(moduleKey).find(r=>r.id===recId) : null;
    if(mod && rec){
      state.view = moduleKey;
      render();
      setTimeout(()=> openForm(mod, rec, true), 50);
      return;
    }
  }
  alert(t('qrNotFound'));
}

function isPdfAttachment(p){ return p && ((p.dataUrl||"").startsWith("data:application/pdf") || /\.pdf$/i.test(p.name||"")); }
function isVideoAttachment(p){ return p && ((p.dataUrl||"").startsWith("data:video/") || /\.(mp4|mov|webm|avi|mkv|m4v)$/i.test(p.name||"")); }
function resizeImageDataUrl(dataUrl, maxDim){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h = Math.max(1, Math.round(h*maxDim/w)); w = maxDim; }
          else { w = Math.max(1, Math.round(w*maxDim/h)); h = maxDim; }
        }
        try{
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = ()=> resolve(dataUrl);
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
function anyPhotosUploading(){ return formPhotos.some(p=>p.uploading); }
function startAttachmentUpload(entry, file){
  entry.uploading = true;
  entry.uploadFailed = false;
  entry.progress = 0;
  renderPhotoWidget();
  uploadAttachmentFile(file, (pct)=>{
    const found = formPhotos.find(p=>p._tempId===entry._tempId);
    if(found){ found.progress = pct; renderPhotoWidget(); }
  }).then(url=>{
    const found = formPhotos.find(p=>p._tempId===entry._tempId);
    if(found){
      found.uploading = false;
      if(url){ found.storageUrl = url; found.uploadFailed = false; }
      else { found.uploadFailed = true; found._retryFile = file; }
      renderPhotoWidget();
    }
  });
}

function renderPhotoWidget(){
  const w = document.getElementById("photoWidget");
  if(!w) return;
  w.innerHTML = formPhotos.map((p,i)=>{

    const isVideo = isVideoAttachment(p);
    const thumbInner = isPdf

      : isVideo
      ? `<div class="pdf-thumb-icon video-thumb-icon" data-viewphoto="${i}" style="cursor:zoom-in;">🎬<span>${t('attachVideoLabel')}</span></div>`
      : `<img src="${p.dataUrl || p.storageUrl || ''}" alt="${p.name||''}" data-viewphoto="${i}" style="cursor:zoom-in;">`;
    const statusBadge = p.uploading
      ? `<span class="attach-status uploading" title="${t('attachUploading')}" style="width:auto; padding:0 3px; font-size:9px; font-weight:800;">${(p.progress||0)}%</span>`
      : p.uploadFailed
      ? `<span class="attach-status failed" data-retryupload="${i}" title="${t('attachUploadFailed')}" style="cursor:pointer;">⚠️</span>`
      : (p.storageUrl ? `<span class="attach-status linked" title="${t('attachLinked')}">☁️</span>` : "");
    return `<div class="photo-thumb">${thumbInner}${statusBadge}${formViewOnly?'':`<button class="rm" data-rmphoto="${i}">✕</button>`}</div>`;
  }).join("") + (formViewOnly ? (formPhotos.length? "" : `<div style="font-size:12.5px; color:var(--muted);">${t('photosNone')}</div>`) : `<div class="photo-add-btn" id="photoAddBtn">+</div>`);
  document.querySelectorAll("[data-viewphoto]").forEach(img=>{
    img.onclick = ()=> openLightbox(formPhotos, Number(img.dataset.viewphoto));
  });
  document.querySelectorAll("[data-retryupload]").forEach(b=>{
    b.onclick = ()=>{
      const idx = Number(b.dataset.retryupload);
      const entry = formPhotos[idx];
      if(entry && entry._retryFile){ startAttachmentUpload(entry, entry._retryFile); }
    };
  });
  updateSaveButtonAvailability();
  if(formViewOnly) return;
  document.getElementById("photoAddBtn").onclick = ()=> document.getElementById("photoFileInput").click();
  document.querySelectorAll("[data-rmphoto]").forEach(b=>{
    b.onclick = ()=>{ formPhotos.splice(Number(b.dataset.rmphoto),1); renderPhotoWidget(); };
  });
  const fi = document.getElementById("photoFileInput");
  if(fi) fi.onchange = (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const willUploadAll = hasAnyUploadServiceConfigured();
    const LOCAL_ONLY_MAX_BYTES = 3 * 1024 * 1024; // 3MB — safe ceiling when there's no cloud service to offload to
    // Only PDFs (non-images) truly need this local-size guard now, since images always get compressed to a small thumbnail.
    const tooLarge = !willUploadAll ? files.filter(f=> !f.type.startsWith("image/") && f.size > LOCAL_ONLY_MAX_BYTES) : [];
    if(tooLarge.length){
      alert(t('attachFileTooLargeNoCloud', tooLarge.map(f=>f.name).join(", ")));
      const okFiles = files.filter(f=> f.type.startsWith("image/") || f.size <= LOCAL_ONLY_MAX_BYTES);
      if(!okFiles.length){ fi.value = ""; return; }
      files.length = 0; files.push(...okFiles);
    }
    let remaining = files.length;
    files.forEach(file=>{
      const reader = new FileReader();
      const isImage = file.type.startsWith("image/");
      reader.onload = ()=>{
        const originalDataUrl = reader.result;
        const willUpload = hasAnyUploadServiceConfigured();
        // Keep the local copy in memory for the whole editing session (so a failed upload never loses the file) —
        // heavy non-image copies only get stripped at save-time, and only once the cloud upload has actually succeeded.
        const entry = {name:file.name, dataUrl:originalDataUrl, uploading: willUpload, _tempId: uid()};
        formPhotos.push(entry);
        remaining--;
        if(remaining===0){ renderPhotoWidget(); }

        // Images are always compressed down to a small thumbnail for local storage — keeps things light
        // regardless of cloud status, while still giving Excel something to embed (with the hyperlink attached).
        if(isImage){
          resizeImageDataUrl(originalDataUrl, 220).then(smallUrl=>{
            const found = formPhotos.find(p=>p._tempId===entry._tempId);
            if(found){ found.dataUrl = smallUrl; renderPhotoWidget(); }
          });
        }

        if(willUpload){
          startAttachmentUpload(entry, file);
        }
      };
      reader.readAsDataURL(file);
    });
    fi.value = "";
  };
}

async function translateValueForExport(f, val){
  if(!val) return val;
  if(f.type === "select") return optLabel(val);
  if(isTranslatableField(f) && getAutoTranslateEnabled()) return await translateText(val, LANG);
  return val;
}
async function rowsToTranslatedSheetData(m, records, statusFilterValue, forceAll){
  const rows = [];
  const exportFields = getListRelevantFields(m, statusFilterValue, forceAll);
  for(const r of records){
    const row = {};
    for(const f of exportFields){
      const raw = r[f.key]||"";
      let display = await translateValueForExport(f, raw);
      if(f.key===m.statusField && isOverdue(m,r) && display){
        display = display + (LANG==='ar' ? " (متأخر ⏰)" : " (Overdue ⏰)");
      }
      row[FL(f)] = display;
    }
    rows.push(row);
  }
  return rows;
}
async function moduleToSheetData(m, recordsOverride, statusFilterValue, forceAll){
  const raw = recordsOverride || loadData(m.key);
  const rows = await rowsToTranslatedSheetData(m, raw, statusFilterValue, forceAll);
  return { rows, raw };
}

/* ---- Branded, professional Excel styling (ExcelJS) ---- */
const XL_NAVY = "FF1F3864", XL_GOLD = "FFC9A24B", XL_LIGHT = "FFF2F2F2", XL_WHITE = "FFFFFFFF",
      XL_MUTED = "FF7F7F7F", XL_BORDER = "FFBFBFBF", XL_BORDER_LIGHT = "FFE2E6EE", XL_TEXT = "FF1C2433";
const EXCEL_BADGE_COLORS = {
  "badge-danger":  { fill:"FFFDECEA", font:"FFC0392B" },
  "badge-warning": { fill:"FFFFF6E0", font:"FFB8860B" },
  "badge-success": { fill:"FFE8F8EE", font:"FF1F8A4C" },
  "badge-info":    { fill:"FFEAF1FF", font:"FF2563EB" },

function excelColorForValue(rawVal){

function safeSheetName(name){ return (name||"Sheet").replace(/[\[\]:*?/\\]/g, " ").slice(0,31) || "Sheet"; }
function excelDateValue(raw, type){

/**
 * opts:
 *   fields: array of field defs parallel to headers (from module.fields, filtered), or null for plain sheets

 */
function dataUrlToBase64(dataUrl){ const i = dataUrl.indexOf(","); return i>=0 ? dataUrl.slice(i+1) : dataUrl; }
function excelImageExtension(dataUrl){
  if(dataUrl.startsWith("data:image/png")) return "png";
  if(dataUrl.startsWith("data:image/gif")) return "gif";

function addStyledSheet(workbook, sheetTitle, headers, rows, opts){
  opts = opts || {};
  const fields = opts.fields || null;
  const rawRecords = opts.rawRecords || null;
  const photoField = opts.photoField || null;
  const isRtl = LANG === "ar";
  const allHeaders = photoField ? [...headers, FL(photoField)] : headers;
  const ncols = Math.max(allHeaders.length, 1);
  const sheet = workbook.addWorksheet(safeSheetName(sheetTitle), { views: [{ rightToLeft: isRtl }] });

  sheet.properties.tabColor = { argb: XL_NAVY };
  sheet.pageSetup = { orientation:"landscape", fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2} };

  sheet.mergeCells(1,1,1,ncols);

  titleCell.font = { bold:true, size:16, color:{argb:XL_NAVY}, name:"Arial" };
  titleCell.alignment = { horizontal:"center", vertical:"middle" };
  sheet.getRow(1).height = 28;

  sheet.mergeCells(2,1,2,ncols);
  const subCell = sheet.getCell(2,1);
  subCell.value = (isRtl ? "تاريخ التصدير: " : "Export date: ") + new Date().toLocaleString(isRtl?"ar-EG":"en-GB")
    + (isRtl ? "   |   عدد السجلات: " : "   |   Records: ") + rows.length;
  subCell.font = { italic:true, size:10, color:{argb:XL_MUTED}, name:"Arial" };
  subCell.alignment = { horizontal:"center" };
  sheet.getRow(2).height = 18;

  const headerRowIdx = 3;
  const headerRow = sheet.getRow(headerRowIdx);
  allHeaders.forEach((h,i)=>{
    const cell = headerRow.getCell(i+1);
    cell.value = h;
    cell.font = { bold:true, color:{argb:XL_WHITE}, size:11, name:"Arial" };
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:XL_NAVY} };
    cell.alignment = { horizontal:"center", vertical:"middle", wrapText:true };
    cell.border = { top:{style:"thin",color:{argb:XL_BORDER}}, bottom:{style:"medium",color:{argb:XL_GOLD}}, left:{style:"thin",color:{argb:XL_BORDER}}, right:{style:"thin",color:{argb:XL_BORDER}} };
  });
  headerRow.height = 26;

  rows.forEach((rowObj, rIdx)=>{
    const excelRow = sheet.getRow(headerRowIdx+1+rIdx);
    const rawRec = rawRecords ? rawRecords[rIdx] : null;
    const isLastRow = rIdx === rows.length-1;
    const zebraFill = rIdx % 2 === 1 ? XL_LIGHT : null;
    headers.forEach((h,cIdx)=>{
      const cell = excelRow.getCell(cIdx+1);
      const f = fields ? fields[cIdx] : null;
      let statusColor = null;

      if(f && rawRec && (f.type==="date" || f.type==="datetime-local")){
        const dv = excelDateValue(rawRec[f.key], f.type);
        if(dv){ cell.value = dv; cell.numFmt = f.type==="datetime-local" ? "yyyy-mm-dd hh:mm" : "yyyy-mm-dd"; }
        else cell.value = "";
      } else if(f && f.type==="number"){
        const n = rawRec ? Number(rawRec[f.key]) : NaN;
        if(!isNaN(n) && rawRec && rawRec[f.key]!==undefined && rawRec[f.key]!==""){ cell.value = n; cell.numFmt = "#,##0.##"; }
        else cell.value = "";
      } else {
        cell.value = rowObj[h]!==undefined && rowObj[h]!==null ? rowObj[h] : "";
      }

      if(f && f.type==="select" && rawRec){
        statusColor = excelColorForValue(rawRec[f.key]);
      }

      cell.font = { name:"Arial", size:10.5, color:{argb: statusColor ? statusColor.font : XL_TEXT}, bold: !!statusColor };
      cell.alignment = { horizontal:"center", vertical:"middle", wrapText:true };
      cell.border = {
        top:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
        bottom:{style: isLastRow ? "medium" : "thin", color:{argb: isLastRow ? XL_NAVY : XL_BORDER_LIGHT}},
        left:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
        right:{style:"thin",color:{argb:XL_BORDER_LIGHT}}
      };
      cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb: statusColor ? statusColor.fill : (zebraFill || "FFFFFFFF")} };
    });

    if(photoField){
      const photoColIdx = allHeaders.length;
      const photoCell = excelRow.getCell(photoColIdx);
      photoCell.border = {
        top:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
        bottom:{style: isLastRow ? "medium" : "thin", color:{argb: isLastRow ? XL_NAVY : XL_BORDER_LIGHT}},
        left:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
        right:{style:"thin",color:{argb:XL_BORDER_LIGHT}}
      };
      photoCell.fill = { type:"pattern", pattern:"solid", fgColor:{argb: zebraFill || "FFFFFFFF"} };
      photoCell.alignment = { horizontal:"center", vertical:"middle", wrapText:true };

      const attachments = (rawRec && rawRec[photoField.key]) ? rawRec[photoField.key] : [];
      const images = attachments.filter(p=>!isPdfAttachment(p) && !isVideoAttachment(p));
      const pdfs = attachments.filter(p=>isPdfAttachment(p));
      const videos = attachments.filter(p=>isVideoAttachment(p));

      // Simple, standard, 100%-reliable approach: a plain clickable text hyperlink per attachment.
      // (No embedded picture — clicking any image/PDF/video's link opens it directly in the browser.)
      const lines = [];
      images.forEach((img,i)=>{
        if(img.storageUrl) lines.push({ text: `🔗 ${LANG==='ar'?'صورة':'Image'} ${images.length>1? i+1 : ''}`.trim(), url: img.storageUrl });
      });
      videos.forEach((vid,i)=>{
        if(vid.storageUrl) lines.push({ text: `🎬 ${vid.name || (LANG==='ar'?'فيديو':'Video')} ${videos.length>1? i+1 : ''}`.trim(), url: vid.storageUrl });
      });
      pdfs.forEach(pdf=>{
        if(pdf.storageUrl) lines.push({ text: `📄 ${pdf.name||'PDF'}`, url: pdf.storageUrl });
      });

      if(lines.length === 1){
        photoCell.value = { text: lines[0].text, hyperlink: lines[0].url };
        photoCell.font = { name:"Arial", size:9.5, color:{argb:"FF2563EB"}, underline:true };
      } else if(lines.length > 1){
        // Multiple attachments: first one becomes the cell's main hyperlink; the rest listed below it as plain text
        // (Excel cells support a single hyperlink each, so the primary attachment is the clickable one).
        photoCell.value = { text: lines.map(l=>l.text).join("\n"), hyperlink: lines[0].url };
        photoCell.font = { name:"Arial", size:9.5, color:{argb:"FF2563EB"}, underline:true };
      } else if(attachments.length){
        // Attachments exist but none uploaded to the cloud yet — nothing clickable to offer.
        photoCell.value = LANG==='ar' ? "📎 محفوظة محليًا فقط (بدون رابط سحابي)" : "📎 Stored locally only (no cloud link)";
        photoCell.font = { name:"Arial", size:9, color:{argb:XL_MUTED} };
      }
    }
  });

  allHeaders.forEach((h,i)=>{
    let maxLen = (h||"").toString().length;
    rows.forEach(r=>{
      const v = r[h];
      if(v!==undefined && v!==null){ const len = v.toString().length; if(len>maxLen) maxLen = len; }
    });
    const colWidth = photoField && i===allHeaders.length-1 ? 22 : Math.min(Math.max(maxLen+4, 12), 42);
    sheet.getColumn(i+1).width = colWidth;
  });

  if(allHeaders.length){
    sheet.autoFilter = { from:{row:headerRowIdx, column:1}, to:{row:headerRowIdx, column:ncols} };
  }
  sheet.views = [{ state:"frozen", ySplit: headerRowIdx, rightToLeft: isRtl }];
  return sheet;
}

async function exportElementToPDF(targetEl, filename){
  if(!window.html2canvas || !window.jspdf){
    alert(t('pdfLibMissing'));
    return;
  }
  document.body.classList.add("generating-pdf");
  await new Promise(r=>setTimeout(r, 60)); // let layout settle
  let canvas;
  try{
    canvas = await html2canvas(targetEl, { scale:2, backgroundColor:"#ffffff", useCORS:true });
  } finally {
    document.body.classList.remove("generating-pdf");
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:"landscape", unit:"pt", format:"a4" });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = canvas.height * imgWidth / canvas.width;
  const imgData = canvas.toDataURL("image/jpeg", 0.92);

  let heightLeft = imgHeight;
  let position = 0;
  pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }
  pdf.save(filename);
}

async function downloadWorkbook(workbook, filename){
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function moduleExportFields(m, statusFilterValue, forceAll){ return getListRelevantFields(m, statusFilterValue, forceAll); }
function moduleExportHeaders(m, statusFilterValue, forceAll){ return moduleExportFields(m, statusFilterValue, forceAll).map(f=>FL(f)); }
function modulePhotoField(m){ return m.fields.find(f=>f.type==="photo") || null; }

async function exportModuleExcel(m){
  showToast(t('exportPreparing'));
  const workbook = new ExcelJS.Workbook();
  const filtered = getFilteredData(m);
  const ms = state.moduleState[m.key];
  const statusFilter = ms ? ms.status : "all";
  const { rows, raw } = await moduleToSheetData(m, filtered, statusFilter);
  addStyledSheet(workbook, ML(m,"name"), moduleExportHeaders(m, statusFilter), rows, { fields: moduleExportFields(m, statusFilter), rawRecords: raw, photoField: modulePhotoField(m) });

  if(m.relatedExports && m.relatedExports.length){
    for(const rel of m.relatedExports){
      const relModule = MODULES.find(x=>x.key===rel.module);
      if(!relModule) continue;
      const matchValues = new Set(raw.map(r=>(r[rel.matchField]||"").trim()).filter(Boolean));
      if(!matchValues.size) continue;
      const relRecords = loadData(relModule.key).filter(r=> matchValues.has((r[rel.matchField]||"").trim()));
      if(!relRecords.length) continue;
      const relRows = await rowsToTranslatedSheetData(relModule, relRecords, null, true);
      const sheetTitle = LANG==='ar' ? rel.titleAr : rel.titleEn;
      addStyledSheet(workbook, sheetTitle, moduleExportHeaders(relModule, null, true), relRows, { fields: moduleExportFields(relModule, null, true), rawRecords: relRecords, photoField: modulePhotoField(relModule) });
    }
  }

  const suffix = (ms && ms.dateRange && ms.dateRange.preset!=="all") ? "_"+ms.dateRange.preset : "";
  await downloadWorkbook(workbook, `GroupForka_${m.key}${suffix}_${todayStr()}.xlsx`);
  showToast(t('exportedFile'));
}
async function exportAllExcel(){
  showToast(t('exportPreparing'));
  const workbook = new ExcelJS.Workbook();
  const summaries = [];
  for(const m of MODULES){
    const { rows, raw } = await moduleToSheetData(m, null, null, true);
    addStyledSheet(workbook, ML(m,"name"), moduleExportHeaders(m, null, true), rows, { fields: moduleExportFields(m, null, true), rawRecords: raw, photoField: modulePhotoField(m) });
    const alertCount = m.statusField ? raw.filter(r=> isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim())).length
                                      : raw.filter(r=> isOverdue(m,r)).length;
    summaries.push({ icon:m.icon, name:ML(m,"name"), count:raw.length, alertCount });
  }
  addCoverSheet(workbook, summaries);
  workbook.views = [{ activeTab: workbook.worksheets.length-1 }];
  await downloadWorkbook(workbook, `GroupForka_AllData_${todayStr()}.xlsx`);
  showToast(t('exportedAll'));
}

function getNotifConfig(){

  catch(e){ return {enabled:false, email:"", serviceId:"", templateId:"", publicKey:""}; }

function saveNotifConfig(cfg){ localStorage.setItem("forka_notif_config", JSON.stringify(cfg)); initEmailJsIfConfigured(); }
function getLastSentDate(){ return localStorage.getItem("forka_notif_lastsent") || ""; }
function setLastSentDate(){ localStorage.setItem("forka_notif_lastsent", todayStr()); }

function initEmailJsIfConfigured(){
  const cfg = getNotifConfig();
  if(cfg.publicKey && window.emailjs){
    try{ emailjs.init({publicKey: cfg.publicKey}); }catch(e){ try{ emailjs.init(cfg.publicKey); }catch(e2){} }
