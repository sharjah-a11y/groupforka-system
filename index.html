  const sf = document.getElementById("statusFilter");
  if(sf) sf.onchange = ()=>{ ms.status = sf.value; ms.page = 1; renderModuleRecordsBody(m); };
  const drf = document.getElementById("dateRangeFilter");
  if(drf) drf.onchange = ()=>{ ms.dateRange.preset = drf.value; ms.page = 1; renderModuleRecordsBody(m); };
  const drFrom = document.getElementById("dateRangeFrom");
  if(drFrom) drFrom.onchange = ()=>{ ms.dateRange.from = drFrom.value; ms.page = 1; renderModuleRecordsBody(m); };
  const drTo = document.getElementById("dateRangeTo");
  if(drTo) drTo.onchange = ()=>{ ms.dateRange.to = drTo.value; ms.page = 1; renderModuleRecordsBody(m); };
  document.getElementById("btnToggleCols").onclick = ()=>{
    ms.showAllColumns = ms.showAllColumns===false ? true : false;
    renderModuleRecordsBody(m);
  };
  const pagePrev = document.getElementById("pagePrev");
  if(pagePrev) pagePrev.onclick = ()=>{ ms.page = Math.max(1, ms.page-1); renderModuleRecordsBody(m); };
  const pageNext = document.getElementById("pageNext");
  if(pageNext) pageNext.onclick = ()=>{ ms.page = ms.page+1; renderModuleRecordsBody(m); };

  document.querySelectorAll("th[data-sort]").forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.sort;
      if(ms.sortKey===key){ ms.sortDir *= -1; } else { ms.sortKey = key; ms.sortDir = 1; }
      renderModuleRecordsBody(m);
    };
  });

  document.querySelectorAll("tr.clickable-row[data-rowid]").forEach(tr=>{
    tr.onclick = (e)=>{
      if(e.target.closest("button, .photo-count-chip, a, input, select, textarea")) return;
      const rec = loadData(m.key).find(x=>x.id===tr.dataset.rowid);
      if(rec) openForm(m, rec, true);
    };
  });
  document.querySelectorAll("[data-photorow]").forEach(chip=>{
    chip.onclick = ()=>{
      const rec = loadData(m.key).find(x=>x.id===chip.dataset.photorow);
      if(rec && rec.photos && rec.photos.length) openLightbox(rec.photos, 0);
    };
  });
  document.querySelectorAll("[data-photorow2]").forEach(chip=>{
    chip.onclick = ()=>{
      const rec = loadData(m.key).find(x=>x.id===chip.dataset.photorow2);
      const f2 = moduleSecondAttachmentField(m);
      if(rec && f2 && rec[f2.key] && rec[f2.key].length) openLightbox(rec[f2.key], 0);
    };
  });
  document.querySelectorAll("[data-qrgen]").forEach(b=>{
    b.onclick = ()=>{
      const rec = loadData(m.key).find(x=>x.id===b.dataset.qrgen);
      if(rec) openQrGenerateModal(m, rec);

  });
  document.querySelectorAll("[data-convertpm]").forEach(b=>{

function escapeHtml(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderCommentsList(comments){
  if(!comments || !comments.length) return `<div style="font-size:12.5px; color:var(--muted);">${t('commentsEmpty')}</div>`;
  return `<div style="display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto;">
    ${comments.slice().reverse().map(c=>`
      <div style="background:#fafbfd; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;">
        <div>${escapeHtml(c.text)}</div>
        <div style="font-size:10.5px; color:var(--muted); margin-top:4px;">${new Date(c.ts).toLocaleString(LANG==='ar'?'ar-EG':'en-GB')}</div>
      </div>
    `).join("")}
  </div>`;
}
function buildCommentsHtml(m, existingRec){
  if(!existingRec || !existingRec.id) return "";
  return `
    <div class="section-title" style="margin-top:18px;">${t('commentsTitle')}</div>
    <div id="commentsListWrap">${renderCommentsList(existingRec._comments)}</div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input type="text" id="newCommentInput" placeholder="${t('commentsPlaceholder')}" style="flex:1; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-family:inherit;">
      <button type="button" class="btn btn-primary btn-sm" id="btnAddComment">${t('commentsAdd')}</button>
    </div>
  `;
}
function bindCommentsHandlers(m, existingRec){
  const btn = document.getElementById("btnAddComment");
  if(!btn) return;
  btn.onclick = ()=>{
    const inp = document.getElementById("newCommentInput");
    const text = inp.value.trim();
    if(!text) return;
    const arr = loadDataRaw(m.key);
    const idx = arr.findIndex(x=>x.id===existingRec.id);
    if(idx>=0){
      if(!arr[idx]._comments) arr[idx]._comments = [];
      arr[idx]._comments.push({id:uid(), text, ts:Date.now()});
      saveData(m.key, arr);
      cloudPushRecord(m.key, arr[idx]);
      existingRec._comments = arr[idx]._comments;
      document.getElementById("commentsListWrap").innerHTML = renderCommentsList(arr[idx]._comments);
      inp.value = "";
    }
  };
}
function stepFilesHtml(files){
  const arr = Array.isArray(files) ? files : [];
  if(!arr.length) return "—";
  return arr.map(p=>{
    const href = p.storageUrl || p.dataUrl || "#";
    const body = isPdfAttachment(p) ? `<span style="font-size:22px;">📄</span>` : `<img src="${escapeAttr(p.dataUrl||p.storageUrl||'')}" alt="" style="width:34px; height:34px; object-fit:cover; border-radius:5px; border:1px solid var(--line); vertical-align:middle;">`;
    return `<a href="${escapeAttr(href)}" target="_blank" rel="noopener" title="${escapeAttr(p.name||"")}" style="display:inline-block; margin:2px;">${body}</a>`;
  }).join("");
}
function buildProjectOverviewHtml(rec){

      ${rec.owners.map(o=>`<tr><td><b>${autoTr(o.name)}</b></td><td>${autoTr(o.nationality||"")}</td><td>${o.share!=="" && o.share!==undefined ? escapeHtml(String(o.share))+"%" : "—"}</td><td>${escapeHtml(o.idNo||"—")}</td><td>${escapeHtml(o.phone||"—")}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${steps.length ? `<div style="font-size:13px; margin-bottom:12px;">📍 ${t('projOvCurrent')}: <b>${autoTr(cur ? cur.name : PROJECT_ALL_DONE_TEXT)}</b>${cur && cur.authority ? ` <span style="color:var(--muted);">(${autoTr(cur.authority)})</span>` : ""}</div>` : ""}
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
      ${card(t('projOvBudget'), cb.budget ? fmt2(cb.budget) : "—")}

      ${card(t('projOvRemaining'), remaining===null ? "—" : fmt2(remaining), remaining!==null && remaining<0 ? '#c0392b' : '#1f8a4c')}
    </div>`;
  if(!steps.length){
    html += `<div style="font-size:12.5px; color:var(--muted);">${t('projNoSteps')}</div>`;

async function exportProjectExcel(rec){
  showToast(t('exportPreparing'));
  const stillLocal = await uploadPendingAttachments(["projects","expenses"]);
  rec = loadData("projects").find(x=>x.id===rec.id) || rec;     // pick up the links that were just created
  const steps = Array.isArray(rec.steps) ? rec.steps : [];
  await prefetchExcelThumbs([...steps.flatMap(s=> [...(s.invoiceFiles||[]), ...(s.docFiles||[])]), ...collectAttachments(projectInvoices(rec), ["photos","docFiles"])]);
  const cb = projectCostBreakdown(rec);
  const owners = Array.isArray(rec.owners) ? rec.owners : [];
  const texts = [rec.projectName, rec.branch, rec.owner, rec.notes];
  steps.forEach(s=> texts.push(s.name, s.authority, s.notes));
  owners.forEach(o=> texts.push(o.name, o.nationality));
  cb.invoices.forEach(e=> texts.push(e.vendor, e.projectStep));
  const tr = await buildExportTranslator(texts);
  const pm = MODULES.find(x=>x.key==="projects");
  const pf = (k)=> { const f = pm.fields.find(x=>x.key===k); return f ? FL(f) : k; };
  const wb = new ExcelJS.Workbook();
  const done = steps.filter(s=>s.status==="تم").length;

  const sumRows = [
    [pf("projectName"), tr(rec.projectName)], [pf("type"), optLabel(rec.type||"")], [pf("branch"), tr(rec.branch||"")],
    [t('ownersTitle'), owners.map(o=> tr(o.name)).filter(Boolean).join(", ")], [pf("owner"), tr(rec.owner||"")],
    [pf("startDate"), rec.startDate||""], [pf("targetOpenDate"), rec.targetOpenDate||""], [pf("actualOpenDate"), rec.actualOpenDate||""], [pf("status"), optLabel(rec.status||"")],
    [t('projOvProgress'), steps.length ? Math.round(done/steps.length*100)+"%" : ""], [t('projOvBudget'), cb.budget||0], [t('projOvActual'), cb.actual],
    [t('projOvRemaining'), cb.budget ? round2(cb.budget-cb.actual) : ""], [t('projColInv'), cb.invoices.length],
  ].map(r=> ({[hs[0]]: r[0], [hs[1]]: r[1]}));
  addStyledSheet(wb, t('projSheetSummary'), hs, sumRows, {});
  if(owners.length){
    const ho = [t('ownerName'), t('ownerNationality'), t('ownerShare'), t('ownerId'), t('ownerPhone')];
    addStyledSheet(wb, t('projSheetOwners'), ho, owners.map(o=>({ [ho[0]]: tr(o.name), [ho[1]]: tr(o.nationality), [ho[2]]: o.share!=="" && o.share!==undefined ? Number(o.share)||0 : "", [ho[3]]: o.idNo||"", [ho[4]]: o.phone||"" })), {});
  }
  const h2 = ["#", t('projColStep'), t('projColAuthority'), t('projColStatus'), t('projColActual'), t('projColInv'), t('projColRef'), t('stepStarted'), t('projColDone'), t('stepNotes'), t('stepContractStart'), t('stepContractEnd')];
  const rows2 = cb.perStep.map((p,i)=>({ [h2[0]]:i+1, [h2[1]]:tr(p.step.name), [h2[2]]:tr(p.step.authority||""), [h2[3]]:optLabel(p.step.status||"لم يبدأ"),
    [h2[4]]:p.actual, [h2[5]]:p.invoices.length, [h2[6]]:p.step.refNo||"", [h2[7]]:p.step.startDate||"", [h2[8]]:p.step.doneDate||"", [h2[9]]:tr(p.step.notes||""),
    [h2[10]]:p.step.contractStart||"", [h2[11]]:p.step.contractEnd||"" }));
  addStyledSheet(wb, t('projSheetSteps'), h2, rows2, { rawRecords: cb.perStep, attachmentCols: [
    { label: t('projColInvFile'), files: (p)=> p.step.invoiceFiles || [] },
    { label: t('projColDocFile'), files: (p)=> p.step.docFiles || [] } ] });
  const h3 = [efl('expNo'), efl('date'), efl('invoiceNo'), efl('vendor'), efl('projectStep'), efl('category'), t('expXlNet'), t('expXlVat'), t('expXlTotal'), efl('paymentStatus'), efl('reviewStatus')];
  const rows3 = cb.invoices.map(e=>({ [h3[0]]:e.expNo||"", [h3[1]]:e.date||"", [h3[2]]:e.invoiceNo||"", [h3[3]]:tr(e.vendor||""), [h3[4]]:tr(e.projectStep||""), [h3[5]]:optLabel(e.category||""),
    [h3[6]]:round2(e.amount), [h3[7]]:round2(e.vat), [h3[8]]:round2(e.total), [h3[9]]:optLabel(e.paymentStatus||""), [h3[10]]:optLabel(e.reviewStatus||"جديدة") }));
  addStyledSheet(wb, t('projSheetInvoices'), h3, rows3, { rawRecords: cb.invoices, attachmentCols: [
    { label: t('projColInvFile'), files: (e)=> e.photos || [] },
    { label: t('projColDocFile'), files: (e)=> e.docFiles || [] } ] });
  await downloadWorkbook(wb, `GroupForka_Project_${String(rec.projectName||"project").replace(/[\\/:*?"<>|]+/g,"_")}_${todayStr()}.xlsx`);
  showToast(t('exportedAll'));

function computeHealthScore(purchasePrice, totalRepairCost, repairCount, purchaseDate){
  let score = 100;
  score -= Math.min(40, repairCount * 8);
  if(purchasePrice > 0) score -= Math.min(30, (totalRepairCost/purchasePrice)*100*0.5);
  if(purchaseDate){
    const d = new Date(purchaseDate);
    if(!isNaN(d.getTime())){
      const ageYears = (Date.now() - d.getTime()) / (365*24*60*60*1000);
      score -= Math.min(20, Math.max(0,ageYears) * 2);
    }
  }
  return Math.max(0, Math.min(100, Math.round(score)));
}
function healthColor(score){ return score >= 70 ? "#1f8a4c" : score >= 40 ? "#b8860b" : "#c0392b"; }
function buildHealthGaugeSvg(score){
  const color = healthColor(score);
  const r = 32, circumference = 2*Math.PI*r;
  const offset = circumference * (1 - score/100);
  return `<svg width="80" height="80" viewBox="0 0 80 80">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="#eef0f4" stroke-width="8"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${circumference.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" transform="rotate(-90 40 40)"/>
    <text x="40" y="46" text-anchor="middle" font-size="20" font-weight="900" fill="${color}" font-family="Arial">${score}</text>
  </svg>`;
}
function buildTimelineHtml(events){
  const sorted = events.filter(e=>e.date && !isNaN(new Date(e.date).getTime())).sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(!sorted.length) return `<div style="font-size:12.5px; color:var(--muted);">${t('timelineEmpty')}</div>`;

        <div style="width:18px; height:18px; border-radius:50%; background:${e.color||'#1F3864'}; z-index:1; border:3px solid #fff; box-shadow:0 0 0 1px var(--line);"></div>
        <div style="font-size:10.5px; color:var(--muted); margin-top:6px;">${(e.date||"").slice(0,10)}</div>
        <div style="font-size:12px; font-weight:700; text-align:center; margin-top:2px; max-width:130px;">${e.icon||''} ${escapeHtml(e.label||'')}</div>

function computePredictiveRisk(linkedRequests){
  const dated = linkedRequests.filter(r=>r.reportDate && !isNaN(new Date(r.reportDate).getTime()))
    .map(r=>new Date(r.reportDate)).sort((a,b)=>a-b);
  if(dated.length < 3) return null; // not enough history for a meaningful prediction
  let gaps = [];
  for(let i=1;i<dated.length;i++){ gaps.push((dated[i]-dated[i-1])/(24*60*60*1000)); }
  const avgInterval = gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const daysSinceLast = (Date.now()-dated[dated.length-1].getTime())/(24*60*60*1000);
  const ratio = avgInterval>0 ? daysSinceLast/avgInterval : 0;
  let level = "low";
  if(ratio >= 0.85) level = "high";
  else if(ratio >= 0.5) level = "medium";
  return { avgInterval:Math.round(avgInterval), daysSinceLast:Math.round(daysSinceLast), level };
}

function startVoiceInput(fieldKey, btn){
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){ alert(t('voiceInputUnsupported')); return; }
  const textarea = document.querySelector(`[data-field="${fieldKey}"]`);
  if(!textarea) return;
  const recognition = new SpeechRecognitionCtor();
  recognition.lang = LANG==='ar' ? "ar-SA" : "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  btn.classList.add("listening");
  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    textarea.value = textarea.value ? textarea.value + " " + transcript : transcript;
  };
  recognition.onerror = ()=>{ btn.classList.remove("listening"); };
  recognition.onend = ()=>{ btn.classList.remove("listening"); };
  try{ recognition.start(); }catch(e){ btn.classList.remove("listening"); alert(t('voiceInputUnsupported')); }
}
function renumberAllRecords(moduleKey){
  const m = MODULES.find(x=>x.key===moduleKey);
  if(!m || !m.numberField) return 0;
  const arr = loadDataRaw(moduleKey);
  const active = arr.filter(r=>!r._deleted);
  const dateFieldCandidate = m.dateFieldForReports || (m.fields.find(f=>f.type==="date"||f.type==="datetime-local")||{}).key;
  active.sort((a,b)=>{
    const da = dateFieldCandidate && a[dateFieldCandidate] ? new Date(a[dateFieldCandidate]).getTime() : (a._updatedAt||0);
    const db = dateFieldCandidate && b[dateFieldCandidate] ? new Date(b[dateFieldCandidate]).getTime() : (b._updatedAt||0);
    return da-db;
  });
  const yearCounters = {};
  active.forEach(r=>{
    const d = dateFieldCandidate && r[dateFieldCandidate] ? new Date(r[dateFieldCandidate]) : null;
    const yr = (d && !isNaN(d.getTime())) ? d.getFullYear() : new Date().getFullYear();
    yearCounters[yr] = (yearCounters[yr]||0) + 1;
    r[m.numberField] = `${m.numberPrefix}-${yr}-${String(yearCounters[yr]).padStart(3,"0")}`;
  });
  saveData(moduleKey, arr);
  active.forEach(r=> cloudPushRecord(moduleKey, r));
  return active.length;
}
function getNextRecordNumber(m){
  const yr = new Date().getFullYear();
  const activeNums = new Set(loadData(m.key).map(r=>r[m.numberField]).filter(Boolean));
  let n = activeNums.size + 1;
  let candidate = `${m.numberPrefix}-${yr}-${String(n).padStart(3,"0")}`;
  while(activeNums.has(candidate)){
    n++;
    candidate = `${m.numberPrefix}-${yr}-${String(n).padStart(3,"0")}`;
  }
  return candidate;
}

  const linkedRecordsHtml = buildLinkedRecordsHtml(m, rec, formViewOnly);
  const commentsHtml = isEdit ? buildCommentsHtml(m, existing) : "";

  const modalHtml = `
    ${buildDatalistsHtml()}
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h2>${formViewOnly? t('viewTitle') : (isEdit? t('editTitle') : t('addTitle'))}${ML(m,"singular")}</h2>
        <div class="modal-sub">${ML(m,"name")}${formViewOnly? "" : t('fieldsRequiredNote')}</div>
        ${m.key==="projects" ? linkedRecordsHtml : ""}
        <div class="form-grid">${fieldsHtml}</div>
        ${m.key==="projects" ? "" : linkedRecordsHtml}
        ${commentsHtml}
        <div class="modal-actions">
          ${formViewOnly ? `
            <button class="btn btn-outline" id="btnCancel">${t('closeBtn')}</button>
            ${(m.qrEnabled && existing) ? `<button class="btn btn-gold" id="btnQrGenInModal">${t('qrGenerate')}</button>` : ""}
            <button class="btn btn-primary" id="btnSwitchToEdit">${t('edit')}</button>
          ` : `
            <button class="btn btn-outline" id="btnCancel">${t('cancel')}</button>
            ${isEdit? `<button class="btn btn-danger" id="btnDeleteInModal">${t('deleteRecord')}</button>` : ""}
            <button class="btn btn-primary" id="btnSave">${isEdit? t('saveEdits'):t('saveRecord')}</button>
          `}
        </div>
      </div>
    </div>
  `;
  document.getElementById("modalRoot").innerHTML = modalHtml;
  document.getElementById("btnCancel").onclick = closeModal;
  document.getElementById("modalOverlay").onclick = (e)=>{ if(e.target.id==="modalOverlay") closeModal(); };
  if(document.getElementById("photoWidget")) renderPhotoWidget();
  if(document.getElementById("photoWidget2")) renderPhotoWidget2();
  document.querySelectorAll("[data-voicefield]").forEach(btn=>{
    btn.onclick = ()=> startVoiceInput(btn.dataset.voicefield, btn);
  });
  if(isEdit) bindCommentsHandlers(m, existing);
  if(formViewOnly) autoTranslateDOM(document.getElementById("modalRoot"));
  if(document.getElementById("quotesWidget")) renderQuotesWidget();
  m.fields.filter(f=>f.type==="branchMultiSelect").forEach(f=> renderBranchMultiWidget(f.key, rec[f.key]||""));
  if(m.key==="amc"){
    const recalcInstallment = ()=>{
      const valueInput = document.querySelector('[data-field="value"]');
      const countInput = document.querySelector('[data-field="installmentsCount"]');
      const amountInput = document.querySelector('[data-field="installmentAmount"]');
      if(!valueInput || !countInput || !amountInput) return;
      const totalValue = Number(valueInput.value) || 0;
      const count = Number(countInput.value) || 0;
      amountInput.value = count > 0 ? (Math.round((totalValue/count)*100)/100) : "";
    };
    const valueInput = document.querySelector('[data-field="value"]');
    const countInput = document.querySelector('[data-field="installmentsCount"]');
    if(valueInput) valueInput.addEventListener("input", recalcInstallment);
    if(countInput) countInput.addEventListener("input", recalcInstallment);
    recalcInstallment();
  }
  if(m.key==="expenses") wireExpenseForm(isEdit);
  if(m.key==="projects"){ wireProjectForm(isEdit); if(formViewOnly) bindProjectOverview(rec); }

  const condBlocks = document.querySelectorAll("[data-condtrigger]");
  if(condBlocks.length){
    const triggerFieldNames = [...new Set([...condBlocks].map(b=>b.dataset.condtrigger))];
    const updateAllConditionalBlocks = ()=>{
      condBlocks.forEach(block=>{
        const triggerInput = document.querySelector(`[data-field="${block.dataset.condtrigger}"]`);
        block.style.display = (triggerInput && triggerInput.value===block.dataset.condvalue) ? "block" : "none";
      });
    };
    triggerFieldNames.forEach(tf=>{
      const triggerInput = document.querySelector(`[data-field="${tf}"]`);
      if(triggerInput) triggerInput.addEventListener("change", ()=>{
        updateAllConditionalBlocks();
        const groupDef = (m.conditionalGroups||[]).find(g=>g.field===tf && g.value===triggerInput.value);
        if(groupDef && groupDef.autoFillDateFields){
          groupDef.autoFillDateFields.forEach(fk=>{
            const el = document.querySelector(`[data-field="${fk}"]`);
            if(el && !el.value){
              const fdef = m.fields.find(f=>f.key===fk);
              if(fdef && fdef.type==="datetime-local"){
                const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
                el.value = now.toISOString().slice(0,16);
              } else {
                el.value = todayStr();
              }
            }
          });
        }
      });
    });
    updateAllConditionalBlocks();
  }
  if(formViewOnly){
    const btnSwitch = document.getElementById("btnSwitchToEdit");
    if(btnSwitch) btnSwitch.onclick = ()=>{ closeModal(); openForm(m, existing, false); };
    const btnQrInModal = document.getElementById("btnQrGenInModal");
    if(btnQrInModal) btnQrInModal.onclick = ()=> openQrGenerateModal(m, existing);
    return; // no save/delete wiring needed in view-only mode
  }
  if(isEdit){
    document.getElementById("btnDeleteInModal").onclick = ()=>{
      if(confirm(t('confirmDeleteSoft'))){
        const raw = loadDataRaw(m.key);
        const idx = raw.findIndex(x=>x.id===existing.id);
        if(idx>=0){
          raw[idx]._deleted = true;
          raw[idx]._deletedAt = Date.now();
          saveData(m.key, raw);
          cloudPushRecord(m.key, raw[idx]);
          renumberAfterDelete(m, raw[idx]);
        }
        closeModal(); showToast(t('deletedToTrash'));
        renderModule(m.key); renderNav();
      }
    };
  }
  document.getElementById("btnSave").onclick = ()=>{
    if(anyPhotosUploading()){ alert(t('attachWaitToSave')); return; }
    const inputs = document.querySelectorAll("[data-field]");
    let newRec = isEdit ? {...existing} : { id: uid() };
    let missingRequired = [];
    inputs.forEach(inp=>{
      newRec[inp.dataset.field] = inp.value;
    });
    if(m.fields.some(f=>f.type==="photo")) newRec.photos = formPhotos.map(p=>{
      if(p.storageUrl){
        const { dataUrl, ...rest } = p; // uploaded successfully — drop the heavy local copy, keep the cloud link
        return { ...rest, dataUrl: null };
      }
      return p;
    });
    const photo2Field = m.fields.find(f=>f.type==="photo2");
    if(photo2Field) newRec[photo2Field.key] = formPhotos2.map(p=>{
      if(p.storageUrl){
        const { dataUrl, ...rest } = p;
        return { ...rest, dataUrl: null };
      }
      return p;
    });
    if(m.fields.some(f=>f.type==="quotes")) newRec.quotes = formQuotes;
    if(m.key==="projects"){
      newRec.owners = formOwners.filter(o=> (o.name||"").trim()).map(o=>({...o, name:o.name.trim()}));
      newRec.ownerNames = ownerNamesText(newRec.owners);
      const withShare = newRec.owners.filter(o=> o.share!=="" && o.share!==undefined);
      if(newRec.owners.length > 1 && withShare.length){
        const shareSum = round2(withShare.reduce((s,o)=> s + (Number(o.share)||0), 0));
        if(Math.abs(shareSum - 100) > 0.01 && !confirm(t('ownersShareWarn', shareSum))) return;
      }
      newRec.steps = formSteps.filter(s=> (s.name||"").trim()).map(s=>({...s, name: s.name.trim(),
        invoiceFiles: (s.invoiceFiles||[]).map(cleanAttachment), docFiles: (s.docFiles||[]).map(cleanAttachment)}));
      Object.assign(newRec, projectComputed(newRec));
    }
    const statusVal = newRec[m.statusField];
    m.fields.forEach(f=>{
      if(!f.required) return;
      if(f.showIf){
        const triggerVal = newRec[f.showIf.field];
        if(triggerVal !== f.showIf.value) return; // not applicable, skip required check
      }
      if(!newRec[f.key]) missingRequired.push(FL(f));
    });
    if(missingRequired.length){
      alert(t('fillRequired') + missingRequired.join("\n"));
      return;
    }
    if(m.key==="expenses"){
      newRec.total = String(round2((Number(newRec.amount)||0) + (Number(newRec.vat)||0)));
      if(!newRec.accountingMonth) newRec.accountingMonth = String(newRec.date||"").slice(0,7);
      if(!newRec.reviewStatus) newRec.reviewStatus = "جديدة";
      if((newRec.splitMode||"").trim()===EXPENSE_SPLIT_CUSTOM){
        const picked = splitBranchNames(newRec.branch);
        const typed = parseAllocations(newRec.allocations).filter(a=> picked.includes(a.branch));
        const sum = round2(typed.reduce((s,a)=> s + (Number(a.total!==undefined?a.total:a.amount)||0), 0));
        if(Math.abs(sum - Number(newRec.total)) > 0.01){ alert(t('expAllocMismatch', sum.toFixed(2), Number(newRec.total).toFixed(2))); return; }
      }
      const allocs = computeExpenseAllocations(newRec);
      newRec.allocations = allocs;
      newRec.allocationText = expenseAllocationText(allocs);
    }
    if(!isEdit){
      const dupMsg = checkForLikelyDuplicate(m, newRec);
      if(dupMsg && !confirm(dupMsg)) return;
    }
    if(isEdit){
      const currentStored = loadData(m.key).find(x=>x.id===existing.id);
      if(currentStored && openedAtVersion && currentStored._updatedAt && currentStored._updatedAt !== openedAtVersion){
        if(!confirm(t('syncConflictWarning'))) return;
      }
    }
    m.fields.forEach(f=>{
      if(!f.master || !newRec[f.key]) return;
      if(f.master === "branches"){
        splitBranchNames(newRec[f.key]).forEach(b=> addMasterValue("branches", b));
      } else {
        addMasterValue(f.master, newRec[f.key]);
      }
    });
    if(m.key==="accidents"){
      // link the accident/violation to its vehicle (by plate), canonicalize the plate spelling, and default the driver
      const veh = (newRec.plate||"").trim() ? loadData("fleet").find(v=> platesMatch(v.plate, newRec.plate)) : null;
      if(veh){
        newRec.linkedVehicleId = veh.id;
        newRec.plate = veh.plate.trim();
        if(!(newRec.driver||"").trim() && (veh.driver||"").trim()) newRec.driver = veh.driver.trim();
      } else {
        newRec.linkedVehicleId = null;
      }
    }
    if(m.key==="requests"){
      const findVehicleByText = (text)=>{
        const t = (text||"").trim().toLowerCase();
        if(!t) return null;
        return loadData("fleet").find(v=>{
          const plain = (v.carName||"").trim().toLowerCase();
          const withPlate = v.plate ? `${plain} — ${v.plate.trim().toLowerCase()}` : plain;
          return plain === t || withPlate === t;
        });
      };
      if(newRec.linkedAssetName){
        const explicitAsset = loadData("assets").find(a=> (a.name||"").trim() === newRec.linkedAssetName.trim());
        const explicitVehicle = !explicitAsset ? findVehicleByText(newRec.linkedAssetName) : null;
        newRec.linkedAssetId = explicitAsset ? explicitAsset.id : null;
        newRec.linkedVehicleId = explicitVehicle ? explicitVehicle.id : null;
      } else if(newRec.equipment){
        const matchedAsset = loadData("assets").find(a=> (a.name||"").trim().toLowerCase() === newRec.equipment.trim().toLowerCase());
        const matchedVehicle = !matchedAsset ? findVehicleByText(newRec.equipment) : null;
        newRec.linkedAssetId = matchedAsset ? matchedAsset.id : null;
        newRec.linkedVehicleId = matchedVehicle ? matchedVehicle.id : null;
      } else {
        newRec.linkedAssetId = null;
        newRec.linkedVehicleId = null;
      }
    }
    const AMC_FREQUENCY_DAYS = { "أسبوعيًا":7, "كل أسبوعين":14, "شهريًا":30, "كل شهرين":60, "كل 3 أشهر":90, "كل 6 أشهر":180, "سنويًا":365 };
    if(m.key==="amc" && newRec.lastVisit && AMC_FREQUENCY_DAYS[newRec.visits]){
      const intervalDays = AMC_FREQUENCY_DAYS[newRec.visits];
      const next = new Date(newRec.lastVisit);
      next.setDate(next.getDate() + intervalDays);
      newRec.nextVisit = next.toISOString().slice(0,10);
    }
    if(m.key==="amc" && newRec.payment==="دفعات"){
      const totalValue = Number(newRec.value) || 0;
      const count = Number(newRec.installmentsCount) || 0;
      newRec.installmentAmount = count > 0 ? Math.round((totalValue/count)*100)/100 : "";
    } else if(m.key==="amc"){
      newRec.installmentAmount = "";
    }
    if(m.key==="contractorEval" && m.weights){
      let total = 0;
      Object.keys(m.weights).forEach(k=>{ total += (Number(newRec[k])||0) * m.weights[k]; });
      newRec.weightedTotal = Math.round(total*10)/10;
    }
    if(!isEdit && m.numberField){
      // Final safety check right before persisting: if another device created a record with this
      // exact number in the time between opening this form and saving it, bump to the next free one.
      const currentActiveNums = new Set(loadData(m.key).map(r=>r[m.numberField]).filter(Boolean));
      if(currentActiveNums.has(newRec[m.numberField])){
        newRec[m.numberField] = getNextRecordNumber(m);
      }
    }
    newRec._updatedAt = Date.now();
    let arr = loadDataRaw(m.key);
    if(isEdit){
      arr = arr.map(x=> x.id===existing.id ? newRec : x);
    } else {
      arr.push(newRec);
    }
    saveData(m.key, arr);
    cloudPushRecord(m.key, newRec);
    if(m.key==="projects"){ const sent = finalizeProjectAfterSave(newRec); if(sent) setTimeout(()=> showToast(t('projInvoicesSent', sent)), 2500); }   // after the generic 'saved' toast
    if(m.key==="requests"){
      if(!isEdit && (m.alertValues||[]).includes((newRec.status||"").trim())){
        fireWebhook("critical_item_created", { module:m.key, branch:newRec.branch, issue:newRec.issue, status:newRec.status });
      }
      if(newRec.status==="مغلق" && (!isEdit || (existing && existing.status!=="مغلق"))){
        fireWebhook("request_closed", { module:m.key, branch:newRec.branch, cost:newRec.cost, rootCause:newRec.rootCause });
      }
    }
    if(m.key==="pm" && !newRec._nextCreated){
      const doneStatuses = ["منجز في موعده","منجز متأخر"];
      if(doneStatuses.includes((newRec.status||"").trim()) && newRec.frequency){
        if(autoScheduleNextPM(newRec)){
          newRec._nextCreated = true;
          let freshArr = loadDataRaw(m.key); // reload — autoScheduleNextPM already wrote a new record to storage
          freshArr = freshArr.map(x=> x.id===newRec.id ? newRec : x);
          saveData(m.key, freshArr);
          cloudPushRecord(m.key, newRec);
          showToast(t('pmAutoScheduledToast'));
        }
      }
    }
    closeModal();
    showToast(isEdit? t('savedEdits'):t('savedNew'));
    if(m.key==="expenses") refreshProjectsComputed();
    if(m.key==="expenses" && state.view==="expenseReport") renderExpenseReportPage();
    else if(m.key==="expenses" && state.view==="projects") renderModule("projects");
    else renderModule(m.key);
    renderNav();
  };
}
function autoScheduleNextPM(rec){
  const freqDays = { "يومي":1, "أسبوعي":7 };
  const freqMonths = { "شهري":1, "ربع سنوي":3, "نصف سنوي":6, "سنوي":12 };
  const freq = (rec.frequency||"").trim();
  if(!freqDays[freq] && !freqMonths[freq]) return false;
  const baseDate = rec.actualVisit ? new Date(rec.actualVisit) : new Date(todayStr());
  if(isNaN(baseDate.getTime())) return false;
  let nextDate = new Date(baseDate);
  if(freqDays[freq]) nextDate.setDate(nextDate.getDate()+freqDays[freq]);
  else nextDate.setMonth(nextDate.getMonth()+freqMonths[freq]);
  const newPm = {
    id: uid(),
    branch: rec.branch||"", equipment: rec.equipment||"", serviceType: rec.serviceType||"",
    frequency: rec.frequency, contractor: rec.contractor||"",
    lastVisit: rec.actualVisit || rec.nextVisit || "",
    nextVisit: nextDate.toISOString().slice(0,10),
    status: "مجدول",
  };
  const pmArr = loadDataRaw("pm");
  pmArr.push(newPm);
  saveData("pm", pmArr);
  cloudPushRecord("pm", newPm);
  return true;
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; formPhotos = []; formPhotos2 = []; formQuotes = []; formViewOnly = false; }
function expenseDuplicateMessage(newRec){
  const v = (newRec.vendor||"").trim().toLowerCase(), no = (newRec.invoiceNo||"").trim().toLowerCase();
  if(!v || !no) return null;
  const match = loadData("expenses").find(r=> r.id!==newRec.id && (r.vendor||"").trim().toLowerCase()===v && (r.invoiceNo||"").trim().toLowerCase()===no);
  return match ? t('expDuplicateMsg', match.expNo||"") : null;
}
function checkForLikelyDuplicate(m, newRec){
  if(m.key==="expenses") return expenseDuplicateMessage(newRec);
  const keyFields = [...new Set([m.branchField, m.freqField, m.contractorField].filter(Boolean))]
    .filter(fk => (newRec[fk]||"").trim());
  if(!keyFields.length) return null;
  const match = loadData(m.key).find(r=>{
    if(r.id === newRec.id) return false;
    return keyFields.every(fk => (r[fk]||"").trim() === (newRec[fk]||"").trim());
  });
  if(match) return t('dupWarningMsg');
  return null;
}

/* stage suggestions follow the project typed in the invoice form: only that project's stages are offered */
function updateExpenseStepSuggestions(){
  const dl = document.getElementById("dl_expenseSteps"), pEl = document.querySelector('[data-field="project"]');
  if(!dl) return;
  const key = pEl ? projectKey(pEl.value) : "";
  const proj = key ? loadData("projects").find(p=> projectKey(p.projectName)===key) : null;
  const names = proj ? (proj.steps||[]).map(s=>s.name) : loadData("projects").flatMap(p=>(p.steps||[]).map(s=>s.name));
  dl.innerHTML = [...new Set(names.map(x=>(x||"").trim()).filter(Boolean))].map(v=>`<option value="${escapeAttr(v)}">`).join("");
}
function wireExpenseForm(isEdit){
  const q = k=> document.querySelector(`[data-field="${k}"]`);
  const projEl = q("project");
  if(projEl){ projEl.addEventListener("input", updateExpenseStepSuggestions); projEl.addEventListener("change", updateExpenseStepSuggestions); updateExpenseStepSuggestions(); }
  const amountEl = q("amount"), vatEl = q("vat"), totalEl = q("total"), modeEl = q("splitMode"), dateEl = q("date"), monthEl = q("accountingMonth");
  const recompute = ()=>{ if(totalEl && amountEl) totalEl.value = String(round2((Number(amountEl.value)||0) + (Number(vatEl&&vatEl.value)||0))); };
  [amountEl, vatEl].forEach(el=>{ if(el) el.addEventListener("input", ()=>{ recompute(); renderAllocWidget(); }); });
  if(modeEl) modeEl.addEventListener("change", renderAllocWidget);
  if(monthEl){
    monthEl.dataset.auto = isEdit ? "0" : "1";
    monthEl.addEventListener("input", ()=>{ monthEl.dataset.auto = "0"; });
    if(dateEl) dateEl.addEventListener("change", ()=>{ if(monthEl.dataset.auto==="1" && dateEl.value) monthEl.value = dateEl.value.slice(0,7); });
  }
  recompute();
  const aw = document.getElementById("allocWidget"), ah = q("allocations");
  if(aw && ah && isEdit && modeEl && modeEl.value===EXPENSE_SPLIT_CUSTOM && parseAllocations(ah.value).length) aw.dataset.userEdited = "1";
  renderAllocWidget();
}
function renderAllocWidget(){
  const w = document.getElementById("allocWidget");
  if(!w) return;
  const q = k=> document.querySelector(`[data-field="${k}"]`);
  const hidden = q("allocations"), branchEl = q("branch"), modeEl = q("splitMode");
  if(!hidden || !branchEl) return;
  const net = Number(q("amount") && q("amount").value) || 0, vat = Number(q("vat") && q("vat").value) || 0;
  const total = round2(net + vat);
  const fmt = n=> Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const box = (inner)=> `<div style="border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; background:#fafbfd;">${inner}</div>`;
  if(formViewOnly){
    const saved = parseAllocations(hidden.value);
    w.innerHTML = saved.length ? box(saved.map(a=>`<div style="display:flex; justify-content:space-between; padding:4px 0; font-size:13px;"><span>🏢 ${escapeHtml(a.branch)}</span><b>${fmt(a.total)}</b></div>`).join("")) : "—";
    return;
  }
  const branches = splitBranchNames(branchEl.value);
  if(!branches.length){ w.innerHTML = `<div style="font-size:12.5px; color:var(--muted);">${t('expAllocPickBranch')}</div>`; hidden.value = "[]"; return; }
  const custom = modeEl && modeEl.value === EXPENSE_SPLIT_CUSTOM;
  if(!custom){
    const eq = computeExpenseAllocations({branch: branchEl.value, amount: net, vat, splitMode: EXPENSE_SPLIT_EQUAL});
    hidden.value = "[]";
    w.innerHTML = box(`<div style="font-size:12px; color:var(--muted); margin-bottom:6px;">${t('expAllocEqualTitle')}</div>` +
      eq.map(a=>`<div style="display:flex; justify-content:space-between; padding:4px 0; font-size:13px;"><span>🏢 ${escapeHtml(a.branch)}</span><b>${fmt(a.total)}</b></div>`).join(""));
    return;
  }
  // amounts typed by the user (or loaded from a saved invoice) are kept; otherwise they follow the equal split as branches change
  const saved = (w.dataset.userEdited === "1") ? parseAllocations(hidden.value) : [];
  const eqDefault = computeExpenseAllocations({branch: branchEl.value, amount: net, vat, splitMode: EXPENSE_SPLIT_EQUAL});
  const initial = branches.map(b=>{ const s = saved.find(x=>x.branch===b); return s ? (s.total!==undefined ? s.total : s.amount) : (eqDefault.find(x=>x.branch===b)||{}).total; });
  w.innerHTML = box(`<div style="font-size:12px; color:var(--muted); margin-bottom:8px;">${t('expAllocCustomHint')}</div>` +
    branches.map((b,i)=>`<div style="display:flex; align-items:center; gap:10px; padding:4px 0;">
        <span style="flex:1; font-size:13px;">🏢 ${escapeHtml(b)}</span>
        <input type="number" step="0.01" min="0" data-allocbranch="${escapeAttr(b)}" value="${initial[i]!==undefined?initial[i]:""}" style="width:130px; padding:7px; border:1.5px solid var(--line); border-radius:8px;">
      </div>`).join("") + `<div id="allocRemaining" style="margin-top:8px; font-size:12.5px; font-weight:800;"></div>`);
  const sync = ()=>{
    const list = [...w.querySelectorAll("[data-allocbranch]")].map(inp=> ({branch: inp.dataset.allocbranch, total: round2(inp.value)}));
    hidden.value = JSON.stringify(list);
    const rem = round2(total - list.reduce((s,x)=>s+x.total,0));
    const el = document.getElementById("allocRemaining");
    if(el){ el.textContent = t('expAllocRemaining', fmt(rem)); el.style.color = Math.abs(rem) < 0.01 ? "#1f8a4c" : "#c0392b"; }
  };
  w.querySelectorAll("[data-allocbranch]").forEach(inp=> inp.addEventListener("input", ()=>{ w.dataset.userEdited = "1"; sync(); }));
  sync();
}
function renderBranchMultiWidget(fieldKey, currentValue){
  const w = document.getElementById(`branchMultiWidget_${fieldKey}`);
  if(!w) return;
  const hiddenInput = document.querySelector(`input[type="hidden"][data-field="${fieldKey}"]`);
  const allBranches = loadMasters().branches || [];
  const selected = new Set(splitBranchNames(currentValue));
  const viewOnly = formViewOnly;

  w.innerHTML = `<div style="display:flex; flex-wrap:wrap; gap:6px;">
    ${allBranches.length ? allBranches.map(b=>`
      <button type="button" class="branch-pill ${selected.has(b)?'branch-pill-selected':''}" data-branchpill="${escapeAttr(b)}" ${viewOnly?'disabled':''}>${selected.has(b)?'✓ ':''}${escapeHtml(b)}</button>
    `).join("") : `<span style="font-size:12px; color:var(--muted);">${t('branchMultiNoBranches')}</span>`}
  </div>`;

  if(viewOnly) return;
  w.querySelectorAll("[data-branchpill]").forEach(btn=>{
    btn.onclick = ()=>{

const PROJECT_CONTRACT_STEP_NAMES = ["عقد مكافحة الحشرات","عقد الكاميرات (CCTV)"];
const PROJECT_NEW_STAGE_NAMES = ["عقد مكافحة الحشرات","عقد الكاميرات (CCTV)","حصر الأملاك (جرد الموقع والمعدات)","حصر الرخص والشهادات"];
function isContractStep(s){ return s.kind==="contract" || PROJECT_CONTRACT_STEP_NAMES.includes((s.name||"").trim()); }
/* adds the stages of the project type that the project does not have yet, each one right after the nearest earlier stage it does have
   (so a missing stage lands in its proper place, never at the end). onlyNames limits it to certain stages. */
function mergeTemplateSteps(current, type, onlyNames){
  const tpl = PROJECT_TEMPLATES[type] || [];
  const out = current.map(s=>({...s}));
  const have = new Set(out.map(s=> projectKey(s.name)));
  tpl.forEach((ts, ti)=>{
    if(have.has(projectKey(ts.name))) return;
    if(onlyNames && !onlyNames.includes(ts.name)) return;
    let pos = 0;
    for(let k=ti-1; k>=0; k--){
      const idx = out.findIndex(s=> projectKey(s.name)===projectKey(tpl[k].name));
      if(idx >= 0){ pos = idx + 1; break; }
    }
    out.splice(pos, 0, newProjectStep({ name:ts.name, authority:ts.authority||"", kind:ts.kind||"" }));
    have.add(projectKey(ts.name));
  });
  return out;
}

/* An invoice file attached to a stage (with its paid amount) becomes a real invoice for the accountant — on the project's branch,
   linked to the project and stage — so it is entered ONCE. Re-saving the project keeps it in step (amount, files) while it is still
   "جديدة"; once the accountant has started on it only new files are added; removing the file/amount withdraws it (recycle bin). */
function syncProjectStepInvoices(project){
  const m = expenseModule();
  const arr = loadDataRaw("expenses");
  const now = Date.now(); const touched = [];
  const brRaw = String(project.branch||"").trim();
  const br = splitBranchNames(brRaw)[0] || brRaw;
  (project.steps||[]).forEach(s=>{
    const id = "pinv-" + s.id;
    const files = (Array.isArray(s.invoiceFiles) ? s.invoiceFiles : []).filter(Boolean).map(cleanAttachment);
    const docs = (Array.isArray(s.docFiles) ? s.docFiles : []).filter(Boolean).map(cleanAttachment);
    const paid = round2(stepAmount(s));
    const idx = arr.findIndex(e=> e.id===id);
    const pristine = idx>=0 && (arr[idx].reviewStatus||"جديدة")==="جديدة";
    if(files.length && paid>0){
      const date = s.doneDate || (idx>=0 && arr[idx].date) || todayStr();
      if(idx < 0){
        const rec = { id, date, invoiceNo:"", vendor: (s.authority||"").trim() || project.projectName, department:"الإدارة", category:"رسوم حكومية", employee:"", branch: br,
          project: project.projectName, projectStep: s.name, accountingMonth: date.slice(0,7), amount:String(paid), vat:"0", total:String(paid), splitMode: EXPENSE_SPLIT_EQUAL,
          paymentStatus:"مدفوعة", paymentMethod:"", reviewStatus:"جديدة", notes: s.name + (s.refNo ? " — " + s.refNo : ""),
          submittedBy: "مشروع: " + project.projectName, photos: files, docFiles: docs, autoFromProject:true, _updatedAt: now };
        rec.allocations = computeExpenseAllocations(rec); rec.allocationText = expenseAllocationText(rec.allocations);
        rec.expNo = getNextRecordNumber(m);
        arr.push(rec); saveData("expenses", arr); touched.push(rec);
      } else if(pristine || arr[idx]._deleted){
        const e = arr[idx];
        delete e._deleted; delete e._deletedAt;
        Object.assign(e, { project: project.projectName, projectStep: s.name, amount:String(paid), vat:"0", total:String(paid), photos: files, docFiles: docs, date, accountingMonth: date.slice(0,7), _updatedAt: now });
        e.allocations = computeExpenseAllocations(e); e.allocationText = expenseAllocationText(e.allocations);
        touched.push(e);
      } else {
        const e = arr[idx];
        const have = new Set((e.photos||[]).map(p=> p.storageUrl || p.name));
        const extra = files.filter(p=> !have.has(p.storageUrl || p.name));
        const haveDocs = new Set((e.docFiles||[]).map(p=> p.storageUrl || p.name));
        const extraDocs = docs.filter(p=> !haveDocs.has(p.storageUrl || p.name));
        if(extra.length || extraDocs.length){ e.photos = [...(e.photos||[]), ...extra]; e.docFiles = [...(e.docFiles||[]), ...extraDocs]; e._updatedAt = now; touched.push(e); }
      }
    } else if(idx>=0 && !arr[idx]._deleted && pristine){
      arr[idx]._deleted = true; arr[idx]._deletedAt = now; arr[idx]._updatedAt = now; touched.push(arr[idx]);
    }
  });
  if(touched.length){ saveData("expenses", arr); touched.forEach(e=> cloudPushRecord("expenses", e)); }
  return touched.length;
}
function finalizeProjectAfterSave(rec){
  const n = syncProjectStepInvoices(rec);
  const cp = projectComputed(rec);
  if(["progress","currentStep","actualCost"].some(k=> String(rec[k]===undefined?"":rec[k]) !== String(cp[k]))){
    Object.assign(rec, cp);
    saveData("projects", loadDataRaw("projects").map(x=> x.id===rec.id ? rec : x));
    cloudPushRecord("projects", rec);
  }
  return n;
}

function openLightbox(photos, startIndex){

  const imagesOnly = photos.filter(p=>!isPdfAttachment(p) && !isVideoAttachment(p));

    const p = photos[idx];

    const mediaSrc = p.dataUrl || p.storageUrl || "";
    const mediaHtml = isPdf
      ? `<iframe class="lightbox-pdf" src="${mediaSrc}" title="${p.name||'PDF'}"></iframe>`
      : isVideo
      ? `<video class="lightbox-img" src="${mediaSrc}" controls autoplay style="background:#000;"></video>`
      : `<img class="lightbox-img" src="${mediaSrc}" alt="${p.name||''}">`;
    root.innerHTML = `

        <button class="lightbox-close" id="lightboxClose">✕</button>

        ${mediaHtml}
        ${photos.length>1 ? `<button class="lightbox-nav lightbox-next" id="lightboxNext">${LANG==='ar'?'‹':'›'}</button>` : ""}
        <div class="lightbox-name">${p.name||""}</div>
        ${photos.length>1 ? `<div class="lightbox-counter">${idx+1} / ${photos.length}</div>` : ""}
        ${imagesOnly.length>=2 ? `<button class="btn btn-gold btn-sm" id="btnCompareBA" style="position:absolute; bottom:16px;">${t('beforeAfterCompareBtn')}</button>` : ""}
      </div>`;
    document.getElementById("lightboxClose").onclick = closeLightbox;
    document.getElementById("lightboxOverlay").onclick = (e)=>{ if(e.target.id==="lightboxOverlay") closeLightbox(); };
    const prevBtn = document.getElementById("lightboxPrev");
    const nextBtn = document.getElementById("lightboxNext");
    if(prevBtn) prevBtn.onclick = ()=>{ idx = (idx-1+photos.length)%photos.length; render(); };
    if(nextBtn) nextBtn.onclick = ()=>{ idx = (idx+1)%photos.length; render(); };

  document.getElementById("qrOverlay").onclick = (e)=>{ if(e.target.id==="qrOverlay") closeQrScan(); };

  navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(stream=>{
    qrScanStream = stream;
    const video = document.getElementById("qrVideo");
    if(!video) { stream.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject = stream;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    function tick(){
      if(!document.getElementById("qrVideo")) return; // modal closed
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if(code && code.data){ handleQrScanResult(code.data); return; }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }).catch(()=>{ alert(t('qrCameraError')); closeQrScan(); });

function handleQrScanResult(data){
  closeQrScan();
  const parsed = parseQrScanData(data);
  if(parsed){
    const mod = MODULES.find(x=>x.key===parsed.moduleKey);
    const rec = mod ? loadData(parsed.moduleKey).find(r=>r.id===parsed.recId) : null;
    if(mod && rec){
      state.view = parsed.moduleKey;
      render();
      setTimeout(()=> openForm(mod, rec, true), 50);
      return;
    }
  }
  alert(t('qrNotFound'));
}
function parseQrScanData(data){
  data = (data||"").trim();
  // New format: a full URL ending in #asset-<moduleKey>-<recId> (used by printed labels)
  let hashIdx = data.indexOf("#asset-");
  if(hashIdx >= 0){
    const rest = data.slice(hashIdx + 7); // after "#asset-"
    const firstDash = rest.indexOf("-");
    if(firstDash > 0){
      return { moduleKey: rest.slice(0, firstDash), recId: rest.slice(firstDash+1) };
    }
  }
  // Previous format (backward compatibility): #qr-<moduleKey>-<recId>
  hashIdx = data.indexOf("#qr-");
  if(hashIdx >= 0){
    const rest = data.slice(hashIdx + 4);
    const firstDash = rest.indexOf("-");
    if(firstDash > 0){
      return { moduleKey: rest.slice(0, firstDash), recId: rest.slice(firstDash+1) };
    }
  }
  // Oldest format (backward compatibility): FORKA::module::id
  const parts = data.split("::");
  if(parts.length===3 && parts[0]==="FORKA"){
    return { moduleKey: parts[1], recId: parts[2] };
  }
  return null;
}

function isPdfAttachment(p){ return p && ((p.dataUrl||"").startsWith("data:application/pdf") || /\.pdf$/i.test(p.name||"")); }
function isVideoAttachment(p){ return p && ((p.dataUrl||"").startsWith("data:video/") || /\.(mp4|mov|webm|avi|mkv|m4v)$/i.test(p.name||"")); }
function resizeImageDataUrl(dataUrl, maxDim){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h = Math.max(1, Math.round(h*maxDim/w)); w = maxDim; }
          else { w = Math.max(1, Math.round(w*maxDim/h)); h = maxDim; }
        }
        try{
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = ()=> resolve(dataUrl);
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
function anyPhotosUploading(){ return formPhotos.some(p=>p.uploading) || formPhotos2.some(p=>p.uploading); }
function startAttachmentUpload(entry, file, targetArr, renderFn){
  targetArr = targetArr || formPhotos;
  renderFn = renderFn || renderPhotoWidget;
  entry.uploading = true;
  entry.uploadFailed = false;
  entry.progress = 0;
  renderFn();
  uploadAttachmentFile(file, (pct)=>{
    const found = targetArr.find(p=>p._tempId===entry._tempId);
    if(found){ found.progress = pct; renderFn(); }
  }).then(url=>{
    const found = targetArr.find(p=>p._tempId===entry._tempId);
    if(found){
      found.uploading = false;
      if(url){ found.storageUrl = url; found.uploadFailed = false; }
      else { found.uploadFailed = true; found._retryFile = file; }
      renderFn();
    }
  });
}

      : (p.storageUrl ? `<span class="attach-status linked" title="${t('attachLinked')}">☁️</span>` : "");
    return `<div class="photo-thumb">${thumbInner}${statusBadge}${formViewOnly?'':`<button class="rm" data-rmphoto="${i}">✕</button>`}</div>`;
  }).join("") + (formViewOnly ? (formPhotos.length? "" : `<div style="font-size:12.5px; color:var(--muted);">${t('photosNone')}</div>`) : `<div class="photo-add-btn" id="photoAddBtn">+</div>`);
  document.querySelectorAll("[data-viewphoto]").forEach(img=>{
    img.onclick = ()=> openLightbox(formPhotos, Number(img.dataset.viewphoto));
  });
  document.querySelectorAll("[data-retryupload]").forEach(b=>{
    b.onclick = ()=>{
      const idx = Number(b.dataset.retryupload);
      const entry = formPhotos[idx];
      if(entry && entry._retryFile){ startAttachmentUpload(entry, entry._retryFile); }
    };
  });
  updateSaveButtonAvailability();
  if(formViewOnly) return;
  document.getElementById("photoAddBtn").onclick = ()=> document.getElementById("photoFileInput").click();
  document.querySelectorAll("[data-rmphoto]").forEach(b=>{
    b.onclick = ()=>{ formPhotos.splice(Number(b.dataset.rmphoto),1); renderPhotoWidget(); };
  });
  const fi = document.getElementById("photoFileInput");
  if(fi) fi.onchange = (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const willUploadAll = hasAnyUploadServiceConfigured();
    const LOCAL_ONLY_MAX_BYTES = 3 * 1024 * 1024; // 3MB — safe ceiling when there's no cloud service to offload to
    // Only PDFs (non-images) truly need this local-size guard now, since images always get compressed to a small thumbnail.
    const tooLarge = !willUploadAll ? files.filter(f=> !f.type.startsWith("image/") && f.size > LOCAL_ONLY_MAX_BYTES) : [];
    if(tooLarge.length){
      alert(t('attachFileTooLargeNoCloud', tooLarge.map(f=>f.name).join(", ")));
      const okFiles = files.filter(f=> f.type.startsWith("image/") || f.size <= LOCAL_ONLY_MAX_BYTES);
      if(!okFiles.length){ fi.value = ""; return; }
      files.length = 0; files.push(...okFiles);
    }
    let remaining = files.length;
    files.forEach(file=>{
      const reader = new FileReader();
      const isImage = file.type.startsWith("image/");
      reader.onload = ()=>{
        const originalDataUrl = reader.result;
        const willUpload = hasAnyUploadServiceConfigured();
        // Keep the local copy in memory for the whole editing session (so a failed upload never loses the file) —
        // heavy non-image copies only get stripped at save-time, and only once the cloud upload has actually succeeded.
        const entry = {name:file.name, dataUrl:originalDataUrl, uploading: willUpload, _tempId: uid()};
        formPhotos.push(entry);
        remaining--;
        if(remaining===0){ renderPhotoWidget(); }

        // Images are always compressed down to a small thumbnail for local storage — keeps things light
        // regardless of cloud status, while still giving Excel something to embed (with the hyperlink attached).
        if(isImage){
          resizeImageDataUrl(originalDataUrl, 220).then(smallUrl=>{
            const found = formPhotos.find(p=>p._tempId===entry._tempId);
            if(found){ found.dataUrl = smallUrl; renderPhotoWidget(); }
          });
        }

        if(willUpload){
          startAttachmentUpload(entry, file);
        }
      };
      reader.readAsDataURL(file);
    });
    fi.value = "";
  };
}
function renderPhotoWidget2(){
  const w = document.getElementById("photoWidget2");
  if(!w) return;
  w.innerHTML = formPhotos2.map((p,i)=>{
    const isPdf = isPdfAttachment(p);
    const thumbInner = isPdf
      ? `<div class="pdf-thumb-icon" data-viewphoto2="${i}" style="cursor:zoom-in;">📄<span>PDF</span></div>`
      : `<img src="${p.dataUrl || p.storageUrl || ''}" alt="${p.name||''}" data-viewphoto2="${i}" style="cursor:zoom-in;">`;
    const statusBadge = p.uploading
      ? `<span class="attach-status uploading" title="${t('attachUploading')}" style="width:auto; padding:0 3px; font-size:9px; font-weight:800;">${(p.progress||0)}%</span>`
      : p.uploadFailed
      ? `<span class="attach-status failed" data-retryupload2="${i}" title="${t('attachUploadFailed')}" style="cursor:pointer;">⚠️</span>`
      : (p.storageUrl ? `<span class="attach-status linked" title="${t('attachLinked')}">☁️</span>` : "");
    return `<div class="photo-thumb">${thumbInner}${statusBadge}${formViewOnly?'':`<button class="rm" data-rmphoto2="${i}">✕</button>`}</div>`;
  }).join("") + (formViewOnly ? (formPhotos2.length? "" : `<div style="font-size:12.5px; color:var(--muted);">${t('photosNone')}</div>`) : `<div class="photo-add-btn" id="photoAddBtn2">+</div>`);
  document.querySelectorAll("[data-viewphoto2]").forEach(img=>{
    img.onclick = ()=> openLightbox(formPhotos2, Number(img.dataset.viewphoto2));
  });
  document.querySelectorAll("[data-retryupload2]").forEach(b=>{
    b.onclick = ()=>{
      const idx = Number(b.dataset.retryupload2);
      const entry = formPhotos2[idx];
      if(entry && entry._retryFile){ startAttachmentUpload(entry, entry._retryFile, formPhotos2, renderPhotoWidget2); }
    };
  });
  updateSaveButtonAvailability();
  if(formViewOnly) return;
  const addBtn2 = document.getElementById("photoAddBtn2");
  if(addBtn2) addBtn2.onclick = ()=> document.getElementById("photoFileInput2").click();
  document.querySelectorAll("[data-rmphoto2]").forEach(b=>{
    b.onclick = ()=>{ formPhotos2.splice(Number(b.dataset.rmphoto2),1); renderPhotoWidget2(); };
  });
  const fi2 = document.getElementById("photoFileInput2");
  if(fi2) fi2.onchange = (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const willUploadAll = hasAnyUploadServiceConfigured();
    const LOCAL_ONLY_MAX_BYTES = 3 * 1024 * 1024;
    const tooLarge = !willUploadAll ? files.filter(f=> !f.type.startsWith("image/") && f.size > LOCAL_ONLY_MAX_BYTES) : [];
    if(tooLarge.length){
      alert(t('attachFileTooLargeNoCloud', tooLarge.map(f=>f.name).join(", ")));
      const okFiles = files.filter(f=> f.type.startsWith("image/") || f.size <= LOCAL_ONLY_MAX_BYTES);
      if(!okFiles.length){ fi2.value = ""; return; }
      files.length = 0; files.push(...okFiles);
    }
    let remaining = files.length;
    files.forEach(file=>{
      const reader = new FileReader();
      const isImage = file.type.startsWith("image/");
      reader.onload = ()=>{
        const originalDataUrl = reader.result;
        const willUpload = hasAnyUploadServiceConfigured();
        const entry = {name:file.name, dataUrl:originalDataUrl, uploading: willUpload, _tempId: uid()};
        formPhotos2.push(entry);
        remaining--;
        if(remaining===0){ renderPhotoWidget2(); }
        if(isImage){
          resizeImageDataUrl(originalDataUrl, 220).then(smallUrl=>{
            const found = formPhotos2.find(p=>p._tempId===entry._tempId);
            if(found){ found.dataUrl = smallUrl; renderPhotoWidget2(); }
          });
        }
        if(willUpload){
          startAttachmentUpload(entry, file, formPhotos2, renderPhotoWidget2);
        }
      };
      reader.readAsDataURL(file);
    });
    fi2.value = "";
  };
}

async function translateValueForExport(f, val){
  if(!val) return val;
  if(f.type === "select") return optLabel(val);
  if(isTranslatableField(f)){
    const exact = glossaryLookup(val, LANG);
    if(exact && detectTextLang(val) !== LANG) return exact;
    if(getAutoTranslateEnabled()) return await translateText(val, LANG);
  }
  return val;
}
async function rowsToTranslatedSheetData(m, records, statusFilterValue, forceAll){
  const rows = [];
  const exportFields = getListRelevantFields(m, statusFilterValue, forceAll);
  for(const r of records){
    const row = {};
    for(const f of exportFields){
      const raw = r[f.key]||"";
      let display = await translateValueForExport(f, raw);
      if(f.key===m.statusField && isOverdue(m,r) && display){
        display = display + (LANG==='ar' ? " (متأخر ⏰)" : " (Overdue ⏰)");
      }
      row[FL(f)] = display;
    }
    rows.push(row);
  }
  return rows;
}
async function moduleToSheetData(m, recordsOverride, statusFilterValue, forceAll){
  const raw = recordsOverride || loadData(m.key);
  const rows = await rowsToTranslatedSheetData(m, raw, statusFilterValue, forceAll);
  return { rows, raw };
}

/* ---- Branded, professional Excel styling (ExcelJS) ---- */
const XL_NAVY = "FF1F3864", XL_GOLD = "FFC9A24B", XL_LIGHT = "FFF2F2F2", XL_WHITE = "FFFFFFFF",
      XL_MUTED = "FF7F7F7F", XL_BORDER = "FFBFBFBF", XL_BORDER_LIGHT = "FFE2E6EE", XL_TEXT = "FF1C2433";
const EXCEL_BADGE_COLORS = {
  "badge-danger":  { fill:"FFFDECEA", font:"FFC0392B" },
  "badge-warning": { fill:"FFFFF6E0", font:"FFB8860B" },
  "badge-success": { fill:"FFE8F8EE", font:"FF1F8A4C" },
  "badge-info":    { fill:"FFEAF1FF", font:"FF2563EB" },
  "badge-muted":   { fill:"FFEEF0F4", font:"FF6B7686" },
};
function excelColorForValue(rawVal){
  if(!rawVal) return null;
  const cls = STATUS_COLORS[rawVal.toString().trim()];
  if(!cls) return null;
  return EXCEL_BADGE_COLORS[cls] || null;
}
function safeSheetName(name){ return (name||"Sheet").replace(/[\[\]:*?/\\]/g, " ").slice(0,31) || "Sheet"; }
function excelDateValue(raw, type){
  if(!raw) return null;
  const d = new Date(raw);
  if(isNaN(d.getTime())) return null;
  const y = d.getFullYear();
  if(y < 1900 || y > 9999) return null;   // Excel cannot store such a date: a mistyped year (e.g. 0202) turned into a negative number and made the WHOLE file unreadable
  return d;
}
/* Excel rejects control characters and cells longer than 32,767 characters */
function xlSafe(v){
  if(typeof v === "string"){
    v = v.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "");
    if(v.length > 32000) v = v.slice(0, 32000) + "…";
  }
  return v;
}
function dataUrlToBase64(dataUrl){ const i = dataUrl.indexOf(","); return i>=0 ? dataUrl.slice(i+1) : dataUrl; }
function excelImageExtension(dataUrl){
  if(dataUrl.startsWith("data:image/png")) return "png";
  if(dataUrl.startsWith("data:image/gif")) return "gif";
  return "jpeg";
}
const EXCEL_MAX_ATTACHMENT_COLUMNS = 8;
/* Picture thumbnails inside the cells: the invoice / document photo is SEEN in Excel and a click on it opens the full file.
   Fetched once before the workbook is built (small versions only); anything that cannot be fetched keeps the text link. */
const xlThumbCache = new Map();
function xlThumbKey(att){ return att.storageUrl || (att.dataUrl ? ("d" + att.dataUrl.length + ":" + att.dataUrl.slice(-48)) : ""); }
function sniffImageExt(bytes){
  if(bytes.length > 4 && bytes[0]===0x89 && bytes[1]===0x50 && bytes[2]===0x4E && bytes[3]===0x47) return "png";
  if(bytes.length > 3 && bytes[0]===0xFF && bytes[1]===0xD8) return "jpeg";
  if(bytes.length > 4 && bytes[0]===0x47 && bytes[1]===0x49 && bytes[2]===0x46) return "gif";
  return null;
}
function smallImageUrl(url){
  return /\/image\/upload\//.test(url) && !/\/upload\/[a-z]_/.test(url) ? url.replace("/image/upload/", "/image/upload/w_260,h_260,c_limit,q_auto,f_jpg/") : url;
}
async function fetchThumb(att){
  try{
    let bytes;
    if(att.storageUrl){
      const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const timer = setTimeout(()=>{ if(ctl) ctl.abort(); }, 9000);
      const res = await fetch(smallImageUrl(att.storageUrl), ctl ? { signal: ctl.signal } : undefined);
      clearTimeout(timer);
      if(!res || !res.ok) return null;
      bytes = new Uint8Array(await res.arrayBuffer());
    } else if(att.dataUrl && att.dataUrl.startsWith("data:image/")){
      const b64 = att.dataUrl.slice(att.dataUrl.indexOf(",") + 1); const bin = atob(b64);
      bytes = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    } else return null;
    const ext = sniffImageExt(bytes);
    return ext ? { buffer: bytes, ext } : null;
  }catch(e){ return null; }
}
async function prefetchExcelThumbs(atts){
  const todo = []; const seen = new Set();
  (atts || []).forEach(a=>{
    if(!a || isPdfAttachment(a) || isVideoAttachment(a)) return;
    const k = xlThumbKey(a); if(!k || seen.has(k) || xlThumbCache.has(k)) return;
    seen.add(k); todo.push({ k, a });
  });
  const batch = todo.slice(0, 120);                                 // one export never waits for hundreds of pictures
  for(let i = 0; i < batch.length; i += 6){
    const part = batch.slice(i, i + 6);
    const res = await Promise.all(part.map(p=> fetchThumb(p.a)));
    part.forEach((p,j)=> xlThumbCache.set(p.k, res[j]));
  }
}
function collectAttachments(records, keys){
  const out = [];
  (records || []).forEach(r=> (keys || []).forEach(k=> (Array.isArray(r[k]) ? r[k] : []).forEach(a=> out.push(a))));
  return out;
}
function attachmentCellStyle(cell, zebraFill, isLastRow){
  cell.border = {
    top:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
    bottom:{style: isLastRow ? "medium" : "thin", color:{argb: isLastRow ? XL_NAVY : XL_BORDER_LIGHT}},
    left:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
    right:{style:"thin",color:{argb:XL_BORDER_LIGHT}}
  };
  cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb: zebraFill || "FFFFFFFF"} };
  cell.alignment = { horizontal:"center", vertical:"middle", wrapText:true };
}
function attachmentLabel(att, i){
  const icon = isPdfAttachment(att) ? "📄" : (isVideoAttachment(att) ? "🎬" : "🖼️");
  const fallback = isPdfAttachment(att) ? "PDF" : (isVideoAttachment(att) ? (LANG==='ar'?'فيديو':'Video') : (LANG==='ar'?'صورة':'Image'));
  const name = (att.name || "").trim();
  return `${icon} ${name && name.length<=28 ? name : fallback + (i!==undefined ? " " + (i+1) : "")}`.trim();
}
/* ONE attachment = ONE cell with a direct link: a single click on the invoice / document opens the file itself */
function writeOneAttachmentCell(cell, att, index, zebraFill, isLastRow, ctx){
  attachmentCellStyle(cell, zebraFill, isLastRow);
  if(!att) return;
  if(att.storageUrl){
    cell.value = { text: attachmentLabel(att, index), hyperlink: att.storageUrl };
    cell.font = { name:"Arial", size:9.5, color:{argb:"FF2563EB"}, underline:true };
    const thumb = ctx ? xlThumbCache.get(xlThumbKey(att)) : null;
    if(thumb){
      // the picture sits in the cell (name stays underneath); clicking the picture opens the file
      const imgId = ctx.workbook.addImage({ buffer: thumb.buffer, extension: thumb.ext });
      ctx.sheet.addImage(imgId, { tl:{ col: ctx.col - 1 + 0.07, row: ctx.row - 1 + 0.05 }, ext:{ width: 96, height: 66 }, hyperlinks:{ hyperlink: att.storageUrl, tooltip: att.name || "" } });
      const rowObj = ctx.sheet.getRow(ctx.row); rowObj.height = Math.max(rowObj.height || 0, 92);
      cell.alignment = { horizontal:"center", vertical:"bottom", wrapText:true };
    }
  } else {
    cell.value = LANG==='ar' ? "📎 محفوظ على الجهاز فقط (بدون رابط)" : "📎 Stored on the device only (no link)";
    cell.font = { name:"Arial", size:9, color:{argb:XL_MUTED} };
  }
}
/* more than EXCEL_MAX_ATTACHMENT_COLUMNS files: the rest go into one gallery link (kept under Excel's hyperlink length limit) */
function writeMoreAttachmentsCell(cell, files, zebraFill, isLastRow){
  attachmentCellStyle(cell, zebraFill, isLastRow);
  const linked = files.filter(p=>p && p.storageUrl);
  if(!linked.length) return;
  let used = 0, len = (GALLERY_BASE_URL + "?urls=").length;
  for(const p of linked){ const add = encodeURIComponent(p.storageUrl).length + 1; if(len + add > 1900 && used) break; used++; len += add; }
  const galleryUrl = GALLERY_BASE_URL + "?urls=" + linked.slice(0, used).map(p=>encodeURIComponent(p.storageUrl)).join(",");
  const rest = linked.slice(used).map(p=>p.storageUrl);
  cell.value = { text: (LANG==='ar' ? `🖼️ باقي المرفقات (${linked.length})` : `🖼️ More attachments (${linked.length})`) + (rest.length ? "\n" + rest.join("\n") : ""), hyperlink: galleryUrl };
  cell.font = { name:"Arial", size:9.5, color:{argb:"FF2563EB"}, underline:true };
}
function addStyledSheet(workbook, sheetTitle, headers, rows, opts){
  opts = opts || {};
  const fields = opts.fields || null;
  const rawRecords = opts.rawRecords || null;
  const photoField = opts.photoField || null;
  const photoField2 = opts.photoField2 || null;
  const isRtl = LANG === "ar";
  // attachment columns: one column PER FILE (as many as the record with the most files needs, up to a limit), each a direct link
  const attSources = opts.attachmentCols || [photoField, photoField2].filter(Boolean).map(f=>({ label: FL(f), files: (rec)=> (rec && Array.isArray(rec[f.key])) ? rec[f.key] : [] }));
  const attSpecs = [];
  attSources.forEach(src=>{
    const maxN = Math.max(1, ...(rawRecords || []).map(r=> (src.files(r) || []).length));
    const direct = Math.min(maxN, EXCEL_MAX_ATTACHMENT_COLUMNS);
    for(let i = 0; i < direct; i++) attSpecs.push({ src, i, header: direct > 1 ? `${src.label} ${i+1}` : src.label });
    if(maxN > EXCEL_MAX_ATTACHMENT_COLUMNS) attSpecs.push({ src, more:true, header: `${src.label} (+)` });
  });
  const allHeaders = [...headers, ...attSpecs.map(s=>s.header)];
  const ncols = Math.max(allHeaders.length, 1);
  const sheet = workbook.addWorksheet(safeSheetName(sheetTitle), { views: [{ rightToLeft: isRtl }] });

  sheet.properties.tabColor = { argb: XL_NAVY };
  sheet.pageSetup = { orientation:"landscape", fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2} };
  sheet.pageSetup.printTitlesRow = "3:3";

  sheet.mergeCells(1,1,1,ncols);
  const titleCell = sheet.getCell(1,1);
  titleCell.value = `GROUP FORKA  —  ${sheetTitle}`;
  titleCell.font = { bold:true, size:16, color:{argb:XL_NAVY}, name:"Arial" };
  titleCell.alignment = { horizontal:"center", vertical:"middle" };
  sheet.getRow(1).height = 28;

  sheet.mergeCells(2,1,2,ncols);
  const subCell = sheet.getCell(2,1);
  subCell.value = (isRtl ? "تاريخ التصدير: " : "Export date: ") + new Date().toLocaleString(isRtl?"ar-EG":"en-GB")
    + (isRtl ? "   |   عدد السجلات: " : "   |   Records: ") + rows.length
    + (attSpecs.length ? (isRtl ? "   |   اضغط على الصورة أو اسم الملف الأزرق لفتحه (لو ما فتحش: اضغط Enable Editing فوق)" : "   |   Click the picture or the blue file name to open it (if nothing opens: click Enable Editing at the top)") : "");
  subCell.font = { italic:true, size:10, color:{argb:XL_MUTED}, name:"Arial" };
  subCell.alignment = { horizontal:"center" };
  sheet.getRow(2).height = 18;

  const headerRowIdx = 3;
  const headerRow = sheet.getRow(headerRowIdx);
  allHeaders.forEach((h,i)=>{
    const cell = headerRow.getCell(i+1);
    cell.value = h;
    cell.font = { bold:true, color:{argb:XL_WHITE}, size:11, name:"Arial" };
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:XL_NAVY} };
    cell.alignment = { horizontal:"center", vertical:"middle", wrapText:true };
    cell.border = { top:{style:"thin",color:{argb:XL_BORDER}}, bottom:{style:"medium",color:{argb:XL_GOLD}}, left:{style:"thin",color:{argb:XL_BORDER}}, right:{style:"thin",color:{argb:XL_BORDER}} };
  });
  headerRow.height = 26;

  rows.forEach((rowObj, rIdx)=>{
    const excelRow = sheet.getRow(headerRowIdx+1+rIdx);
    const rawRec = rawRecords ? rawRecords[rIdx] : null;
    const isLastRow = rIdx === rows.length-1;
    const zebraFill = rIdx % 2 === 1 ? XL_LIGHT : null;
    headers.forEach((h,cIdx)=>{
      const cell = excelRow.getCell(cIdx+1);
      const f = fields ? fields[cIdx] : null;
      let statusColor = null;

      if(f && rawRec && (f.type==="date" || f.type==="datetime-local")){
        const dv = excelDateValue(rawRec[f.key], f.type);
        if(dv){ cell.value = dv; cell.numFmt = f.type==="datetime-local" ? "yyyy-mm-dd hh:mm" : "yyyy-mm-dd"; }
        else cell.value = rawRec[f.key] ? String(rawRec[f.key]) : "";      // not a date Excel can hold -> keep the text as typed
      } else if(f && f.type==="number"){
        const n = rawRec ? Number(rawRec[f.key]) : NaN;
        if(!isNaN(n) && rawRec && rawRec[f.key]!==undefined && rawRec[f.key]!==""){ cell.value = n; cell.numFmt = "#,##0.##"; }
        else cell.value = "";
      } else {
        cell.value = rowObj[h]!==undefined && rowObj[h]!==null ? xlSafe(rowObj[h]) : "";
      }

      if(f && f.type==="select" && rawRec){
        statusColor = excelColorForValue(rawRec[f.key]);
      }

      cell.font = { name:"Arial", size:10.5, color:{argb: statusColor ? statusColor.font : XL_TEXT}, bold: !!statusColor };
      cell.alignment = { horizontal:"center", vertical:"middle", wrapText:true };
      cell.border = {
        top:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
        bottom:{style: isLastRow ? "medium" : "thin", color:{argb: isLastRow ? XL_NAVY : XL_BORDER_LIGHT}},
        left:{style:"thin",color:{argb:XL_BORDER_LIGHT}},
        right:{style:"thin",color:{argb:XL_BORDER_LIGHT}}
      };
      cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb: statusColor ? statusColor.fill : (zebraFill || "FFFFFFFF")} };
    });

    attSpecs.forEach((spec, k)=>{
      const cell = excelRow.getCell(headers.length + 1 + k);
      const files = rawRec ? (spec.src.files(rawRec) || []) : [];
      if(spec.more) writeMoreAttachmentsCell(cell, files.slice(EXCEL_MAX_ATTACHMENT_COLUMNS), zebraFill, isLastRow);
      else writeOneAttachmentCell(cell, files[spec.i], spec.i, zebraFill, isLastRow, { workbook, sheet, row: headerRowIdx + 1 + rIdx, col: headers.length + 1 + k });
    });
  });

  allHeaders.forEach((h,i)=>{
    let maxLen = (h||"").toString().length;
    rows.forEach(r=>{
      const v = r[h];
      if(v!==undefined && v!==null){ const len = v.toString().length; if(len>maxLen) maxLen = len; }
    });
    const isExtraCol = i >= headers.length;
    const correspondingField = (!isExtraCol && fields) ? fields[i] : null;
    const isLongText = correspondingField && (correspondingField.type==="textarea" || correspondingField.full);
    const capWidth = isLongText ? 70 : 42;
    const colWidth = isExtraCol ? 22 : Math.min(Math.max(maxLen+4, 12), capWidth);
    sheet.getColumn(i+1).width = colWidth;
  });

  if(allHeaders.length){
    sheet.autoFilter = { from:{row:headerRowIdx, column:1}, to:{row:headerRowIdx, column:ncols} };
  }
  sheet.views = [{ state:"frozen", ySplit: headerRowIdx, rightToLeft: isRtl }];
  return sheet;
}

  sheet.getColumn(1).width = 36; sheet.getColumn(2).width = 16; sheet.getColumn(3).width = 20;
  sheet.pageSetup = { orientation:"portrait", fitToPage:true, fitToWidth:1, fitToHeight:0 };
  return sheet;
}

async function exportElementToPDF(targetEl, filename){
  if(!window.html2canvas || !window.jspdf){
    alert(t('pdfLibMissing'));
    return;
  }
  document.body.classList.add("generating-pdf");
  await new Promise(r=>setTimeout(r, 60)); // let layout settle
  let canvas;
  try{
    canvas = await html2canvas(targetEl, { scale:2, backgroundColor:"#ffffff", useCORS:true });
  } finally {
    document.body.classList.remove("generating-pdf");
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:"landscape", unit:"pt", format:"a4" });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = canvas.height * imgWidth / canvas.width;
  const imgData = canvas.toDataURL("image/jpeg", 0.92);

  let heightLeft = imgHeight;
  let position = 0;
  pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }
  pdf.save(filename);
}

/* ---------------- Make sure every attachment that goes into an Excel file has a real link ----------------
   Files saved only on this device (no cloud link) cannot be opened from Excel. Before exporting we upload them and keep the link on
   the record. Returns how many files are STILL without a link (offline / upload service off / failed). */
function dataUrlToFile(dataUrl, name){
  const i = dataUrl.indexOf(",");
  const head = dataUrl.slice(0, i), b64 = dataUrl.slice(i + 1);
  const mime = (head.match(/^data:([^;,]+)/) || [])[1] || "application/octet-stream";
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new File([arr], name || "file", { type: mime });
}
async function uploadPendingAttachments(moduleKeys){
  let stillLocal = 0;
  const uploadOn = hasAnyUploadServiceConfigured();
  for(const key of moduleKeys){
    const m = MODULES.find(x=>x.key===key);
    if(!m) continue;
    const photoKeys = m.fields.filter(f=> f.type==="photo" || f.type==="photo2").map(f=>f.key);
    const arr = loadDataRaw(key);
    const pending = [];
    arr.forEach(r=>{
      if(r._deleted) return;
      photoKeys.forEach(k=> (Array.isArray(r[k]) ? r[k] : []).forEach(a=>{ if(a && !a.storageUrl && a.dataUrl) pending.push({r, a}); }));
      if(key==="projects") (Array.isArray(r.steps) ? r.steps : []).forEach(s=> ["invoiceFiles","docFiles"].forEach(k=> (Array.isArray(s[k]) ? s[k] : []).forEach(a=>{ if(a && !a.storageUrl && a.dataUrl) pending.push({r, a}); })));
    });
    if(!pending.length) continue;
    if(!uploadOn){ stillLocal += pending.length; continue; }
    const batch = pending.slice(0, 40);                          // keeps one export from running for ever
    stillLocal += pending.length - batch.length;
    const changed = new Set(); let n = 0;
    for(const p of batch){
      n++; showToast(t('exportUploading', n, batch.length));
      let url = null;
      try{ url = await uploadAttachmentFile(dataUrlToFile(p.a.dataUrl, p.a.name), ()=>{}); }catch(e){ url = null; }
      if(url){ p.a.storageUrl = url; p.a.dataUrl = null; p.r._updatedAt = Date.now(); changed.add(p.r); } else stillLocal++;
    }
    if(changed.size){ saveData(key, arr); changed.forEach(r=> cloudPushRecord(key, r)); }
  }
  return stillLocal;
}
function warnLocalOnlyAttachments(n){ if(n > 0) alert(t('exportLocalLeft', n)); }
async function exportModuleExcel(m, selectedBranches){
  showToast(t('exportPreparing'));
  const relKeys = (m.relatedExports || []).map(r=>r.module);
  const stillLocal = await uploadPendingAttachments([m.key, ...relKeys]);
  await prefetchExcelThumbs(collectAttachments([...loadData(m.key), ...relKeys.flatMap(k=> loadData(k))], ["photos","techReport","docFiles"]));
  const workbook = new ExcelJS.Workbook();
  let filtered = getFilteredData(m);
  if(selectedBranches && selectedBranches.length && m.branchField){
    filtered = filtered.filter(r=> splitBranchNames(r[m.branchField]).some(b=> selectedBranches.includes(b)));
  }
  const ms = state.moduleState[m.key];
  const statusFilter = ms ? ms.status : "all";
  const { rows, raw } = await moduleToSheetData(m, filtered, statusFilter);
  addStyledSheet(workbook, ML(m,"name"), moduleExportHeaders(m, statusFilter), rows, { fields: moduleExportFields(m, statusFilter), rawRecords: raw, photoField: modulePhotoField(m), photoField2: moduleSecondAttachmentField(m) });

  if(m.relatedExports && m.relatedExports.length){
    for(const rel of m.relatedExports){
      const relModule = MODULES.find(x=>x.key===rel.module);
      if(!relModule) continue;
      const matchValues = new Set(raw.map(r=>(r[rel.matchField]||"").trim()).filter(Boolean));
      if(!matchValues.size) continue;
      let relRecords;
      if(m.key==="fleet" && rel.matchField==="plate"){
        // tolerant matching: explicit link OR plate with different spacing/letter variants
        const idSet = new Set(raw.map(r=>r.id));
        const plateSet = new Set(raw.map(r=>normalizePlate(r.plate)).filter(Boolean));
        relRecords = loadData(relModule.key).filter(r=> idSet.has(r.linkedVehicleId) || plateSet.has(normalizePlate(r.plate)));
      } else {
        relRecords = loadData(relModule.key).filter(r=> matchValues.has((r[rel.matchField]||"").trim()));
      }
      if(!relRecords.length) continue;
      const relRows = await rowsToTranslatedSheetData(relModule, relRecords, null, true);
      const sheetTitle = LANG==='ar' ? rel.titleAr : rel.titleEn;
      addStyledSheet(workbook, sheetTitle, moduleExportHeaders(relModule, null, true), relRows, { fields: moduleExportFields(relModule, null, true), rawRecords: relRecords, photoField: modulePhotoField(relModule), photoField2: moduleSecondAttachmentField(relModule) });
    }
  }

  const suffix = (ms && ms.dateRange && ms.dateRange.preset!=="all") ? "_"+ms.dateRange.preset : "";
  await downloadWorkbook(workbook, `GroupForka_${m.key}${suffix}_${todayStr()}.xlsx`);
  showToast(t('exportedFile'));
  warnLocalOnlyAttachments(stillLocal);
}
