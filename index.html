/* Collect all critical / overdue items across modules (mirrors the Reports page logic) */
function gatherCriticalItemsForNotif(){
  let items = [];
  MODULES.forEach(m=>{
    const all = loadData(m.key);
    all.forEach(r=>{
      const flagged = isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim());
      if(flagged){
        const label = r.branch || r.company || r.reqNo || r.plate || r.name || "";
        const dateVal = m.dateFieldForReports ? r[m.dateFieldForReports] : "";
        items.push({ module: ML(m,"name"), label, date: dateVal||"", status: r[m.statusField]||"", overdue: isOverdue(m,r) });
      }
    });
  });
  return items;
}
function buildEmailParams(items){
  const lines = items.map((it,i)=>
    `${i+1}. [${it.module}] ${it.label} — ${optLabel(it.status)}${it.overdue? " ("+t('overdueTag')+")":""}${it.date? " — "+it.date:""}`
  );
  return {
    to_email: getNotifConfig().email,
    subject: `GROUP FORKA — ${items.length} ${LANG==='ar'?'بند يحتاج متابعة':'item(s) need follow-up'}`,
    critical_count: String(items.length),
    items_list: lines.join("\n"),
    date: new Date().toLocaleString(LANG==="ar"?"ar-EG":"en-GB"),
  };
}
function sendNotificationEmail(manual, onDone){
  const cfg = getNotifConfig();
  const items = gatherCriticalItemsForNotif();
  if(!items.length){
    if(manual) showToast(t('notifNoCriticalNow'));
    if(onDone) onDone(false);
    return;
  }
  if(!cfg.email || !cfg.serviceId || !cfg.templateId || !cfg.publicKey){
    if(manual) alert(t('notifMissingFields'));
    if(onDone) onDone(false);
    return;
  }
  if(!window.emailjs){
    if(manual) alert(t('notifSentFail'));
    if(onDone) onDone(false);
    return;
  }
  const params = buildEmailParams(items);
  if(manual) showToast(t('notifSending'));
  emailjs.send(cfg.serviceId, cfg.templateId, params).then(()=>{
    setLastSentDate();
    if(manual) showToast(t('notifSentOk'));
    if(onDone) onDone(true);
  }).catch((err)=>{
    console.error("EmailJS send failed:", err);
    if(manual) alert(t('notifSentFail'));
    if(onDone) onDone(false);
  });
}
function maybeAutoSendNotification(){
  const cfg = getNotifConfig();
  if(!cfg.enabled) return;
  if(getLastSentDate() === todayStr()) return; // already sent today
  sendNotificationEmail(false);
}

function uploadFileToStorage(file, onProgress){
  if(!cloudEnabled || !window.firebase || !firebase.storage){ return Promise.resolve(null); }
  try{
    const storage = firebase.storage();
    const safeName = (file.name||"file").replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `attachments/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`;
    const ref = storage.ref().child(path);
    return new Promise((resolve)=>{
      try{
        const task = ref.put(file);
        task.on("state_changed",
          (snapshot)=>{ if(onProgress && snapshot.totalBytes) onProgress(Math.round((snapshot.bytesTransferred/snapshot.totalBytes)*100)); },
          (err)=>{ console.error("Storage upload failed:", err); resolve(null); },
          ()=>{ task.snapshot.ref.getDownloadURL().then(resolve).catch(()=>resolve(null)); }
        );
      }catch(e){ console.error("Storage upload error:", e); resolve(null); }
    });
  }catch(e){
    console.error("Storage upload error:", e);
    return Promise.resolve(null);
  }
}

function saveCloudinaryConfig(cfg){ localStorage.setItem("forka_cloudinary_config", JSON.stringify(cfg)); }
function clearCloudinaryConfig(){ localStorage.removeItem("forka_cloudinary_config"); }
function uploadFileToCloudinary(file, onProgress){
  const cfg = getCloudinaryConfig();
  if(!cfg || !cfg.cloudName || !cfg.uploadPreset) return Promise.resolve(null);
  return new Promise((resolve)=>{
    try{
      const xhr = new XMLHttpRequest();
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", cfg.uploadPreset);
      xhr.timeout = 6 * 60 * 1000; // 6 minutes — generous for large video files
      xhr.open("POST", `https://api.cloudinary.com/v1_1/${cfg.cloudName}/auto/upload`, true);
      if(xhr.upload && onProgress){
        xhr.upload.onprogress = (e)=>{
          if(e.lengthComputable) onProgress(Math.round((e.loaded/e.total)*100));
        };
      }
      xhr.onload = ()=>{
        try{
          const data = JSON.parse(xhr.responseText);
          resolve(data.secure_url || null);
        }catch(e){ resolve(null); }
      };
      xhr.onerror = ()=>{ console.error("Cloudinary upload network error"); resolve(null); };
      xhr.ontimeout = ()=>{ console.error("Cloudinary upload timed out"); resolve(null); };
      xhr.send(formData);
    }catch(e){ console.error("Cloudinary upload setup error:", e); resolve(null); }
  });
}

function attachCloudListeners(){
  Object.values(cloudUnsubscribers).forEach(u=>{ try{ u && u(); }catch(e){} });
  cloudUnsubscribers = {};
  MODULES.forEach(m=>{
    cloudUnsubscribers[m.key] = cloudDb.collection("forka_"+m.key).onSnapshot(snap=>{
      const arr = [];
      snap.forEach(doc=> arr.push(doc.data()));
      const existing = loadDataRaw(m.key);
      const isFirstSync = !cloudFirstSyncReceived[m.key];
      cloudFirstSyncReceived[m.key] = true;
      // Safety guard: Firestore can return an empty/stale cached snapshot BEFORE the real data
      // arrives (e.g. slow connection or briefly offline right at page load). Blindly overwriting
      // localStorage in that moment would silently wipe real data. Only guard the FIRST snapshot;
      // once a real connection is established, genuine deletions still sync normally afterward.
      if(isFirstSync && arr.length === 0 && existing.length > 0){
        console.warn("Ignoring empty first cloud snapshot for ["+m.key+"] to protect "+existing.length+" existing local record(s)");
        setLastSyncNow();
        return;
      }
      saveData(m.key, arr);
      setLastSyncNow();
      if(isDriverMode || isBranchInspectMode || isPublicMode || isExpenseMode) return; // standalone pages manage their own rendering
      if(isAccountantMode){ if(m.key==="expenses" && typeof window.__accountantRefresh==="function") window.__accountantRefresh(); return; }

      if(state.view===m.key) renderModule(m.key);
      if(state.view==="dashboard") renderDashboard();
      renderNav();
    }, err=> console.error("Cloud sync error ["+m.key+"]:", err));
  });
  cloudUnsubscribers.masters = cloudDb.collection("forka_meta").doc("masters").onSnapshot(doc=>{
    cloudMastersSynced = true;
    if(doc.exists){
      saveMasters(doc.data());
      if(state.view==="masters") renderMastersPage();
      if(isAccountantMode && typeof window.__accountantRemount==="function") window.__accountantRemount();
    }
  }, err=> console.error("Cloud sync error [masters]:", err));
  cloudUnsubscribers.settings = cloudDb.collection("forka_meta").doc("settings").onSnapshot(doc=>{
    if(doc.exists){

/* Cloud writes used to fail SILENTLY (console only). Now every failure is counted and, once per session, the admin is told
   plainly — a rejected write (typically Firebase security rules) means data stays on this device only and can even be
   replaced by the cloud copy on the next sync. Each helper resolves to true/false so callers can verify. */
let cloudWriteOk = 0, cloudWriteFail = 0, cloudLastErrorCode = null, cloudFailAlerted = false;
function cloudWrite(promise, label){
  return promise.then(()=>{ cloudWriteOk++; setLastSyncNow(); return true; }, err=>{
    cloudWriteFail++; cloudLastErrorCode = (err && err.code) || "unknown";
    console.error("Cloud write failed ["+label+"]:", err);
    const adminMode = !(isDriverMode || isBranchInspectMode || isPublicMode || isAssetViewMode || isExpenseMode || isAccountantMode);
    if(adminMode && !cloudFailAlerted){ cloudFailAlerted = true; try{ alert(t('cloudWriteFailed', cloudLastErrorCode)); }catch(e){} }
    return false;
  });
}
function cloudPushRecord(moduleKey, record){
  if(!cloudEnabled || !cloudDb) return Promise.resolve(true);
  return cloudWrite(cloudDb.collection("forka_"+moduleKey).doc(record.id).set(record), "push "+moduleKey);
}
function cloudDeleteRecord(moduleKey, id){
  if(!cloudEnabled || !cloudDb) return Promise.resolve(true);
  return cloudWrite(cloudDb.collection("forka_"+moduleKey).doc(id).delete(), "delete "+moduleKey);
}
function cloudPushMasters(obj){
  if(!cloudEnabled || !cloudDb) return Promise.resolve(true);
  const ref = cloudDb.collection("forka_meta").doc("masters");
  if(!cloudMastersSynced){
    // This device has not yet received the shared list: NEVER replace it — only add to it (arrayUnion), so a half-loaded
    // local copy can never wipe the real branch list.
    const FV = window.firebase && firebase.firestore && firebase.firestore.FieldValue;
    if(!FV || !FV.arrayUnion) return Promise.resolve(false);
    const add = {};
    Object.keys(obj||{}).forEach(k=>{ if(Array.isArray(obj[k]) && obj[k].length) add[k] = FV.arrayUnion(...obj[k]); });
    return cloudWrite(ref.set(add, {merge:true}), "masters (additive)");
  }
  return cloudWrite(ref.set(obj), "masters");
}
function cloudPushChecklist(kind, obj){
  if(!cloudEnabled || !cloudDb) return;
  cloudDb.collection("forka_meta").doc("checklist_"+kind).set(obj).then(setLastSyncNow).catch(err=>console.error("Cloud push checklist failed:", err));
}
function cloudWipeModule(moduleKey){
  if(!cloudEnabled || !cloudDb) return Promise.resolve();
  return cloudDb.collection("forka_"+moduleKey).get().then(snap=>{
    const batchDeletes = [];
    snap.forEach(doc=> batchDeletes.push(doc.ref.delete()));
    return Promise.all(batchDeletes);
  });
}
function migrateLocalDataToCloud(onDone){
  if(!cloudEnabled || !cloudDb){ if(onDone) onDone(false); return; }
  const jobs = [];
  MODULES.forEach(m=>{
    loadData(m.key).forEach(rec=>{
      jobs.push(cloudDb.collection("forka_"+m.key).doc(rec.id).set(rec));
    });
  });
  jobs.push(cloudDb.collection("forka_meta").doc("masters").set(loadMasters()));
  jobs.push(cloudDb.collection("forka_meta").doc("checklist_daily").set(loadChecklist("daily")));
  jobs.push(cloudDb.collection("forka_meta").doc("checklist_monthly").set(loadChecklist("monthly")));
  Promise.all(jobs).then(()=>{ setLastSyncNow(); if(onDone) onDone(true); })
    .catch(err=>{ console.error("Migration failed:", err); if(onDone) onDone(false, err); });
}

function computeRangeDates(preset, customFrom, customTo){
  if(preset==="today") return { from: todayStr(), to: todayStr() };
  if(preset==="week"){ const d=new Date(); d.setDate(d.getDate()-6); return { from:d.toISOString().slice(0,10), to: todayStr() }; }
  if(preset==="month"){ const d=new Date(); d.setDate(d.getDate()-29); return { from:d.toISOString().slice(0,10), to: todayStr() }; }
  return { from: customFrom||todayStr(), to: customTo||todayStr() };
}
function prevPeriod(from, to){
  const fromD = new Date(from), toD = new Date(to);
  const days = Math.max(1, Math.round((toD-fromD)/86400000)+1);
  const prevTo = new Date(fromD); prevTo.setDate(prevTo.getDate()-1);
  const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(days-1));
  return { from: prevFrom.toISOString().slice(0,10), to: prevTo.toISOString().slice(0,10) };
}
function recordsInRange(m, from, to, branch){
  const fromD = new Date(from), toD = new Date(to); toD.setHours(23,59,59,999);
  let data = loadData(m.key);
  if(branch && branch!=="all" && m.branchField){
    data = data.filter(r=> (r[m.branchField]||"")===branch);
  }
  if(!m.dateFieldForReports) return [];
  return data.filter(r=>{
    if(!r[m.dateFieldForReports]) return false;
    const d = new Date(r[m.dateFieldForReports]);
    return d>=fromD && d<=toD;
  });
}
function moduleSummary(m, from, to, branch){
  const recs = recordsInRange(m, from, to, branch);
  const openCount = m.statusField ? recs.filter(r=>["مفتوح","قيد التنفيذ","مجدول","قيد الإصلاح"].includes((r[m.statusField]||"").trim())).length : 0;
  const closedCount = m.statusField ? recs.filter(r=>["مغلق","منجز في موعده","منجز متأخر","تم التسليم","مكتمل"].includes((r[m.statusField]||"").trim())).length : 0;
  const critCount = recs.filter(r=> isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim())).length;
  const totalCost = m.costField ? recs.reduce((s,r)=> s+(Number(r[m.costField])||0), 0) : 0;
  return { count: recs.length, openCount, closedCount, critCount, totalCost, recs };
}
function deltaBadge(curr, prev){
  if(prev===0 && curr===0) return `<span class="badge badge-muted">${t('deltaSame')}</span>`;
  if(prev===0) return `<span class="badge badge-warning">${t('deltaUp')} ${curr}</span>`;
  const diff = curr-prev;
  const pct = Math.round((diff/prev)*100);
  if(diff===0) return `<span class="badge badge-muted">${t('deltaSame')} 0%</span>`;
  const cls = diff>0 ? "badge-danger" : "badge-success";
  const arrow = diff>0 ? t('deltaUp') : t('deltaDown');
  return `<span class="badge ${cls}">${arrow} ${Math.abs(pct)}%</span>`;
}
function svgBarChart(points, opts){
  opts = opts||{};
  const w = opts.width||640, h = opts.height||160, pad = 28;
  if(!points.length || points.every(p=>p.value===0)){
    return `<div style="padding:30px; text-align:center; color:var(--muted); font-size:13px;">${t('mrNoChartData')}</div>`;
  }
  const max = Math.max(...points.map(p=>p.value), 1);
  const bw = (w-pad*2) / points.length;
  const bars = points.map((p,i)=>{
    const bh = Math.round((p.value/max) * (h-pad*2));
    const x = pad + i*bw + bw*0.15;
    const y = h-pad-bh;
    const bwReal = bw*0.7;
    return `<rect x="${x}" y="${y}" width="${bwReal}" height="${bh}" rx="3" fill="#1F3864"/>
            <text x="${x+bwReal/2}" y="${h-pad+14}" font-size="9" text-anchor="middle" fill="#666">${p.label}</text>
            <text x="${x+bwReal/2}" y="${y-4}" font-size="9" text-anchor="middle" fill="#1F3864" font-weight="700">${p.value}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; max-width:${w}px; height:${h}px;">${bars}<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#ddd"/></svg>`;
}
function bucketRecordsByDay(recs, dateField, from, to){
  const fromD = new Date(from), toD = new Date(to);
  const days = Math.max(1, Math.round((toD-fromD)/86400000)+1);
  const buckets = [];
  for(let i=0;i<days;i++){
    const d = new Date(fromD); d.setDate(d.getDate()+i);
    const key = d.toISOString().slice(0,10);
    const label = LANG==="ar" ? d.toLocaleDateString("ar-EG",{day:"2-digit",month:"2-digit"}) : d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit"});
    const value = recs.filter(r=> (r[dateField]||"").slice(0,10)===key).length;
    buckets.push({label, value});
  }
  // collapse to max ~12 buckets by merging if too many days
  if(buckets.length>14){
    const groupSize = Math.ceil(buckets.length/14);
    const grouped = [];
    for(let i=0;i<buckets.length;i+=groupSize){
      const slice = buckets.slice(i,i+groupSize);
      grouped.push({label:slice[0].label, value: slice.reduce((s,b)=>s+b.value,0)});
    }
    return grouped;
  }
  return buckets;
}
function computeTopItems(recs, field, limit){
  const counts = {};
  recs.forEach(r=>{
    const v = (r[field]||"").trim();
    if(!v) return;
    counts[v] = (counts[v]||0)+1;
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit||5).map(([label,count])=>({label,count}));
}
function computeContractorPerfForRecords(recs, contractorField){
  const evals = loadData("contractorEval");
  const names = [...new Set(recs.map(r=>(r[contractorField]||"").trim()).filter(Boolean))];
  return names.map(name=>{
    const scores = evals.filter(e=>(e.contractor||"").trim()===name).map(e=>Number(e.weightedTotal)||0);
    const avg = scores.length ? Math.round((scores.reduce((a,b)=>a+b,0)/scores.length)*10)/10 : null;
    const jobCount = recs.filter(r=>(r[contractorField]||"").trim()===name).length;
    return { name, avg, jobCount };
  }).sort((a,b)=> (b.avg||0)-(a.avg||0));
}

/* ---- Report archive (per module), synced to cloud like other collections ---- */
function loadReportArchive(moduleKey){
  try{ return JSON.parse(BigStore.getString("forka_reportarchive_"+moduleKey)) || []; }catch(e){ return []; }
}
function saveReportArchive(moduleKey, arr){ BigStore.setString("forka_reportarchive_"+moduleKey, JSON.stringify(arr)); }
function archiveModuleReport(m, from, to, branch){
  const summary = moduleSummary(m, from, to, branch);
  const snapshot = {
    id: uid(), from, to, branch: branch||"all", savedAt: new Date().toISOString(),
    count: summary.count, openCount: summary.openCount, closedCount: summary.closedCount,
    critCount: summary.critCount, totalCost: summary.totalCost,
    topItems: computeTopItems(summary.recs, m.freqField, 5),
  };
  const arr = loadReportArchive(m.key);
  arr.unshift(snapshot);
  saveReportArchive(m.key, arr);
  if(cloudEnabled && cloudDb) cloudDb.collection("forka_reportarchive_"+m.key).doc(snapshot.id).set(snapshot).catch(e=>console.error(e));
  return snapshot;
}

/* ---- Weekly email schedule config (reuses EmailJS connection from Notifications) ---- */
function getWeeklyScheduleConfig(){
  try{ return JSON.parse(localStorage.getItem("forka_weekly_report_config")) || {modules:[]}; }catch(e){ return {modules:[]}; }
}
function saveWeeklyScheduleConfig(cfg){ localStorage.setItem("forka_weekly_report_config", JSON.stringify(cfg)); }
function toggleWeeklyModule(moduleKey, enabled){
  const cfg = getWeeklyScheduleConfig();
  cfg.modules = cfg.modules||[];
  if(enabled && !cfg.modules.includes(moduleKey)) cfg.modules.push(moduleKey);
  if(!enabled) cfg.modules = cfg.modules.filter(k=>k!==moduleKey);
  saveWeeklyScheduleConfig(cfg);
}
function maybeAutoSendWeeklyReports(){
  const notifCfg = getNotifConfig();
  const weekCfg = getWeeklyScheduleConfig();
  if(!notifCfg.enabled || !weekCfg.modules || !weekCfg.modules.length) return;
  const now = new Date();
  if(now.getDay() !== 1) return; // Monday only
  const thisWeekKey = todayStr();
  const lastSentWeek = localStorage.getItem("forka_weekly_report_lastsent") || "";
  if(lastSentWeek === thisWeekKey) return;
  const range = computeRangeDates("week");
  const lines = [];
  weekCfg.modules.forEach(key=>{
    const m = MODULES.find(x=>x.key===key);
    if(!m) return;
    const s = moduleSummary(m, range.from, range.to, "all");
    lines.push(`${m.icon} ${ML(m,"name")}: ${s.count} ${LANG==='ar'?'جديد':'new'}, ${s.openCount} ${LANG==='ar'?'مفتوح':'open'}, ${s.critCount} ${LANG==='ar'?'حرج':'critical'}${m.costField? ", "+fmtMoney(s.totalCost)+" "+t('reportCost'):""}`);
  });
  if(!window.emailjs || !notifCfg.serviceId) return;
  const params = {
    to_email: notifCfg.email,
    subject: `GROUP FORKA — ${LANG==='ar'?'التقرير الأسبوعي':'Weekly Report'} (${range.from} → ${range.to})`,
    critical_count: String(weekCfg.modules.length),
    items_list: lines.join("\n"),
    date: new Date().toLocaleString(LANG==="ar"?"ar-EG":"en-GB"),
  };
  emailjs.send(notifCfg.serviceId, notifCfg.templateId, params).then(()=>{
    localStorage.setItem("forka_weekly_report_lastsent", thisWeekKey);
  }).catch(err=> console.error("Weekly report email failed:", err));
}

function loadChecklist(kind){

}
function saveChecklist(kind, obj){ localStorage.setItem("forka_checklist_"+kind, JSON.stringify(obj)); }
function currentMonthKey(){ return todayStr().slice(0,7); }

function checklistCompletionLabel(doneCount, total){
  if(doneCount===0) return {cls:"badge-muted", text:t('checklistNone')};
  if(doneCount===total) return {cls:"badge-success", text:t('checklistCompleted')};
  return {cls:"badge-warning", text:t('checklistPartial')};
}

    monthlyHistoryRows.push(`<tr><td>${key}</td><td>${doneCount}/${monthlyItems.length}</td><td><span class="badge ${lbl.cls}">${lbl.text}</span></td></tr>`);

      </div>
      <div class="card">
        <div class="label" style="margin-bottom:10px;">${t('checklistMonthlyTitle')}${monthKey}</div>
        <div>${checkRow(monthlyItems, monthState, "monthly", monthKey)}</div>
      </div>
    </div>
    <div class="grid-cards" style="grid-template-columns:1fr 1fr; margin-top:6px;">
      <div>

        <div class="table-wrap"><table><thead><tr><th>${LANG==='ar'?'التاريخ':'Date'}</th><th>${t('checklistDoneLabel')}</th><th>${t('thStatus')}</th></tr></thead>

      </div>

function icsEscape(s){ return (s||"").toString().replace(/[\\,;]/g, m=>"\\"+m).replace(/\n/g,"\\n"); }
function exportCalendarToIcs(){
  const events = getAllCalendarEvents();
  if(!events.length){ alert(t('calendarNoEventsToExport')); return; }
  const pad = n => String(n).padStart(2,"0");
  const dateStamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GROUP FORKA//Maintenance System//AR\r\nCALSCALE:GREGORIAN\r\n";

    ics += "BEGIN:VEVENT\r\n";
    ics += `UID:${ev.moduleKey}-${ev.id}@groupforka\r\n`;
    ics += `DTSTAMP:${dateStamp(new Date())}T000000Z\r\n`;
    ics += `DTSTART;VALUE=DATE:${dateStamp(ev.date)}\r\n`;
    ics += `SUMMARY:${icsEscape(`${ev.moduleName} — ${ev.title}`)}\r\n`;
    ics += "END:VEVENT\r\n";
  });
  ics += "END:VCALENDAR\r\n";
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});

if(!state.globalSearchQuery) state.globalSearchQuery = "";
function normalizeSearchText(text){
  return text
    .toLowerCase()
    .replace(/\s+/g, "")               // ignore spacing differences (e.g. plate numbers)
    .replace(/[أإآ]/g, "ا")             // normalize hamza variants
    .replace(/ة/g, "ه")                 // normalize ta marbuta / ha
    .replace(/ى/g, "ي");                // normalize alef maqsura / ya
}
/* Accidents & violations belong to a vehicle either by an explicit link (linkedVehicleId, set on save)
   or by plate number (spacing / letter-variant tolerant) — so older records link automatically too. */
function accidentsForVehicle(vehicle, accidentsList){
  const list = accidentsList || loadData("accidents");
  return list.filter(a=> a.linkedVehicleId===vehicle.id || (vehicle.plate && platesMatch(a.plate, vehicle.plate)));
}
function vehicleEventStats(vehicle, accidentsList){
  const evs = accidentsForVehicle(vehicle, accidentsList);
  const accidents = evs.filter(a=> (a.type||"").trim()==="حادث");
  const violations = evs.filter(a=> (a.type||"").trim()==="مخالفة");
  const unpaid = violations.filter(a=> (a.paidStatus||"").trim()!=="مدفوعة");
  return {
    all: evs, accidents, violations, unpaid,
    totalCost: evs.reduce((s,a)=> s + (Number(a.cost)||0), 0),
    unpaidAmount: unpaid.reduce((s,a)=> s + (Number(a.cost)||0), 0),
  };
}
function normalizePlate(plate){
  // ignore spaces, dashes, dots, slashes and underscores so "أ ب ج 1111" = "أ-ب-ج-1111" = "أبج1111"
  return normalizeSearchText((plate||"").toString()).replace(/[\s\-_.\/\\]+/g, "");
}
function platesMatch(plateA, plateB){
  if(!plateA || !plateB) return false;
  return normalizePlate(plateA) === normalizePlate(plateB);
}
// Splits a branch field that may contain multiple branch names combined together
// (e.g. "الفجيرة، عجمان، الشارقة") into an array of individual, trimmed branch names.
// Detects which registered branches are mentioned inside a (possibly combined) branch field value,
// regardless of what separator was used between them (comma, space, slash, "و", or any mix).
function splitBranchNames(value){
  const text = (value||"").trim();
  if(!text) return [];
  const knownBranches = (typeof loadMasters==="function" ? (loadMasters().branches||[]) : []);
  if(knownBranches.length){
    const key = (s)=> normalizeSearchText(String(s||"")).replace(/[\s\-–—_.]+/g, "");
    const exact = knownBranches.find(b=> b.trim() && key(b)===key(text));
    if(exact) return [exact];                                         // the value IS one registered branch (spacing / spelling-tolerant)
    const sorted = knownBranches.filter(b=> b.trim()).sort((a,b)=> b.length - a.length);   // longer / more specific names first
    let rest = text; const found = [];
    sorted.forEach(b=>{
      const bt = b.trim();
      if(rest.includes(bt)){ found.push(b); rest = rest.split(bt).join(" | "); }   // a shorter name only counts if it appears OUTSIDE an already matched longer name
    });
    if(found.length) return found;
  }
  // Fallback (no registered branches matched): naive delimiter split
  return text.split(/[،,\/\-]|\sو\s/).map(s=>s.trim()).filter(Boolean);
}
function performGlobalSearch(query){
  const q = normalizeSearchText(query.trim());
  if(!q) return [];
  let results = [];
  MODULES.forEach(m=>{
    loadData(m.key).forEach(r=>{
      const matchField = Object.entries(r).find(([k,v])=> typeof v==="string" && normalizeSearchText(v).includes(q));
      if(matchField){
        const label = r.branch || r.company || r.reqNo || r.plate || r.name || r.carName || "";
        results.push({ moduleKey:m.key, moduleName:ML(m,"name"), moduleIcon:m.icon, id:r.id, label, matchedText: matchField[1] });
      }
    });
  });
  return results;
}

  document.getElementById("topbarTitle").textContent = t('globalSearchTitle');
  document.getElementById("topbarMeta").textContent = t('globalSearchMeta');
  document.getElementById("topbarActions").innerHTML = langSwitcherHtml();
  bindLangSwitcher();

  const results = performGlobalSearch(state.globalSearchQuery);
  document.getElementById("content").innerHTML = `
    <div class="toolbar no-print">
      <input type="text" id="globalSearchInput" placeholder="${t('globalSearchPlaceholder')}" value="${escapeAttr(state.globalSearchQuery)}" style="flex:1; max-width:420px;" autofocus>
      <div class="spacer"></div>

    id:a.id, moduleKey:"assets", name:a.name, branch:a.branch, price:a.price, purchaseDate:a.purchaseDate,
    mapX:a.mapX, mapY:a.mapY, icon:"🏷️",
  }));
  const fleetItems = loadData("fleet").map(v=>({
    id:v.id, moduleKey:"fleet", name:v.carName, branch:v.branch, price:v.price, purchaseDate:v.purchaseDate,
    mapX:v.mapX, mapY:v.mapY, icon:"🚙", plate:v.plate,
  }));
  let allItems = [...assetItems, ...fleetItems];
  if(state.assetMapBranchFilter){
    allItems = allItems.filter(it=> (it.branch||"").trim() === state.assetMapBranchFilter);
  }

  const dotsHtml = allItems.map((it,i)=>{
    let score;
    if(it.moduleKey==="assets"){
      const assetName = (it.name||"").trim().toLowerCase();
      const linkedRequests = loadData("requests").filter(r=>
        r.linkedAssetId === it.id || (assetName && (r.equipment||"").trim().toLowerCase() === assetName));
      const totalRepairCost = linkedRequests.reduce((s,r)=> s + (Number(r.cost)||0), 0);
      score = computeHealthScore(Number(it.price)||0, totalRepairCost, linkedRequests.length, it.purchaseDate);
    } else {
      const plate = (it.plate||"").trim();
      const accidents = loadData("accidents").filter(a=>platesMatch(a.plate, plate));
      const totalAccidentCost = accidents.reduce((s,a)=> s + (Number(a.cost)||0), 0);
      score = computeHealthScore(Number(it.price)||0, totalAccidentCost, accidents.length, it.purchaseDate);
    }
    const color = healthColor(score);
    const defaultX = 8 + (i % 6) * 15;
    const defaultY = 12 + Math.floor(i / 6) * 18;
    const x = it.mapX !== undefined ? it.mapX : defaultX;
    const y = it.mapY !== undefined ? it.mapY : defaultY;
    return `<div class="map-dot" data-itemid="${it.id}" data-modulekey="${it.moduleKey}" style="inset-inline-start:${x}%; top:${y}%; background:${color};" title="${escapeAttr(it.name||'')}">
      ${it.icon}
      <span class="map-dot-label">${escapeHtml((it.name||'').slice(0,14))}</span>
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="toolbar no-print" style="margin-bottom:10px;">
      <select id="assetMapBranchFilter">
        <option value="">${t('assetMapAllBranches')}</option>
        ${branches.map(b=>`<option value="${b}" ${state.assetMapBranchFilter===b?'selected':''}>${b}</option>`).join("")}
      </select>
      <div style="font-size:12px; color:var(--muted);">🏷️ ${t('assetMapLegendAsset')} &nbsp; 🚙 ${t('assetMapLegendVehicle')}</div>
    </div>
    <div class="banner no-print" style="margin-bottom:14px;">${t('assetMapInstructions')}</div>
    <div class="map-canvas" id="mapCanvas">${dotsHtml || `<div style="padding:40px; text-align:center; color:var(--muted);">${t('assetMapEmpty')}</div>`}</div>
  `;

  document.getElementById("assetMapBranchFilter").onchange = (e)=>{
    state.assetMapBranchFilter = e.target.value;
    renderAssetMapPage();
  };

  const canvas = document.getElementById("mapCanvas");
  let dragEl = null;
  canvas.querySelectorAll(".map-dot").forEach(dot=>{
    dot.addEventListener("pointerdown", (e)=>{
      dragEl = dot;
      dot.setPointerCapture(e.pointerId);
      dot.classList.add("dragging");
    });
    dot.addEventListener("click", (e)=>{
      if(dot.classList.contains("was-dragged")){ dot.classList.remove("was-dragged"); return; }
      const mk = dot.dataset.modulekey;
      const rec = loadData(mk).find(x=>x.id===dot.dataset.itemid);
      const mod = MODULES.find(m=>m.key===mk);
      if(rec && mod) openForm(mod, rec, true);
    });
  });
  canvas.addEventListener("pointermove", (e)=>{
    if(!dragEl) return;
    dragEl.classList.add("was-dragged");
    const rect = canvas.getBoundingClientRect();
    let xPct = ((e.clientX - rect.left) / rect.width) * 100;
    let yPct = ((e.clientY - rect.top) / rect.height) * 100;
    xPct = Math.max(0, Math.min(96, xPct));
    yPct = Math.max(0, Math.min(92, yPct));
    dragEl.style.insetInlineStart = xPct+"%";
    dragEl.style.top = yPct+"%";
  });
  canvas.addEventListener("pointerup", (e)=>{
    if(!dragEl) return;
    const mk = dragEl.dataset.modulekey;
    const itemId = dragEl.dataset.itemid;
    const xPct = parseFloat(dragEl.style.insetInlineStart);
    const yPct = parseFloat(dragEl.style.top);
    const arr = loadDataRaw(mk);
    const idx = arr.findIndex(x=>x.id===itemId);
    if(idx>=0){ arr[idx].mapX = xPct; arr[idx].mapY = yPct; saveData(mk, arr); cloudPushRecord(mk, arr[idx]); }
    dragEl.classList.remove("dragging");
    dragEl = null;
  });
}

/* ---------------- EXPENSE REPORT (monthly, by branch) + DETAILS ---------------- */
const expenseReportState = { month:"", branch:"", department:"", category:"", payment:"", review:"", basis:"net", groupBy:"category", search:"", _init:false };
window.expenseReportState = expenseReportState;
function expenseModule(){ return MODULES.find(m=>m.key==="expenses"); }
function efl(key){ const f = expenseModule().fields.find(x=>x.key===key); return f ? FL(f) : key; }
function fmt2(n){ return Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function expenseAllocs(rec){ return (Array.isArray(rec.allocations) && rec.allocations.length) ? rec.allocations : computeExpenseAllocations(rec); }
function expenseFilteredInvoices(st){
  const needle = st.search ? normalizeSearchText(st.search) : "";
  return loadData("expenses").filter(r=>{
    if(st.month && expenseMonth(r)!==st.month) return false;
    if(st.department && r.department!==st.department) return false;
    if(st.category && r.category!==st.category) return false;
    if(st.payment && (r.paymentStatus||"")!==st.payment) return false;
    if(st.review && (r.reviewStatus||"جديدة")!==st.review) return false;
    if(st.branch && !expenseAllocs(r).some(a=>a.branch===st.branch)) return false;
    if(needle && !normalizeSearchText([r.expNo,r.invoiceNo,r.vendor,r.employee,r.project,r.notes,r.bimoRef,r.submittedBy].join(" ")).includes(needle)) return false;
    return true;
  }).sort((a,b)=> String(b.date||"").localeCompare(String(a.date||"")) || String(b.expNo||"").localeCompare(String(a.expNo||"")));
}
function expenseLines(invoices, st){
  const lines = [];
  invoices.forEach(r=> expenseAllocs(r).forEach(a=>{ if(st.branch && a.branch!==st.branch) return; lines.push({rec:r, alloc:a}); }));
  return lines;
}
function expenseAmount(a, st){ return st.basis==="total" ? a.total : a.net; }
function expenseGroupValue(rec, groupBy){
  return groupBy==="department" ? (rec.department||"—") : groupBy==="vendor" ? (rec.vendor||"—") : (rec.category||"—");
}
function expenseGroupLabel(groupBy){ return groupBy==="department" ? t('expGroupDepartment') : groupBy==="vendor" ? t('expGroupVendor') : t('expGroupCategory'); }
function expenseGroupShown(g, groupBy){ return groupBy==="vendor" ? g : optLabel(g); }
function expensePivot(lines, st){
  const reg = loadMasters().branches || [];
  const used = [...new Set(lines.map(l=>l.alloc.branch))];
  const branches = [...reg.filter(b=>used.includes(b)), ...used.filter(b=>!reg.includes(b))];
  const rows = {};
  lines.forEach(l=>{
    const g = expenseGroupValue(l.rec, st.groupBy);
    const row = rows[g] = rows[g] || {byBranch:{}, total:0};
    const v = expenseAmount(l.alloc, st);
    row.byBranch[l.alloc.branch] = round2((row.byBranch[l.alloc.branch]||0) + v);
    row.total = round2(row.total + v);
  });
  const groups = Object.keys(rows).sort((a,b)=> rows[b].total - rows[a].total);
  const colTotals = {};
  branches.forEach(b=> colTotals[b] = round2(lines.filter(l=>l.alloc.branch===b).reduce((s,l)=>s+expenseAmount(l.alloc, st),0)));
  return { branches, groups, rows, colTotals, grand: round2(lines.reduce((s,l)=>s+expenseAmount(l.alloc, st),0)) };
}
function expenseSummary(invoices, lines, st){
  const unpaidInv = invoices.filter(r=> ["غير مدفوعة","مدفوعة جزئيًا"].includes((r.paymentStatus||"").trim()));
  const unpaidIds = new Set(unpaidInv.map(r=>r.id));
  const unpaidLines = lines.filter(l=> unpaidIds.has(l.rec.id));
  return {
    count: invoices.length,
    total: round2(lines.reduce((s,l)=>s+expenseAmount(l.alloc, st),0)),
    unpaidCount: unpaidInv.length,
    unpaid: round2(unpaidLines.reduce((s,l)=>s+expenseAmount(l.alloc, st),0)),
    toReview: invoices.filter(r=> ["جديدة","استفسار"].includes((r.reviewStatus||"جديدة").trim())).length,
  };
}

function expenseResultsHtml(st, mode){
  const invoices = expenseFilteredInvoices(st);

    ${card(t('expSumToReview'), sum.toReview, sum.toReview?'#d98e1f':'#1f8a4c')}</div>`;

      <tr style="background:var(--bg); font-weight:900;"><td>${t('expPivotTotal')}</td>${pv.branches.map(b=>`<td>${fmt2(pv.colTotals[b])}</td>`).join("")}<td>${fmt2(pv.grand)}</td></tr></tbody></table></div>` : "";
  const list = `<div class="section-title">${t('expListTitle')}</div>

/* Everything written to an export follows the program language: exact glossary names first, then the online translator
   (when automatic translation is on). Arabic exports keep the text as typed. Returns a lookup function. */
async function buildExportTranslator(values){
  const map = new Map();
  const uniq = [...new Set(values.map(v=> String(v==null ? "" : v).trim()).filter(Boolean))];
  const todo = [];
  uniq.forEach(v=>{
    const g = glossaryLookup(v, LANG);
    if(g && detectTextLang(v) !== LANG) map.set(v, g);
    else if(LANG === "en" && detectTextLang(v) === "ar" && getAutoTranslateEnabled()) todo.push(v);
  });
  for(let i = 0; i < todo.length; i += 6){
    const batch = todo.slice(i, i + 6);
    const res = await Promise.all(batch.map(v=> translateText(v, LANG).catch(()=> v)));
    batch.forEach((v,k)=> map.set(v, res[k] || v));
  }
  return (v)=>{ const s = String(v==null ? "" : v); return map.get(s.trim()) || s; };
}
/* free text shown in the screen: the exact glossary name or the online translation replaces it when the program is in English */
function autoTr(text){
  const s = String(text==null ? "" : text);
  if(!s.trim()) return "";
  return `<span data-autotranslate="1" data-original="${escapeAttr(s)}">${escapeHtml(s)}</span>`;
}

  const branches = masters.branches || [];
  const branchModules = MODULES.filter(m=>m.branchField);

  let rows = branches.map(branch=>{
    let totalRequests = 0, totalCost = 0, criticalCount = 0, closedCount = 0, totalCount = 0;
    branchModules.forEach(m=>{
      const data = loadData(m.key).filter(r=> splitBranchNames(r[m.branchField]).includes(branch.trim()));
      totalCount += data.length;
      if(m.key==="requests") totalRequests += data.length;
      if(m.costField) totalCost += data.reduce((s,r)=> s + (Number(r[m.costField])||0), 0);
      criticalCount += data.filter(r=> isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim())).length;
      if(m.statusField) closedCount += data.filter(r=>["مغلق","منجز في موعده","تم التسليم","مكتمل"].includes((r[m.statusField]||"").trim())).length;
    });
    const equipmentCount = loadData("assets").filter(a=> splitBranchNames(a.branch).includes(branch.trim())).length
      + loadData("fleet").filter(v=> splitBranchNames(v.branch).includes(branch.trim())).length;
    const closureRate = totalCount ? Math.round((closedCount/totalCount)*100) : null;
    return { branch, totalRequests, totalCost, criticalCount, closureRate, equipmentCount };
  }).sort((a,b)=> b.totalCost - a.totalCost);

  const grandTotalCost = rows.reduce((s,r)=> s + r.totalCost, 0);
  const avgCost = rows.length ? grandTotalCost / rows.length : 0;
  const maxCost = rows.length ? Math.max(...rows.map(r=>r.totalCost), 1) : 1;
  rows.forEach((r,i)=>{
    r.costRank = i + 1;

    ${chartHtml}
    <div class="table-wrap">

        <thead><tr>
          <th>${t('bcBranch')}</th><th>${t('bcTotalRequests')}</th><th>${t('bcTotalCost')}</th>
          <th>${t('bcCostRank')}</th><th>${t('bcCostShare')}</th><th>${t('bcVsAverage')}</th>
          <th>${t('bcCritical')}</th><th>${t('bcClosureRate')}</th><th>${t('bcEquipmentCount')}</th>
        </tr></thead>
        <tbody>
        ${rows.length ? rows.map(r=>`
          <tr>
            <td><b>${r.branch}</b></td>

            <td>${r.costShare}%</td>
            <td><span class="badge ${r.vsAverage>0?'badge-danger':r.vsAverage<0?'badge-success':'badge-muted'}">${r.vsAverage>0?'+':''}${r.vsAverage}%</span></td>
            <td>${r.criticalCount>0? `<span class="badge badge-danger">${r.criticalCount}</span>` : "0"}</td>
            <td>${r.closureRate!==null? `<span class="badge ${r.closureRate>=80?'badge-success':r.closureRate>=50?'badge-warning':'badge-danger'}">${r.closureRate}%</span>` : "—"}</td>
            <td><span class="badge badge-muted">${r.equipmentCount}</span></td>
          </tr>`).join("") : `<tr class="empty-row"><td colspan="9">${t('mastersEmpty')}</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("btnExportBranchCompare").onclick = async ()=>{
    const workbook = new ExcelJS.Workbook();
    const headers = [t('bcBranch'), t('bcTotalRequests'), t('bcTotalCost'), t('bcCostRank'), t('bcCostShare'), t('bcVsAverage'), t('bcCritical'), t('bcClosureRate'), t('bcEquipmentCount')];

function getWebhookUrl(){ return localStorage.getItem("forka_webhook_url") || ""; }
function saveWebhookUrl(url){
  localStorage.setItem("forka_webhook_url", url);
  if(cloudEnabled && cloudDb){
    cloudDb.collection("forka_meta").doc("settings").set({webhookUrl:url}, {merge:true}).catch(err=>console.error("Failed to sync webhook URL:",err));

function fireWebhook(eventType, data){
  const url = getWebhookUrl();
  if(!url) return Promise.resolve();
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source:"GROUP_FORKA", event: eventType, timestamp: new Date().toISOString(), data })
  }).catch(err=>{ console.error("Webhook delivery failed:", err); throw err; });
}

function autoFixBranchDuplicates(){
  // Collect every raw branch string used anywhere (assets, fleet, and every other branch-tracked module),
  // grouped by normalized form. For each group with more than one spelling, the MOST-USED spelling
  // (across everything) becomes canonical, and every record using a different spelling gets rewritten to it.
  const branchModules = MODULES.filter(m=>m.branchField);
  const rawCounts = {};
  branchModules.forEach(m=>{
    loadData(m.key).forEach(r=>{
      splitBranchNames(r[m.branchField]).forEach(b=>{ rawCounts[b] = (rawCounts[b]||0) + 1; });
    });
  });

  const groups = {};
  Object.keys(rawCounts).forEach(raw=>{
    const norm = normalizeSearchText(raw);
    (groups[norm] = groups[norm] || []).push({ raw, count: rawCounts[raw] });
  });

  const canonicalFor = {}; // normalized -> chosen canonical raw string
  let duplicateGroupCount = 0;
  Object.entries(groups).forEach(([norm, variants])=>{
    if(variants.length <= 1) return;
    duplicateGroupCount++;
    variants.sort((a,b)=> b.count - a.count);
    canonicalFor[norm] = variants[0].raw;
  });

  if(duplicateGroupCount === 0) return { fixedGroups:0, fixedRecords:0 };

  let fixedRecords = 0;
  branchModules.forEach(m=>{
    const arr = loadDataRaw(m.key);
    let changedThisModule = false;
    arr.forEach(r=>{
      const parts = splitBranchNames(r[m.branchField]);
      if(!parts.length) return;
      const fieldDef = m.fields.find(f=>f.key===m.branchField);
      if(parts.length > 1 && !(fieldDef && fieldDef.type==="branchMultiSelect")) return;   // single-branch field: leave it alone
      const newParts = parts.map(p=> canonicalFor[normalizeSearchText(p)] || p);
      const changed = newParts.some((p,i)=> p !== parts[i]);
      if(changed){
        r[m.branchField] = newParts.join("، ");
        r._updatedAt = Date.now();
        cloudPushRecord(m.key, r);
        fixedRecords++;
        changedThisModule = true;
      }
    });
    if(changedThisModule) saveData(m.key, arr);
  });

  // Clean up the master branches list too: drop non-canonical duplicate entries
  const masters = loadMasters();
  if(masters.branches){
    const cleaned = [...new Set(masters.branches.map(b=> canonicalFor[normalizeSearchText(b)] || b))];
    masters.branches = cleaned;
    saveMasters(masters);
    if(cloudEnabled && cloudDb){
      cloudDb.collection("forka_meta").doc("masters").set(masters).catch(()=>{});
    }
  }

  return { fixedGroups: duplicateGroupCount, fixedRecords };
}

function openBranchAuditModal(){
  const root = document.getElementById("modalRoot");
  const assets = loadData("assets");

  // Count each RAW branch string as it actually appears (splitting any multi-branch entries)
  const rawCounts = {};
  assets.forEach(a=>{
    splitBranchNames(a.branch).forEach(b=>{
      rawCounts[b] = (rawCounts[b]||0) + 1;
    });
  });
  // Fallback: if splitBranchNames found nothing (e.g. branch text matches no registered branch),
  // still count the raw un-split value so nothing gets silently dropped from the audit.
  assets.forEach(a=>{
    const b = (a.branch||"").trim();
    if(b && splitBranchNames(a.branch).length===0){
      rawCounts[b] = (rawCounts[b]||0) + 1;
    }
  });

  // Group raw values by normalized form to detect near-duplicates
  const groups = {};
  Object.keys(rawCounts).forEach(raw=>{
    const norm = normalizeSearchText(raw);
    if(!groups[norm]) groups[norm] = [];
    groups[norm].push({ raw, count: rawCounts[raw] });
  });
  const groupList = Object.values(groups).sort((a,b)=> b.reduce((s,x)=>s+x.count,0) - a.reduce((s,x)=>s+x.count,0));
  const duplicateGroups = groupList.filter(g=> g.length > 1);

  root.innerHTML = `
    <div class="modal-overlay" id="branchAuditOverlay">
      <div class="modal" style="max-width:640px;">
        <h2>${t('branchAuditTitle')}</h2>
        <div class="modal-sub">${t('branchAuditModalSub', assets.length)}</div>
        ${duplicateGroups.length ? `
          <div class="banner" style="margin-bottom:14px; background:#fdecea; color:#c0392b;">${t('branchAuditDuplicatesFound', duplicateGroups.length)}</div>
          <button class="btn btn-danger" id="btnAutoFixDuplicates" style="width:100%; margin-bottom:14px;">${t('branchAuditAutoFixBtn')}</button>
        ` : `<div class="banner" style="margin-bottom:14px; background:#eafaf0; color:#1f8a4c;">${t('branchAuditNoDuplicates')}</div>`}
        <div style="max-height:55vh; overflow-y:auto;">
          ${groupList.map(g=>{
            const total = g.reduce((s,x)=>s+x.count,0);
            const isDup = g.length > 1;
            return `
            <div style="border:1.5px solid ${isDup?'#e08a8a':'var(--line)'}; background:${isDup?'#fff7f7':'#fff'}; border-radius:10px; padding:12px 14px; margin-bottom:10px;">
              ${g.map(x=>`<div style="display:flex; justify-content:space-between; padding:3px 0; font-weight:${isDup?'800':'700'}; font-size:14px;">
                <span>${escapeHtml(x.raw)}</span><span style="color:var(--muted); font-weight:700;">${t('branchAuditRecordCount', x.count)}</span>
              </div>`).join("")}
              ${isDup ? `<div style="font-size:11.5px; color:#c0392b; margin-top:4px; font-weight:700;">${t('branchAuditDuplicateWarning')}</div>` : ""}
            </div>`;
          }).join("")}
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="btnBranchAuditClose">${t('close')}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("btnBranchAuditClose").onclick = ()=>{ root.innerHTML = ""; };
  document.getElementById("branchAuditOverlay").onclick = (e)=>{ if(e.target.id==="branchAuditOverlay") root.innerHTML = ""; };
  const autoFixBtn = document.getElementById("btnAutoFixDuplicates");
  if(autoFixBtn){
    autoFixBtn.onclick = ()=>{
      if(!confirm(t('branchAuditAutoFixConfirm'))) return;
      const result = autoFixBranchDuplicates();
      root.innerHTML = "";
      showToast(t('branchAuditAutoFixDone', result.fixedRecords, result.fixedGroups));
      render();
    };
  }
}

    const rows = Array.from(document.querySelectorAll("#bulkImportRows tr")).filter(row=> row.style.display !== "none");
    const arr = loadDataRaw("assets");
    let count = 0;
    rows.forEach(row=>{
      const code = row.querySelector('[data-bi="code"]').value.trim();
      const name = row.querySelector('[data-bi="name"]').value.trim();
      if(!code && !name) return;
      const rec = {
        id: uid(),

        name: name || code,
        category: row.querySelector('[data-bi="category"]').value.trim(),
        location: row.querySelector('[data-bi="location"]').value.trim(),
        branch: row.querySelector('[data-bi="branch"]').value,
        _updatedAt: Date.now(),
      };
      arr.push(rec);
      cloudPushRecord("assets", rec);
      count++;
    });
    if(count===0){ alert(t('bulkAssetImportNothing')); return; }
    saveData("assets", arr);
    root.innerHTML = "";

let deferredInstallPrompt = null;

}
window.addEventListener("beforeinstallprompt", (e)=>{

/* ---------------- LOCAL PUSH NOTIFICATIONS (free — works while app is open/backgrounded) ---------------- */
function gatherCriticalItemsWithIds(){
  let items = [];
  MODULES.forEach(m=>{
    loadData(m.key).forEach(r=>{
      const flagged = isOverdue(m,r) || (m.alertValues||[]).includes((r[m.statusField]||"").trim());
      if(flagged){
        const label = r.branch || r.company || r.reqNo || r.plate || r.name || "";
        items.push({ id: r.id, moduleName: ML(m,"name"), label });
      }
    });
  });
  return items;
}
function getPushNotifEnabled(){ return localStorage.getItem("forka_push_enabled") === "on"; }
function setPushNotifEnabled(on){
  localStorage.setItem("forka_push_enabled", on ? "on" : "off");
  if(!on && pushWatcherInterval){ clearInterval(pushWatcherInterval); pushWatcherInterval = null; }
}
function getNotifiedIds(){ try{ return new Set(JSON.parse(localStorage.getItem("forka_notified_ids"))||[]); }catch(e){ return new Set(); } }
function saveNotifiedIds(set){ localStorage.setItem("forka_notified_ids", JSON.stringify([...set])); }
function seedNotifiedIdsBaseline(){ saveNotifiedIds(new Set(gatherCriticalItemsWithIds().map(i=>i.id))); }
function getNotifiedVehCheckIds(){ try{ return new Set(JSON.parse(localStorage.getItem("forka_notified_vehcheck_ids"))||[]); }catch(e){ return new Set(); } }
function saveNotifiedVehCheckIds(set){ localStorage.setItem("forka_notified_vehcheck_ids", JSON.stringify([...set])); }
function seedNotifiedVehCheckBaseline(){ saveNotifiedVehCheckIds(new Set(loadData("vehcheck").map(c=>c.id))); }
function checkForNewVehCheckSubmissions(){
  if(!getPushNotifEnabled() || !("Notification" in window) || Notification.permission !== "granted") return;
  const checks = loadData("vehcheck");
  const notifiedChecks = getNotifiedVehCheckIds();
  const newOnes = checks.filter(c=> !notifiedChecks.has(c.id));
  if(newOnes.length){
    if(newOnes.length === 1){
      const label = newOnes[0].vType || newOnes[0].plate || "";
      showLocalNotification(t('pushNotifDriverCheckTitle'), t('pushNotifDriverCheckBody', label));
    } else {
      showLocalNotification(t('pushNotifDriverCheckTitle'), t('pushNotifDriverChecksMultiple', newOnes.length));
    }
    newOnes.forEach(c=> notifiedChecks.add(c.id));
    saveNotifiedVehCheckIds(notifiedChecks);
  }
}
function showLocalNotification(title, body){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  let fired = false;
  const fireDirect = ()=>{ if(fired) return; fired = true; try{ new Notification(title, {body}); }catch(e){ console.error("Notification failed:", e); } };
  const fallbackTimer = setTimeout(fireDirect, 1500); // guard against navigator.serviceWorker.ready hanging forever
  if(navigator.serviceWorker && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(reg=>{
      clearTimeout(fallbackTimer);
      if(fired) return;
      fired = true;
      reg.showNotification(title, { body, icon:"icon-192.png", badge:"icon-192.png" });
    }).catch(()=>{
      clearTimeout(fallbackTimer);
      fireDirect();
    });
  } else {
    clearTimeout(fallbackTimer);
    fireDirect();
  }
}
let pushWatcherInterval = null;
function checkForNewCriticalItemsAndNotify(){
  if(!getPushNotifEnabled() || !("Notification" in window) || Notification.permission !== "granted") return;
  const items = gatherCriticalItemsWithIds();
  const notified = getNotifiedIds();
  const newOnes = items.filter(i=> !notified.has(i.id));
  if(newOnes.length){
    if(newOnes.length === 1){
      showLocalNotification(t('pushNotifNewCriticalTitle'), `${newOnes[0].moduleName}: ${newOnes[0].label}`);
    } else {
      showLocalNotification(t('pushNotifNewCriticalTitle'), t('pushNotifMultipleBody', newOnes.length));
    }
    newOnes.forEach(i=> notified.add(i.id));
    saveNotifiedIds(notified);
  }
}
function startPushNotifWatcher(){
  if(pushWatcherInterval) clearInterval(pushWatcherInterval);
  pushWatcherInterval = setInterval(()=>{ checkForNewCriticalItemsAndNotify(); checkForNewVehCheckSubmissions(); }, 45000);
}
if(getPushNotifEnabled() && "Notification" in window && Notification.permission === "granted"){
  startPushNotifWatcher();
}
