<style>
  :root{
    --navy:#1F3864; --navy-dark:#15294c; --navy-light:#2c4a80;
    --gold:#C9A24B; --gold-light:#e8d9b5;
    --bg:#EEF1F6; --card:#FFFFFF; --line:#E2E6EE;
    --text:#1c2433; --muted:#6b7686;
    --danger:#c0392b; --danger-bg:#fdecea;
    --success:#1f8a4c; --success-bg:#e8f8ee;
    --warning:#b8860b; --warning-bg:#fff6e0;
    --info:#2563eb; --info-bg:#eaf1ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal','Segoe UI',Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; min-height:100vh;
  }
  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px; min-width:250px; background:linear-gradient(180deg,var(--navy),var(--navy-dark));
    color:#fff; display:flex; flex-direction:column; padding:18px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ padding:0 18px 16px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px;}
  .brand .logo{font-weight:900; font-size:20px; letter-spacing:.5px;}
  .brand .sub{font-size:12px; color:var(--gold-light); margin-top:4px; line-height:1.5;}
  .nav-group-title{font-size:11px; color:rgba(255,255,255,.5); padding:14px 18px 6px; text-transform:uppercase; letter-spacing:.05em;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 18px; cursor:pointer;
    font-size:14.5px; color:rgba(255,255,255,.88); border-inline-start:3px solid transparent; transition:.15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.12); border-inline-start-color:var(--gold); color:#fff; font-weight:700;}
  .nav-item .ic{font-size:16px; width:20px; text-align:center;}
  .nav-badge{
    margin-inline-start:auto; background:var(--gold); color:var(--navy-dark); font-weight:800;
    font-size:11px; padding:1px 7px; border-radius:10px; min-width:18px; text-align:center;
  }
  .nav-footer{margin-top:auto; padding:14px 18px; font-size:11px; color:rgba(255,255,255,.45); border-top:1px solid rgba(255,255,255,.1);}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:0; z-index:5; flex-wrap:wrap;
  }
  .topbar h1{font-size:18px; margin:0; font-weight:800; color:var(--navy);}
  .topbar .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .content{padding:22px 24px 60px; flex:1;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:8px; padding:9px 15px; font-family:inherit; font-size:13.5px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.15s; white-space:nowrap;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-light);}
  .btn-gold{background:var(--gold); color:var(--navy-dark);}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-outline{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{background:#f8d7d3;}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:6px;}
  .btn-lang{background:var(--navy-dark); color:#fff; border:1.5px solid rgba(255,255,255,.25);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- Cards / Dashboard ---------- */
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:20px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:0 1px 2px rgba(20,30,60,.04);}
  .stat-card{cursor:pointer; transition:.15s;}
  .stat-card:hover{box-shadow:0 4px 14px rgba(20,30,60,.10); transform:translateY(-1px);}
  .stat-card .top{display:flex; align-items:center; justify-content:space-between;}
  .stat-card .ic{font-size:22px;}
  .stat-card .num{font-size:30px; font-weight:900; color:var(--navy); margin:6px 0 2px;}
  .stat-card .label{font-size:13.5px; color:var(--text); font-weight:700;}
  .stat-card .sub{font-size:12px; color:var(--muted); margin-top:6px;}
  .stat-card .alert{color:var(--danger); font-weight:800;}
  .section-title{font-size:15px; font-weight:800; color:var(--navy); margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
  .section-title:before{content:""; width:4px; height:16px; background:var(--gold); border-radius:2px; display:inline-block;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px;}
  .toolbar input[type=text], .toolbar select{
    border:1.5px solid var(--line); border-radius:8px; padding:8px 12px; font-family:inherit; font-size:13.5px; background:#fff;
  }
  .toolbar input[type=text]{min-width:220px;}
  .spacer{flex:1;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:68vh;}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:700px;}
  thead th{
    background:var(--navy); color:#fff; text-align:center; padding:10px 8px; font-weight:700; white-space:nowrap; position:sticky; top:0;
  }
  tbody td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:nth-child(even){background:#FAFBFD;}
  tbody tr:hover{background:#F0F4FA;}
  tbody tr.clickable-row{cursor:pointer;}
  td.desc-cell, th.desc-cell{width:380px; min-width:320px; max-width:480px; text-align:start; white-space:normal;}
  .row-actions{display:flex; gap:5px; justify-content:center;}
  .empty-row td{padding:40px; color:var(--muted); font-size:14px;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:800; white-space:nowrap;}
  .badge-danger{background:var(--danger-bg); color:var(--danger);}
  .badge-warning{background:var(--warning-bg); color:var(--warning);}
  .badge-success{background:var(--success-bg); color:var(--success);}
  .badge-info{background:var(--info-bg); color:var(--info);}
  .badge-muted{background:#eef0f4; color:var(--muted);}

  /* ---------- Modal / Form ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,20,35,.55); display:flex; align-items:flex-start; justify-content:center;
    padding:30px 16px; overflow-y:auto; z-index:50;
  }
  .modal{background:#fff; border-radius:14px; width:100%; max-width:920px; padding:22px 26px 26px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h2{margin:0 0 4px; color:var(--navy); font-size:19px;}
  .modal .modal-sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px; font-weight:700; color:var(--text);}
  .field input, .field select, .field textarea{
    border:1.5px solid var(--line); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:13.5px; background:#fbfcfe;
    width:100%; box-sizing:border-box;
  }
  .field textarea{min-height:90px; resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--navy);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; border-top:1px solid var(--line); padding-top:16px;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:11px 22px; border-radius:10px; font-size:13.5px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100;
    opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .banner{
    background:var(--warning-bg); border:1px solid #f0e0b0; color:#7a5c00; font-size:12.5px; padding:10px 14px;
    border-radius:10px; margin-bottom:16px; display:flex; gap:8px; align-items:flex-start;
  }
  .help-box{
    background:var(--info-bg); border:1px solid #cfe0fb; color:#1b3f8f; font-size:13px; padding:14px 16px;
    border-radius:10px; margin-bottom:18px; line-height:1.9;
  }
  .help-box b{color:var(--navy);}
  .help-box ol{margin:6px 0 0; padding-inline-start:20px;}

  /* ---------- Print ---------- */
  .print-only{display:none;}
  @media print{
    .no-print{display:none !important;}
    body{display:block; background:#fff;}
    .main{width:100%;}
    .content{padding:0;}
    .print-only{display:block;}
    .table-wrap{border:none; border-radius:0; max-height:none; overflow:visible;}
    table{min-width:0; font-size:11px;}
    thead th{background:#1F3864 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; color:#fff !important;}
    .badge{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    @page{ size: A4 landscape; margin:12mm; }
  }
  /* Mirrors @media print rules, applied via JS while capturing a screenshot for PDF export */
  body.generating-pdf .no-print{display:none !important;}
  body.generating-pdf .print-only{display:block !important;}
  body.generating-pdf .table-wrap{border:none; border-radius:0; max-height:none !important; overflow:visible !important;}
  body.generating-pdf .content{padding:0;}
  .print-header{display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--navy); padding-bottom:10px; margin-bottom:14px;}
  .print-header .pt-title{font-size:18px; font-weight:900; color:var(--navy);}
  .print-header .pt-meta{font-size:11px; color:#555;}

  /* ---------- Sortable table headers ---------- */
  thead th.sortable{cursor:pointer; user-select:none;}
  thead th.sortable:hover{background:var(--navy-light);}
  thead th .sort-ic{font-size:10px; opacity:.7; margin-inline-start:3px;}

  /* ---------- Photo widget ---------- */
  .photo-widget{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .photo-thumb{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .pdf-thumb-icon{
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fdecea; color:#c0392b; font-size:22px; gap:2px;
  }
  .pdf-thumb-icon span{font-size:9px; font-weight:800;}

  /* ---------- Calendar ---------- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-header-row{ margin-bottom:6px; }
  .cal-headcell{ text-align:center; font-weight:800; font-size:12px; color:var(--navy); padding:6px 0; }
  .cal-cell{ background:var(--card); border:1px solid var(--line); border-radius:8px; min-height:92px; padding:6px; display:flex; flex-direction:column; }
  .cal-cell.cal-empty{ background:transparent; border:none; }
  .cal-cell.cal-today{ border:2px solid var(--gold); background:#fffdf5; }
  .cal-daynum{ font-size:12px; font-weight:800; color:var(--text); margin-bottom:4px; }
  .cal-today-badge{ font-size:9px; background:var(--gold); color:var(--navy-dark); border-radius:8px; padding:1px 5px; font-weight:800; }
  .cal-events{ display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .cal-event{ font-size:10px; padding:2px 4px; border-radius:4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-event-more{ font-size:9.5px; color:var(--muted); padding:0 4px; }
  @media (max-width: 900px){
    .cal-cell{ min-height:60px; }
    .cal-event{ display:none; }
    .cal-daynum{ font-size:11px; }
  }
  /* ---------- QR modal ---------- */
  .qr-overlay{
    position:fixed; inset:0; background:rgba(10,14,25,.85); z-index:250;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .qr-box{ background:#fff; border-radius:16px; padding:24px; text-align:center; max-width:340px; width:100%; }
  .qr-box #qrCanvasWrap{ display:flex; justify-content:center; margin:14px 0; }
  .qr-video-wrap{ position:relative; width:100%; max-width:400px; border-radius:12px; overflow:hidden; background:#000; }
  .qr-video-wrap video{ width:100%; display:block; }
  .qr-scan-frame{ position:absolute; inset:15%; border:3px solid var(--gold); border-radius:12px; pointer-events:none; }
  .video-thumb-icon{ background:#eaf1ff !important; color:#2563eb !important; }
  .attach-status{
    position:absolute; bottom:2px; inset-inline-start:2px; font-size:11px; background:rgba(255,255,255,.9);
    border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center;
  }
  .attach-status.uploading{ animation: pulse 1.2s infinite; }
  .attach-status.failed{ background:rgba(255,235,230,.95); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb .rm{
    position:absolute; top:2px; inset-inline-end:2px; background:rgba(192,57,43,.9); color:#fff; border:none;
    width:18px; height:18px; border-radius:50%; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .photo-add-btn{
    width:64px; height:64px; border:1.5px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--muted); font-size:22px; background:#fafbfd;
  }
  .photo-count-chip{font-size:11px; background:var(--info-bg); color:var(--info); border-radius:10px; padding:2px 8px; white-space:nowrap;}

  /* ---------- Overdue tag ---------- */
  .overdue-tag{color:var(--danger); font-size:11px; font-weight:800; margin-inline-start:4px; white-space:nowrap;}

  /* ---------- KPI cards ---------- */
  .kpi-card .kpi-val{font-size:26px; font-weight:900; color:var(--navy);}
  .kpi-card .kpi-target{font-size:11px; color:var(--muted); margin-top:4px;}
  .kpi-bar{height:6px; border-radius:4px; background:#eef0f4; margin-top:8px; overflow:hidden;}
  .kpi-bar-fill{height:100%; border-radius:4px; background:var(--success);}
  .kpi-bar-fill.warn{background:var(--warning);}
  .kpi-bar-fill.bad{background:var(--danger);}

  /* ---------- Photo Lightbox ---------- */
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(10,14,25,.92); z-index:300;
    display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px;
  }
  .lightbox-img{ max-width:90vw; max-height:78vh; object-fit:contain; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox-pdf{ width:88vw; height:78vh; border:none; border-radius:8px; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox-close{
    position:absolute; top:18px; inset-inline-end:22px; background:rgba(255,255,255,.12); color:#fff; border:none;
    width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-close:hover{ background:rgba(255,255,255,.22); }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); color:#fff; border:none;
    width:48px; height:48px; border-radius:50%; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-nav:hover{ background:rgba(255,255,255,.22); }
  .lightbox-prev{ inset-inline-start:24px; }
  .lightbox-next{ inset-inline-end:24px; }
  .lightbox-counter{ color:#ddd; font-size:13px; margin-top:14px; }
  .lightbox-name{ color:#fff; font-size:13px; margin-top:6px; font-weight:700; }

  /* ---------- Mobile menu button ---------- */
  .menu-btn{display:none; background:var(--navy); color:#fff; border:none; border-radius:8px; width:38px; height:38px; font-size:18px; cursor:pointer;}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}

  /* ---------- Lock screen ---------- */
  .lock-screen{
    position:fixed; inset:0; background:linear-gradient(135deg,var(--navy),var(--navy-dark)); z-index:200;
    display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff; padding:20px;
  }
  .lock-box{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:16px; padding:34px 30px; width:100%; max-width:340px; text-align:center;}
  .lock-box .lg{font-weight:900; font-size:20px; margin-bottom:4px;}
  .lock-box .ls{font-size:12.5px; color:var(--gold-light); margin-bottom:20px;}
  .lock-box input{
    width:100%; text-align:center; font-size:22px; letter-spacing:8px; padding:12px; border-radius:10px; border:none;
    margin-bottom:14px; font-family:inherit;
  }
  .lock-box .err{color:#ffb4b4; font-size:12.5px; min-height:18px; margin-bottom:6px;}

  /* ---------- Notifications page ---------- */
  .step-card{display:flex; gap:12px; align-items:flex-start;}
  .step-num{
    width:26px; height:26px; min-width:26px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800;
  }
  .notif-status{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:20px;}
  .notif-status.on{background:var(--success-bg); color:var(--success);}
  .notif-status.off{background:#eef0f4; color:var(--muted);}
  .toggle-switch{position:relative; width:42px; height:24px; display:inline-block;}
  .toggle-switch input{opacity:0; width:0; height:0;}
  .toggle-slider{position:absolute; inset:0; background:#ccc; border-radius:24px; cursor:pointer; transition:.2s;}
  .toggle-slider:before{content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s;}
  .toggle-switch input:checked + .toggle-slider{background:var(--success);}
  .toggle-switch input:checked + .toggle-slider:before{transform:translateX(18px);}
  html[dir="rtl"] .toggle-switch input:checked + .toggle-slider:before{transform:translateX(-18px);}

  @media (max-width: 900px){
    .menu-btn{display:inline-flex; align-items:center; justify-content:center;}
    .sidebar{position:fixed; z-index:40; inset-inline-start:0; top:0; transform:translateX(100%);}
    html[dir="ltr"] .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay.open{display:block;}
    .form-grid{grid-template-columns:1fr;}
    .topbar{padding:12px 14px;}
    .content{padding:14px 14px 50px;}
    .modal{padding:18px 16px 20px;}
    .btn{padding:10px 14px;}
  }
  /* ---------- Quotes comparison widget ---------- */
  .quotes-widget{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .quote-row{display:flex; gap:8px; align-items:center; background:#fafbfd; border:1px solid var(--line); border-radius:8px; padding:8px;}
  .quote-row input[type=text], .quote-row input[type=number]{

  .quote-row input[type=number]{flex:1;}

  .delay-block{
    grid-column:1/-1; background:var(--warning-bg); border:1.5px solid #f0e0b0; border-radius:10px; padding:12px 14px;
  }
  .delay-block .delay-title{font-size:12.5px; font-weight:800; color:#7a5c00; margin-bottom:8px;}
  .cond-block{
    grid-column:1/-1; background:var(--info-bg); border:1.5px solid #cfe0fb; border-radius:10px; padding:12px 14px;
  }
  .cond-block .delay-title{font-size:12.5px; font-weight:800; color:#1b3f8f; margin-bottom:8px;}
  .success-block{
    grid-column:1/-1; background:var(--success-bg); border:1.5px solid #b7e0c4; border-radius:10px; padding:12px 14px;
  }
  .success-block .delay-title{font-size:12.5px; font-weight:800; color:#1b5e20; margin-bottom:8px;}

const EXPENSE_PAYMENT_METHODS = ["نقدي","بطاقة","تحويل بنكي","شيك","آجل"];
const EXPENSE_SPLIT_EQUAL = "بالتساوي";
const EXPENSE_SPLIT_CUSTOM = "مبلغ محدد لكل فرع";
const round2 = (n)=> Math.round((Number(n)||0)*100)/100;
/* ---------------- Projects: linking invoices and computing progress / cost ---------------- */
/* A stage has ONE amount box: "الرسوم". Stages saved earlier with the two old boxes (expected fee / actually paid) are read as:
   the paid amount when it was filled, otherwise the fee. */
function stepAmount(s){ const paid = Number(s && s.paid) || 0; return paid > 0 ? paid : (Number(s && s.fee) || 0); }
function normalizeStepAmount(s){ const a = stepAmount(s); s.fee = a ? String(a) : ""; s.paid = ""; return s; }
function projectKey(s){ return normalizeSearchText(String(s||"")).replace(/\s+/g," ").trim(); }
function projectInvoices(rec){
  const k = projectKey(rec.projectName);
  if(!k) return [];
  return loadData("expenses").filter(e=> projectKey(e.project)===k);
}
/* Actual spend per step = invoices uploaded for that step; when none, the amount typed as "paid" on the step.
   Invoices of the project that name no step are added on top. Never counts an invoice twice. */
function projectCostBreakdown(rec){
  const invoices = projectInvoices(rec);
  const steps = Array.isArray(rec.steps) ? rec.steps : [];
  const perStep = steps.map(s=>{
    const sk = projectKey(s.name);
    const inv = sk ? invoices.filter(e=> projectKey(e.projectStep)===sk) : [];
    const invoiceTotal = round2(inv.reduce((a,e)=> a + (Number(e.total)||0), 0));
    return { step:s, invoices:inv, invoiceTotal, actual: inv.length ? invoiceTotal : round2(stepAmount(s)) };
  });
  const used = new Set(); perStep.forEach(p=> p.invoices.forEach(e=> used.add(e.id)));
  const unassigned = invoices.filter(e=> !used.has(e.id));
  const unassignedTotal = round2(unassigned.reduce((a,e)=> a + (Number(e.total)||0), 0));
  return {
    invoices, perStep, unassigned, unassignedTotal,
    actual: round2(perStep.reduce((a,p)=> a + p.actual, 0) + unassignedTotal),
    budget: round2(rec.budget),
  };
}
function projectComputed(rec){
  const steps = Array.isArray(rec.steps) ? rec.steps : [];
  const cost = projectCostBreakdown(rec);
  const done = steps.filter(s=> s.status==="تم").length;
  const current = steps.find(s=> s.status!=="تم");
  const hasCost = steps.length || cost.invoices.length;
  return {
    progress: steps.length ? Math.round(done/steps.length*100) + "%" : "",
    currentStep: steps.length ? (current ? current.name : PROJECT_ALL_DONE_TEXT) : "",
    actualCost: hasCost ? String(cost.actual) : "",
  };
}
/* keeps the figures shown in the projects list in step with the invoices (only after the data has synced) */
function refreshProjectsComputed(){
  if(cloudEnabled && !(cloudFirstSyncReceived.projects && cloudFirstSyncReceived.expenses)) return false;
  const arr = loadDataRaw("projects"); let changed = false;
  arr.forEach(r=>{
    if(r._deleted) return;
    const cp = projectComputed(r);
    if(["progress","currentStep","actualCost"].some(k=> String(r[k]===undefined?"":r[k]) !== String(cp[k]))){
      Object.assign(r, cp); r._updatedAt = Date.now(); cloudPushRecord("projects", r); changed = true;
    }
  });
  if(changed) saveData("projects", arr);
  return changed;
}
function parseAllocations(v){
  if(Array.isArray(v)) return v;
  try{ const a = JSON.parse(v||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
/* Splits an invoice between its branches. Returns [{branch, total, net, vat}] where the shares always add up to the invoice
   (rounding cents go to the last branch). In "custom" mode rec.allocations holds the TOTAL (incl. VAT) typed per branch. */
function computeExpenseAllocations(rec){
  const branches = splitBranchNames(rec.branch);
  if(!branches.length) return [];
  const net = round2(rec.amount), vat = round2(rec.vat), total = round2(net + vat);
  let shares;
  if((rec.splitMode||"").trim() === EXPENSE_SPLIT_CUSTOM){
    const custom = parseAllocations(rec.allocations);
    shares = branches.map(b=>{ const f = custom.find(x=> x.branch===b); return round2(f ? (f.total!==undefined ? f.total : f.amount) : 0); });
  } else {
    const each = Math.floor(total/branches.length*100)/100;
    shares = branches.map(()=> each);
    shares[shares.length-1] = round2(shares[shares.length-1] + (total - each*branches.length));
  }
  const out = branches.map((b,i)=>{
    const sNet = total ? round2(shares[i]*net/total) : 0;
    return { branch:b, total:shares[i], net:sNet, vat: round2(shares[i]-sNet) };
  });
  const netDiff = round2(net - out.reduce((s,x)=>s+x.net,0));
  if(out.length && netDiff){ out[out.length-1].net = round2(out[out.length-1].net + netDiff); out[out.length-1].vat = round2(out[out.length-1].total - out[out.length-1].net); }
  return out;
}
function expenseAllocationText(allocs){
  return (allocs||[]).map(a=> `${a.branch}: ${Number(a.total).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`).join(" | ");
}

/* ---------------- BIG-DATA STORE ----------------
   Module records and report archives can carry large attachments. localStorage is capped at ~5 MB
   (that is what produced the "storage full" error), so everything heavy lives in IndexedDB, which
   allows hundreds of MB up to several GB. An in-memory string cache fronts it so the rest of the app
   keeps reading/writing synchronously exactly as before (each read still gets a fresh JSON.parse copy).
   If IndexedDB is unavailable (some private modes / very old browsers) it silently falls back to localStorage. */
const BigStore = (function(){
  const DB_NAME = "forka_bigstore", STORE = "kv";
  let db = null, usable = false, flushScheduled = false;
  const strCache = {};   // key -> JSON string
  const pending = {};    // key -> JSON string waiting to be written to IndexedDB
  let channel = null;
  try{
    channel = new BroadcastChannel("forka_bigstore");
    channel.onmessage = (e)=>{ if(e.data && e.data.k && typeof e.data.s === "string") strCache[e.data.k] = e.data.s; };
  }catch(e){ channel = null; }

  function bigKeys(){
    const keys = [];
    MODULES.forEach(m=>{ keys.push("forka_"+m.key); keys.push("forka_reportarchive_"+m.key); });
    return keys;
  }
  function flush(){
    flushScheduled = false;
    if(!usable || !db) return;
    const entries = Object.entries(pending);
    if(!entries.length) return;
    try{
      const tx = db.transaction(STORE, "readwrite");
      const st = tx.objectStore(STORE);
      entries.forEach(([k,s])=>{ st.put(s, k); delete pending[k]; });
      tx.onerror = tx.onabort = ()=>{
        // IndexedDB write failed: fall back to localStorage so nothing is lost
        entries.forEach(([k,s])=>{ try{ localStorage.setItem(k, s); localStorage.setItem("forka_lsfallback_"+k, "1"); }catch(e){} });
      };
    }catch(e){
      entries.forEach(([k,s])=>{ try{ localStorage.setItem(k, s); localStorage.setItem("forka_lsfallback_"+k, "1"); }catch(err){} });
    }
  }
  function scheduleFlush(){
    if(flushScheduled) return;
    flushScheduled = true;
    setTimeout(flush, 0);
  }
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flush(); });

  function init(){
    return new Promise((resolve)=>{
      if(!window.indexedDB){ resolve(false); return; }
      let req;
      try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ resolve(false); return; }
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE); };
      req.onerror = ()=> resolve(false);
      req.onblocked = ()=> resolve(false);
      req.onsuccess = ()=>{
        db = req.result;
        // 1) load everything already stored in IndexedDB into the cache
        const loaded = {};
        try{
          const tx = db.transaction(STORE, "readonly");
          const cur = tx.objectStore(STORE).openCursor();
          cur.onsuccess = ()=>{
            const c = cur.result;
            if(c){ loaded[c.key] = c.value; c.continue(); }
          };
          tx.oncomplete = ()=>{
            Object.assign(strCache, loaded);
            // 2) one-time migration: move any data still sitting in localStorage into IndexedDB
            const toWrite = {};
            bigKeys().forEach(k=>{
              const ls = localStorage.getItem(k);
              if(ls === null) return;
              const wasFallback = localStorage.getItem("forka_lsfallback_"+k) === "1";
              if(!(k in strCache) || wasFallback){ strCache[k] = ls; toWrite[k] = ls; }
            });
            usable = true;
            const keys = Object.keys(toWrite);
            if(!keys.length){
              // clean any stale duplicate copies left in localStorage to free its space
              bigKeys().forEach(k=>{ if(k in strCache){ try{ localStorage.removeItem(k); localStorage.removeItem("forka_lsfallback_"+k); }catch(e){} } });
              resolve(true); return;
            }
            try{
              const wtx = db.transaction(STORE, "readwrite");
              const st = wtx.objectStore(STORE);
              keys.forEach(k=> st.put(toWrite[k], k));
              wtx.oncomplete = ()=>{
                // only after IndexedDB confirmed the write do we free localStorage
                keys.forEach(k=>{ try{ localStorage.removeItem(k); localStorage.removeItem("forka_lsfallback_"+k); }catch(e){} });
                resolve(true);
              };
              wtx.onerror = wtx.onabort = ()=>{ resolve(true); }; // keep localStorage copy; cache already holds the data
            }catch(e){ resolve(true); }
          };
          tx.onerror = tx.onabort = ()=> resolve(false);
        }catch(e){ resolve(false); }
      };
      try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    });
  }
  function getString(k){
    if(usable) return (k in strCache) ? strCache[k] : null;
    return localStorage.getItem(k);
  }
  // returns true on success, false if nothing could store it
  function setString(k, s){
    if(usable){
      strCache[k] = s;
      pending[k] = s;
      scheduleFlush();
      if(channel){ try{ channel.postMessage({k, s}); }catch(e){} }
      return true;
    }
    try{ localStorage.setItem(k, s); return true; }catch(e){ return false; }
  }
  function isUsable(){ return usable; }
  return { init, getString, setString, isUsable, flush };
})();
window.__BigStore = BigStore;

/* ---------------- STORAGE ---------------- */
function loadDataRaw(key){
  try{ return JSON.parse(BigStore.getString("forka_"+key)) || []; }catch(e){ return []; }
}
function loadData(key){
  return loadDataRaw(key).filter(r=> !r._deleted);
}
function saveData(key, arr){
  const ok = BigStore.setString("forka_"+key, JSON.stringify(arr));
  if(!ok){
    console.error("saveData failed (storage unavailable/full)");
    alert(t('storageQuotaError'));
  }
}
const TRASH_RETENTION_DAYS = 30;
function purgeExpiredTrash(){
  MODULES.forEach(m=>{
    const arr = loadDataRaw(m.key);
    const cutoff = Date.now() - TRASH_RETENTION_DAYS*24*60*60*1000;
    const kept = arr.filter(r=> !(r._deleted && r._deletedAt && r._deletedAt < cutoff));
    if(kept.length !== arr.length){ saveData(m.key, kept); }
  });
}
function getAllTrashedRecords(){
  let items = [];
  MODULES.forEach(m=>{
    loadDataRaw(m.key).filter(r=>r._deleted).forEach(r=>{
      items.push({ moduleKey:m.key, moduleName:ML(m,"name"), moduleIcon:m.icon, record:r });
    });
  });
  items.sort((a,b)=> (b.record._deletedAt||0) - (a.record._deletedAt||0));
  return items;
}
function renumberAfterDelete(m, deletedRecord){
  if(!m.numberField || !deletedRecord || !deletedRecord[m.numberField]) return;
  const re = new RegExp(`^${m.numberPrefix}-(\\d{4})-(\\d+)$`);
  const match = (deletedRecord[m.numberField]||"").match(re);
  if(!match) return;
  const deletedYear = match[1];
  const deletedSeq = parseInt(match[2], 10);
  const arr = loadDataRaw(m.key);
  let changed = false;
  arr.forEach(r=>{
    if(r._deleted || r.id===deletedRecord.id) return;
    const rMatch = (r[m.numberField]||"").match(re);
    if(!rMatch) return;
    const rYear = rMatch[1], rSeq = parseInt(rMatch[2], 10);
    if(rYear === deletedYear && rSeq > deletedSeq){
      r[m.numberField] = `${m.numberPrefix}-${rYear}-${String(rSeq-1).padStart(3,"0")}`;
      changed = true;
    }
  });
  if(changed){
    saveData(m.key, arr);
    arr.forEach(r=>{ if(!r._deleted) cloudPushRecord(m.key, r); });
  }
}
function restoreTrashedRecord(moduleKey, recordId){
  const arr = loadDataRaw(moduleKey);
  const idx = arr.findIndex(r=>r.id===recordId);
  if(idx>=0){
    delete arr[idx]._deleted;
    delete arr[idx]._deletedAt;
    const m = MODULES.find(x=>x.key===moduleKey);
    if(m && m.numberField && arr[idx][m.numberField]){
      const numVal = arr[idx][m.numberField];
      const activeNums = new Set(arr.filter(r=> r.id!==recordId && !r._deleted).map(r=>r[m.numberField]).filter(Boolean));
      if(activeNums.has(numVal)){
        const yr = new Date().getFullYear();
        let n = activeNums.size + 1;
        let candidate = `${m.numberPrefix}-${yr}-${String(n).padStart(3,"0")}`;
        while(activeNums.has(candidate)){ n++; candidate = `${m.numberPrefix}-${yr}-${String(n).padStart(3,"0")}`; }
        arr[idx][m.numberField] = candidate;
      }
    }
    saveData(moduleKey, arr);
    cloudPushRecord(moduleKey, arr[idx]);
  }
}
function permanentlyDeleteTrashedRecord(moduleKey, recordId){
  const arr = loadDataRaw(moduleKey);
  const kept = arr.filter(r=>r.id!==recordId);
  saveData(moduleKey, kept);
  cloudDeleteRecord(moduleKey, recordId);
}

/* A conditional (showIf) field only belongs in the flat table/export view when the user has
   filtered the list to exactly the status value that field depends on. Otherwise it's mostly-empty
   clutter — it's still fully visible per-record via the "👁️ view" / edit form regardless. */
function isFieldRelevantForList(f, m, statusFilterValue, forceAll){
  if(!f.showIf) return true;

  return f.showIf.field === m.statusField && statusFilterValue === f.showIf.value;
}

let _glossaryAR2EN = null, _glossaryEN2AR = null;
function glossaryKey(s){ return normalizeSearchText(String(s||"")).toLowerCase().replace(/\s+/g," ").trim(); }
function ensureGlossary(){
  if(_glossaryAR2EN) return;
  _glossaryAR2EN = new Map(); _glossaryEN2AR = new Map();
  BILINGUAL_GLOSSARY.forEach(([ar,en])=>{
    _glossaryAR2EN.set(glossaryKey(ar), en);
    if(!_glossaryEN2AR.has(glossaryKey(en))) _glossaryEN2AR.set(glossaryKey(en), ar);   // first Arabic wins when several map to one English name
  });
}
function glossaryLookup(text, target){
  const raw = String(text||"").trim();
  if(!raw) return null;
  ensureGlossary();
  const map = target==="en" ? _glossaryAR2EN : _glossaryEN2AR;
  const direct = map.get(glossaryKey(raw));
  if(direct) return direct;
  const m = raw.match(/^(.*?)\s*\((?:العدد|Qty)\s*:\s*(\d+)\)\s*$/i);   // "(العدد: 2)" <-> "(Qty: 2)"
  if(m){
    const base = map.get(glossaryKey(m[1]));
    if(base) return target==="en" ? `${base} (Qty: ${m[2]})` : `${base} (العدد: ${m[2]})`;
  }
  return null;
}
/* text to SHOW in the current program language (glossary only; falls back to the stored text) */
function glDisplay(text){
  if(!text) return text;
  return glossaryLookup(text, LANG) || text;
}
function translateText(text, targetLang){
  return new Promise((resolve)=>{
    if(!text || !text.toString().trim()){ resolve(text); return; }
    const srcLang = detectTextLang(text);
    if(srcLang === targetLang){ resolve(text); return; }
    const glossaryHit = glossaryLookup(text, targetLang);
    if(glossaryHit){ resolve(glossaryHit); return; }
    const cacheKey = targetLang+"::"+text;
    if(translationCache[cacheKey]!==undefined){ resolve(translationCache[cacheKey]); return; }
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${srcLang}|${targetLang}`;
    fetch(url).then(r=>r.json()).then(data=>{
      const translated = (data && data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : text;
      translationCache[cacheKey] = translated;
      saveTranslationCache(translationCache);
      resolve(translated);
    }).catch(()=>{ resolve(text); });
  });
}
function autoTranslateDOM(root){
  const onlineEnabled = getAutoTranslateEnabled();
  const scope = root || document;
  const els = scope.querySelectorAll('[data-autotranslate]');
  els.forEach(el=>{
    const original = el.dataset.original;
    if(!original || !original.trim()) return;
    if(detectTextLang(original) === LANG) return; // already matches current language, nothing to do
    const exact = glossaryLookup(original, LANG);
    if(exact){
      if(el.tagName==="INPUT" || el.tagName==="TEXTAREA"){ el.value = exact; } else { el.textContent = exact; }
      return;
    }
    if(!onlineEnabled) return;
    el.style.transition = "opacity .15s";
    el.style.opacity = "0.45";
    translateText(original, LANG).then(translated=>{
      if(el.tagName==="INPUT" || el.tagName==="TEXTAREA"){ el.value = translated; }
      else { el.textContent = translated; }
      el.style.opacity = "1";
    });
  });
}
function getAutoTranslateEnabled(){ return localStorage.getItem("forka_autotranslate") !== "off"; }
function setAutoTranslateEnabled(on){ localStorage.setItem("forka_autotranslate", on ? "on" : "off"); }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function showToast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove("show"), 2200);
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr); const now = new Date(todayStr());
  return Math.round((d-now)/86400000);
}
function isOverdue(m, r){
  if(!m.overdueRule) return false;
  try{ return !!m.overdueRule(r); }catch(e){ return false; }
}
function overdueLabelFor(m){
  return m.key==="requests" ? t("overdueTag") : t("overdueTagDate");
}

/* ---------------- MASTER LISTS (Branches / Contractors / Drivers) ---------------- */
const MASTER_TYPES = ["branches","contractors","drivers"];
function loadMasters(){
  try{ return JSON.parse(localStorage.getItem("forka_masters")) || {branches:[],contractors:[],drivers:[]}; }
  catch(e){ return {branches:[],contractors:[],drivers:[]}; }
}
function saveMasters(obj){ localStorage.setItem("forka_masters", JSON.stringify(obj)); }
function addMasterValue(type, val){
  if(!val || !val.trim()) return;
  const m = loadMasters();
  const exists = (m[type]||[]).some(x=> x.trim().toLowerCase()===val.trim().toLowerCase());
  if(!exists){ m[type] = [...(m[type]||[]), val.trim()]; saveMasters(m); cloudPushMasters(m); }
}
function removeMasterValue(type, val){
  const m = loadMasters();
  m[type] = (m[type]||[]).filter(x=>x!==val);
  saveMasters(m);
  cloudPushMasters(m);
}
function buildDatalistsHtml(){
  const m = loadMasters();
  const masterLists = MASTER_TYPES.map(type=>
    `<datalist id="dl_${type}">${(m[type]||[]).map(v=>`<option value="${v.replace(/"/g,'&quot;')}">`).join("")}</datalist>`
  ).join("");
  const assetNames = [...new Set([
    ...loadData("assets").map(a=>(a.name||"").trim()),
    ...loadData("fleet").map(v=> v.carName ? `${v.carName.trim()}${v.plate ? " — "+v.plate.trim() : ""}` : ""),
  ].filter(Boolean))];
  const assetDatalist = `<datalist id="dl_assetNames">${assetNames.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">`).join("")}</datalist>`;
  const fleetPlates = loadData("fleet").filter(v=>v.plate && v.plate.trim());
  const plateDatalist = `<datalist id="dl_fleetPlates">${fleetPlates.map(v=>`<option value="${escapeAttr(v.plate.trim())}" label="${escapeAttr((v.carName||"").trim())}">${escapeHtml((v.carName||"").trim())}</option>`).join("")}</datalist>`;
  const expRecs = loadData("expenses");
  const uniq = (arr)=> [...new Set(arr.map(x=>(x||"").trim()).filter(Boolean))];
  const vendorDatalist = `<datalist id="dl_expenseVendors">${uniq(expRecs.map(r=>r.vendor)).map(v=>`<option value="${escapeAttr(v)}">`).join("")}</datalist>`;
  const projectDatalist = `<datalist id="dl_expenseProjects">${uniq([...loadData("projects").map(p=>p.projectName), ...expRecs.map(r=>r.project)]).map(v=>`<option value="${escapeAttr(v)}">`).join("")}</datalist>`;
  const stepDatalist = `<datalist id="dl_expenseSteps">${uniq(loadData("projects").flatMap(p=>(p.steps||[]).map(s=>s.name))).map(v=>`<option value="${escapeAttr(v)}">`).join("")}</datalist>`;
  return masterLists + assetDatalist + plateDatalist + vendorDatalist + projectDatalist + stepDatalist;
}

const FUJ_IMPORT_PREFIX = "fuj2026-";
const FUJ_MIGRATION_FLAG = "forka_migrated_fujairah_equip_v1";
function looksLikeVehicleAsset(a){
  return /سيار|شاحن|مركب|دباب|بيك ?اب|\bvan\b|vehicle|truck|\bcar\b|pickup/i.test(`${a.name||""} ${a.category||""}`);
}
function resolveFujairahTarget(){
  const masters = loadMasters();
  const fujBranches = (masters.branches||[]).filter(b=> normalizeSearchText(b).includes("فجير"));
  const target = fujBranches.find(b=> normalizeSearchText(b).includes("كويتي")) || fujBranches[0] || null;
  return { target, fujBranches };       // never creates a branch and never writes the branch list
}
function fujairahImportRecord(it, target, now){
  return { id: it.id, code: it.code, name: it.name, category: it.category, serial: it.serial, branch: target,
           location: it.location, condition: it.condition, notes: it.notes,
           quantity: it.quantity, nameEn: it.nameEn, fileCondition: it.fileCondition, fileRemarks: it.fileRemarks,
           photos: [], _updatedAt: now };
}
/* Safety net: if the job already ran but the imported records are gone (e.g. a cloud sync replaced the local list because
   the cloud write was rejected), put them back. Never deletes anything; gives up after 3 attempts. */
function ensureFujairahEquipmentPresent(){
  if(!localStorage.getItem(FUJ_MIGRATION_FLAG)) return null;
  const attempts = Number(localStorage.getItem("forka_fuj_heal_attempts")||0);
  if(attempts >= 3) return null;
  const arr = loadDataRaw("assets");
  if(arr.some(a=> String(a.id||"").startsWith(FUJ_IMPORT_PREFIX))) return null;
  const { target } = resolveFujairahTarget();
  const now = Date.now(); const pushes = [];
  FUJAIRAH_EQUIPMENT_2026.forEach(it=>{ const rec = fujairahImportRecord(it, target, now); arr.push(rec); pushes.push(cloudPushRecord("assets", rec)); });
  saveData("assets", arr);
  localStorage.setItem("forka_fuj_heal_attempts", String(attempts+1));
  localStorage.setItem(FUJ_REFRESH_FLAG, "1");
  return { added: FUJAIRAH_EQUIPMENT_2026.length, branch: target, pushes };
}
/* Second pass ("transfer the file again with every detail"): re-applies ALL columns of the file to the 33 imported items.
   Creates missing ones, updates existing ones (keeping photos / supplier / price / anything entered by hand),
   and brings back any the user moved to the bin. Deletes nothing. Runs once per device. */
const FUJ_REFRESH_FLAG = "forka_migrated_fujairah_equip_v2";
function refreshFujairahEquipmentDetails(){
  if(localStorage.getItem(FUJ_REFRESH_FLAG)) return null;
  if(!localStorage.getItem(FUJ_MIGRATION_FLAG)) return null;   // first pass has not run yet here: it will import everything with all details itself
  const arr = loadDataRaw("assets");
  const { target } = resolveFujairahTarget();
  const now = Date.now(); const pushes = [];
  let created = 0, updated = 0, restored = 0;
  FUJAIRAH_EQUIPMENT_2026.forEach(it=>{
    const rec = fujairahImportRecord(it, target, now);
    const idx = arr.findIndex(a=> a.id===it.id);
    if(idx >= 0){
      const old = arr[idx];
      if(old._deleted) restored++;
      const merged = { ...old, ...rec, photos: old.photos || [] };
      delete merged._deleted; delete merged._deletedAt;
      arr[idx] = merged; updated++;
      pushes.push(cloudPushRecord("assets", merged));
    } else {
      arr.push(rec); created++;
      pushes.push(cloudPushRecord("assets", rec));
    }
  });
  saveData("assets", arr);
  localStorage.setItem(FUJ_REFRESH_FLAG, "1");
  return { total: FUJAIRAH_EQUIPMENT_2026.length, created, updated, restored, branch: target, pushes };
}
function runFujairahEquipmentMigration(){
  if(localStorage.getItem(FUJ_MIGRATION_FLAG)) return null;
  const arr = loadDataRaw("assets");
  // already done (here or on another device, synced through the cloud)?
  if(arr.some(a=> String(a.id||"").startsWith(FUJ_IMPORT_PREFIX))){ localStorage.setItem(FUJ_MIGRATION_FLAG, "1"); return null; }

  const { target, fujBranches } = resolveFujairahTarget();
  if(!target){ window.__fujNoBranch = true; return null; }          // branch not registered -> do nothing (retry next time)
  const pushes = [];
  const normTarget = normalizeSearchText(target);
  const needKuwaiti = fujBranches.length > 1 && normTarget.includes("كويتي");
  const belongsToTarget = (a)=>{
    const nb = normalizeSearchText(a.branch||"");
    if(!nb.includes("فجير")) return false;
    if(fujBranches.length <= 1) return true;                 // only one Fujairah branch exists -> unambiguous
    return needKuwaiti ? nb.includes("كويتي") : nb === normTarget;
  };

  const now = Date.now();
  let removed = 0, keptVehicles = 0;
  arr.forEach(a=>{
    if(a._deleted || !belongsToTarget(a)) return;
    if(looksLikeVehicleAsset(a)){ keptVehicles++; return; }
    a._deleted = true; a._deletedAt = now; a._updatedAt = now;
    pushes.push(cloudPushRecord("assets", a));
    removed++;
  });
  FUJAIRAH_EQUIPMENT_2026.forEach(it=>{
    const rec = fujairahImportRecord(it, target, now);
    arr.push(rec);
    pushes.push(cloudPushRecord("assets", rec));
  });
  saveData("assets", arr);
  localStorage.setItem(FUJ_MIGRATION_FLAG, "1");
  localStorage.setItem(FUJ_REFRESH_FLAG, "1");
  return { added: FUJAIRAH_EQUIPMENT_2026.length, removed, keptVehicles, branch: target, pushes };
}
/* waits (max 8 s) to learn whether the cloud accepted the writes: "ok" | "fail" | "pending" (offline / slow) */
function cloudVerdict(pushes){
  return Promise.race([
    Promise.all(pushes).then(r=> r.every(Boolean) ? "ok" : "fail"),
    new Promise(res=> setTimeout(()=> res("pending"), 8000)),
  ]);
}
function scheduleFujairahEquipmentMigration(){
  if(localStorage.getItem(FUJ_MIGRATION_FLAG)) return;       // already done: nothing automatic any more (no re-adding, no refreshing)
  let waited = 0;
  const timer = setInterval(()=>{
    waited += 800;
    if(!cloudReadyForJobs() && waited < 15000) return;       // wait until assets, vehicles AND the branch list have loaded
    clearInterval(timer);
    setTimeout(async ()=>{
      try{
        const res = runFujairahEquipmentMigration();
        if(res){
          const verdict = await cloudVerdict(res.pushes);
          alert(t('fujMigrationDone', res.added, res.removed, res.branch, res.keptVehicles) + (verdict==="fail" ? "\n\n"+t('fujCloudNotSaved') : verdict==="pending" ? "\n\n"+t('fujCloudPending') : ""));
          render();
        } else if(window.__fujNoBranch){
          alert(t('fujNoBranch'));
        }
      }catch(err){
        console.error("Fujairah equipment job failed:", err);
        alert(t('fujJobError', (err && err.message) || String(err)));
      }
    }, 600);
  }, 800);
}
/* ---------------- ONE-TIME: remove equipment that has NO branch ----------------
   Moves every asset whose branch is empty to the recycle bin (restorable for 30 days). Safe by design:
   - vehicles (fleet module) and vehicle-like assets are never touched
   - assets whose branch is filled in but spelled differently from a registered branch are KEPT (they are real
     equipment with a typo — the Branch Audit tool merges those) and only counted in the report
   - only records last modified BEFORE this job was released are affected, so equipment you add later without a
     branch is never deleted by another device running the job late. Idempotent across devices. */
const UNASSIGNED_CLEANUP_CUTOFF = 1793175360534;
const UNASSIGNED_CLEANUP_FLAG = "forka_migrated_unassigned_assets_v1";
function isBlankBranchValue(v){
  const s = String(v||"").trim();
  return !s || /^[-–—_./\\\s]+$/.test(s) || /^(غير محدد|لا يوجد|بدون فرع|n\/?a|none|null|undefined)$/i.test(s);
}
function runUnassignedAssetsCleanup(){
  if(localStorage.getItem(UNASSIGNED_CLEANUP_FLAG)) return null;
  const arr = loadDataRaw("assets");
  const registered = (loadMasters().branches||[]);
  const now = Date.now();
  let removed = 0, keptVehicles = 0, keptUnmatched = 0;
  arr.forEach(a=>{
    if(a._deleted) return;
    if(isBlankBranchValue(a.branch)){
      if((a._updatedAt||0) > UNASSIGNED_CLEANUP_CUTOFF) return;       // added/edited after release -> leave it
      if(looksLikeVehicleAsset(a)){ keptVehicles++; return; }
      a._deleted = true; a._deletedAt = now; a._updatedAt = now;
      cloudPushRecord("assets", a);
      removed++;
    } else {
      const matched = splitBranchNames(a.branch).some(p=> registered.some(b=> normalizeSearchText(b)===normalizeSearchText(p)));
      if(!matched) keptUnmatched++;
    }
  });
  if(removed) saveData("assets", arr);
  localStorage.setItem(UNASSIGNED_CLEANUP_FLAG, "1");
  return { removed, keptVehicles, keptUnmatched };
}
function scheduleUnassignedAssetsCleanup(){
  if(localStorage.getItem(UNASSIGNED_CLEANUP_FLAG)) return;
  let waited = 0;
  const timer = setInterval(()=>{
    waited += 800;
    const synced = cloudReadyForJobs();
    if(!synced && waited < 15000) return;
    clearInterval(timer);
    setTimeout(()=>{
      const res = runUnassignedAssetsCleanup();
      if(res && (res.removed || res.keptUnmatched || res.keptVehicles)){
        alert(t('unassignedCleanupDone', res.removed, res.keptUnmatched, res.keptVehicles));
        render();
      }
    }, 2200);   // a moment after the Fujairah job so the two messages never collide
  }, 800);
}

const MAYAR_IMPORT_PREFIX = "may2026-";
const MAYAR_MIGRATION_FLAG = "forka_migrated_mayar_equip_v1";
function resolveMayarTarget(){
  const known = loadMasters().branches || [];
  const cands = known.filter(b=>{ const n = normalizeSearchText(b); return n.includes("ميار") && n.includes("كوفي"); });
  return cands[0] || null;            // never creates a branch and never writes the branch list
}
function mayarImportRecord(it, target, now){
  return { id: it.id, code: it.code, name: it.name, category: it.category, brand: it.brand, serial: it.serial, branch: target,
           location: it.location, condition: it.condition, notes: it.notes, quantity: it.quantity, nameEn: it.nameEn,
           fileRemarks: it.fileRemarks, fileNo: it.fileNo, photos: [], _updatedAt: now };
}
function ensureMayarBranch(){
  let target = resolveMayarTarget();
  if(target) return { target, created:false };
  target = "ميار كوفي شوب";                                  // the name the owner gave; added to the shared list additively
  const masters = loadMasters();
  masters.branches = [...(masters.branches||[]), target];
  saveMasters(masters);
  cloudAddBranchesToMasters([target]);                       // arrayUnion + merge: can never replace the list
  return { target, created:true };
}
function runMayarEquipmentMigration(){
  if(localStorage.getItem(MAYAR_MIGRATION_FLAG)) return null;
  const arr = loadDataRaw("assets");
  if(arr.some(a=> String(a.id||"").startsWith(MAYAR_IMPORT_PREFIX))){ localStorage.setItem(MAYAR_MIGRATION_FLAG, "1"); return null; }
  const { target, created } = ensureMayarBranch();
  const now = Date.now(); const pushes = [];
  MAYAR_EQUIPMENT_2026.forEach(it=>{                       // ADD ONLY — nothing existing is touched
    const rec = mayarImportRecord(it, target, now);
    arr.push(rec);
    pushes.push(cloudPushRecord("assets", rec));
  });
  saveData("assets", arr);
  localStorage.setItem(MAYAR_MIGRATION_FLAG, "1");
  return { added: MAYAR_EQUIPMENT_2026.length, branch: target, branchCreated: created, pushes };
}
/* The first version of this import moved the earlier MY-… items of Mayar to the recycle bin without being asked.
   This puts back exactly those (deleted MY-… items inside a Mayar branch). Runs once per device. */
function undoMayarOldItemRemoval(){
  const FLAG = "forka_mayar_undo_v1";
  if(localStorage.getItem(FLAG)) return null;
  const arr = loadDataRaw("assets"); const now = Date.now(); const pushes = []; let restored = 0;
  arr.forEach(a=>{
    if(a._deleted && /^MY-/i.test(String(a.code||"").trim()) && normalizeSearchText(a.branch||"").includes("ميار")){
      delete a._deleted; delete a._deletedAt; a._updatedAt = now;
      pushes.push(cloudPushRecord("assets", a)); restored++;
    }
  });
  if(restored) saveData("assets", arr);
  localStorage.setItem(FLAG, "1");
  return { restored, pushes };
}
function ensureMayarEquipmentPresent(){ return null; }   // automatic re-adding switched off
function scheduleMayarEquipmentMigration(){
  let waited = 0;
  const timer = setInterval(()=>{
    waited += 800;
    if(!cloudReadyForJobs() && waited < 15000) return;
    clearInterval(timer);
    setTimeout(async ()=>{
      try{
        const undone = undoMayarOldItemRemoval();
        if(undone && undone.restored) alert(t('mayarUndoDone', undone.restored));
        const res = runMayarEquipmentMigration();
        if(res && res.noBranch){ alert(t('mayarNoBranch')); return; }
        if(res){
          const verdict = await cloudVerdict(res.pushes);
          alert(t('mayarMigrationDone', res.added, 0, res.branch) + (res.branchCreated ? "\n\n"+t('mayarBranchAdded', res.branch) : "") + (verdict==="fail" ? "\n\n"+t('fujCloudNotSaved') : verdict==="pending" ? "\n\n"+t('fujCloudPending') : ""));
          render();
        }
      }catch(err){
        console.error("Mayar equipment job failed:", err);
        alert(t('mayarJobError', (err && err.message) || String(err)));
      }
    }, 4000);
  }, 800);
}
/* ---------------- ONE-TIME SAFETY REPAIR: branches of vehicles / equipment ----------------
   (a) branch names that vehicles/equipment still reference but are missing from the branch list are added back to the list
       (add-only, never replaces the list); (b) a vehicle/asset whose branch got glued to a second, overlapping branch name
       (e.g. "مطعم … - الشارقة، الشارقة") goes back to the single, more specific branch; (c) anything that still looks wrong is
       only REPORTED, never changed. Nothing is deleted. */
const BRANCH_REPAIR_FLAG = "forka_branch_repair_v1";
function branchKeyOf(s){ return normalizeSearchText(String(s||"")).replace(/[\s\-–—_.]+/g, ""); }
function cloudAddBranchesToMasters(names){
  if(!cloudEnabled || !cloudDb || !names.length) return Promise.resolve(true);
  const FV = window.firebase && firebase.firestore && firebase.firestore.FieldValue;
  if(!FV || !FV.arrayUnion) return Promise.resolve(false);
  return cloudWrite(cloudDb.collection("forka_meta").doc("masters").set({branches: FV.arrayUnion(...names)}, {merge:true}), "masters union");
}
function runBranchSafetyRepair(){
  if(localStorage.getItem(BRANCH_REPAIR_FLAG)) return null;
  const masters = loadMasters(); const known = masters.branches || [];
  const report = { recovered:[], collapsed:[], ambiguous:[] };
  const stores = [{key:"fleet", label:r=> `${r.carName||""} ${r.plate||""}`.trim()}, {key:"assets", label:r=> `${r.name||""} ${r.code||""}`.trim()}];

  // (a) branch names in use but missing from the list
  const seen = {};
  stores.forEach(s=> loadDataRaw(s.key).forEach(r=>{
    if(r._deleted) return;
    const b = String(r.branch||"").trim();
    if(!b || isBlankBranchValue(b) || /[،,]/.test(b)) return;
    if(known.some(k=> branchKeyOf(k)===branchKeyOf(b) || b.includes(k.trim()))) return;
    const k = branchKeyOf(b); (seen[k] = seen[k] || {}); seen[k][b] = (seen[k][b]||0) + 1;
  }));
  const toAdd = Object.values(seen).map(variants=> Object.entries(variants).sort((a,b)=> b[1]-a[1])[0][0]);
  if(toAdd.length){
    masters.branches = [...known, ...toAdd]; saveMasters(masters); cloudAddBranchesToMasters(toAdd);
    report.recovered = toAdd;
  }

  // (b)+(c) vehicles / assets that carry more than one branch
  const now = Date.now();
  stores.forEach(s=>{
    const arr = loadDataRaw(s.key); let changed = false;
    arr.forEach(r=>{
      if(r._deleted) return;
      const parts = splitBranchNames(r.branch);
      if(parts.length < 2) return;
      const keep = parts.filter(p=> !parts.some(q=> q!==p && q.includes(p)));
      if(keep.length === 1){
        report.collapsed.push(`${s.label(r)}: ${r.branch} ← ${keep[0]}`);
        r.branch = keep[0]; r._updatedAt = now; cloudPushRecord(s.key, r); changed = true;
      } else {
        report.ambiguous.push(`${s.label(r)}: ${r.branch}`);
      }
    });
    if(changed) saveData(s.key, arr);
  });
  localStorage.setItem(BRANCH_REPAIR_FLAG, "1");
  return report;
}
function scheduleBranchSafetyRepair(){
  if(localStorage.getItem(BRANCH_REPAIR_FLAG)) return;
  let waited = 0;
  const timer = setInterval(()=>{
    waited += 800;
    if(!cloudReadyForJobs() && waited < 15000) return;
    clearInterval(timer);
    setTimeout(()=>{
      try{
        const rep = runBranchSafetyRepair();
        if(rep && (rep.recovered.length || rep.collapsed.length || rep.ambiguous.length)){
          const list = (arr)=> arr.slice(0,8).map(x=>"• "+x).join("\n") + (arr.length>8 ? `\n… +${arr.length-8}` : "");
          alert(t('branchRepairDone') + (rep.recovered.length ? "\n\n"+t('branchRepairRecovered', rep.recovered.length)+"\n"+list(rep.recovered) : "")
            + (rep.collapsed.length ? "\n\n"+t('branchRepairCollapsed', rep.collapsed.length)+"\n"+list(rep.collapsed) : "")
            + (rep.ambiguous.length ? "\n\n"+t('branchRepairAmbiguous', rep.ambiguous.length)+"\n"+list(rep.ambiguous) : ""));
          render();
        }
      }catch(err){ console.error("Branch repair failed:", err); }
    }, 1200);
  }, 800);
}
/* ---------------- ONE-TIME: imported equipment must sit under a REGISTERED branch ----------------
   Equipment imported from the Mayar / Fujairah lists whose branch text is not a registered branch (the branch list on a device was
   incomplete when they were imported) shows under "no branch". This puts every Mayar item (ids may2026-…) under the Mayar coffee-shop
   branch — adding that branch to the list if it is missing (add-only) — and every Fujairah item (fuj2026-…) under the registered
   Fujairah branch. Only those imported items are touched. */
const IMPORTED_BRANCH_FIX_FLAG = "forka_import_branch_fix_v1";
function runImportedBranchFix(){
  if(localStorage.getItem(IMPORTED_BRANCH_FIX_FLAG)) return null;
  const arr = loadDataRaw("assets"); const now = Date.now();
  const out = { mayFixed:0, fujFixed:0, branchAdded:null };
  const mayItems = arr.filter(a=> !a._deleted && String(a.id||"").startsWith(MAYAR_IMPORT_PREFIX));
  const fujItems = arr.filter(a=> !a._deleted && String(a.id||"").startsWith(FUJ_IMPORT_PREFIX));
  let changed = false;
  if(mayItems.length){
    const { target, created } = ensureMayarBranch();
    if(created) out.branchAdded = target;
    mayItems.forEach(a=>{ if(a.branch !== target){ a.branch = target; a._updatedAt = now; cloudPushRecord("assets", a); out.mayFixed++; changed = true; } });
  }
  if(fujItems.length){
    const { target } = resolveFujairahTarget();                // Fujairah: only ever uses a branch that is already registered
    if(target) fujItems.forEach(a=>{ if(a.branch !== target){ a.branch = target; a._updatedAt = now; cloudPushRecord("assets", a); out.fujFixed++; changed = true; } });
  }
  if(changed) saveData("assets", arr);
  localStorage.setItem(IMPORTED_BRANCH_FIX_FLAG, "1");
  return out;
}
function scheduleImportedBranchFix(){
  if(localStorage.getItem(IMPORTED_BRANCH_FIX_FLAG)) return;
  let waited = 0;
  const timer = setInterval(()=>{
    waited += 800;
    if(!cloudReadyForJobs() && waited < 15000) return;
    clearInterval(timer);
    setTimeout(()=>{
      try{
        const r = runImportedBranchFix();
        if(r && (r.mayFixed || r.fujFixed || r.branchAdded)){
          alert(t('importedBranchFixDone', r.mayFixed, r.fujFixed, r.branchAdded));
          render();
        }
      }catch(err){ console.error("Imported branch fix failed:", err); }
    }, 5500);       // after the Mayar import so freshly imported items are never "fixed" twice
  }, 800);
}
/* ---------------- ONE-TIME: the four new stages for the projects already in progress ----------------
   Restaurant / cafe / new-branch projects that are not finished get the stages they are missing — pest-control contract, cameras
   contract, property inventory, licences inventory — each in its proper place. Nothing else in the project is touched (a stage the
   user deleted earlier is NOT brought back; only these four are ever added). */
const PROJECT_STAGE_UPGRADE_FLAG = "forka_project_stages_v2";
function runProjectStageUpgrade(){
  if(localStorage.getItem(PROJECT_STAGE_UPGRADE_FLAG)) return null;
  const arr = loadDataRaw("projects"); const now = Date.now(); const done = [];
  arr.forEach(p=>{
    if(p._deleted || (p.status||"")==="مكتمل") return;
    if(!["رخصة مطعم جديدة","رخصة كافيه / كوفي شوب جديدة","فرع جديد (افتتاح)"].includes(p.type)) return;
    const steps = Array.isArray(p.steps) ? p.steps : [];
    if(!steps.length) return;
    const merged = mergeTemplateSteps(steps, p.type, PROJECT_NEW_STAGE_NAMES);
    if(merged.length === steps.length) return;
    p.steps = merged; Object.assign(p, projectComputed(p)); p._updatedAt = now;
    cloudPushRecord("projects", p);
    done.push({ name: p.projectName, added: merged.length - steps.length });
  });
  if(done.length) saveData("projects", arr);
  localStorage.setItem(PROJECT_STAGE_UPGRADE_FLAG, "1");
  return done;
}
function scheduleProjectStageUpgrade(){
  if(localStorage.getItem(PROJECT_STAGE_UPGRADE_FLAG)) return;
  let waited = 0;
  const timer = setInterval(()=>{
    waited += 800;
    if(!(cloudReadyForJobs() && (!cloudEnabled || cloudFirstSyncReceived.projects)) && waited < 15000) return;
    clearInterval(timer);
    setTimeout(()=>{
      try{
        const done = runProjectStageUpgrade();
        if(done && done.length){ alert(t('projStageUpgradeDone', done.map(d=>`• ${d.name} (+${d.added})`).join("\n"))); render(); }
      }catch(err){ console.error("Project stage upgrade failed:", err); }
    }, 6500);
  }, 800);
}
function migrateStripUploadedPhotoDataUrls(){
  if(localStorage.getItem("forka_migrated_photostrip_v1")) return;
  let changedAny = false;
  MODULES.forEach(m=>{
    const photoKeys = m.fields.filter(f=>f.type==="photo"||f.type==="photo2").map(f=>f.key);
    if(!photoKeys.length) return;
    const arr = loadDataRaw(m.key);
    let changedThisModule = false;
    arr.forEach(r=>{
      photoKeys.forEach(key=>{
        if(!Array.isArray(r[key])) return;
        let rowChanged = false;
        r[key] = r[key].map(p=>{
          if(p && p.storageUrl && p.dataUrl){
            rowChanged = true;
            const { dataUrl, ...rest } = p;
            return { ...rest, dataUrl: null };
          }
          return p;
        });
        if(rowChanged){ changedThisModule = true; changedAny = true; }
      });
    });
    if(changedThisModule) saveData(m.key, arr);
  });
  localStorage.setItem("forka_migrated_photostrip_v1", "1");
  return changedAny;
}
function migratePaymentStatusDefaults(){
  if(localStorage.getItem("forka_migrated_paymentstatus_v1")) return;

}

function refreshDriverBranchOptions(){
  const sel = document.getElementById("drvBranch");
  if(!sel) return;
  const branches = loadMasters().branches || [];
  const currentVal = sel.value;
  const currentCount = sel.options.length - 1; // excluding the blank "choose" option
  if(branches.length === currentCount){ translateBranchOptions("drvBranch"); return; }
  sel.innerHTML = `<option value="">${t('driverChooseOption')}</option>` + branches.map(b=>`<option value="${b}" data-branchname="${escapeAttr(b)}">${escapeHtml(b)}</option>`).join("");
  sel.value = currentVal;

async function translateBranchOptions(selectId){
  const sel = document.getElementById(selectId);
  if(!sel) return;
  const opts = Array.from(sel.options).filter(o=>o.value);
  for(const opt of opts){
    const original = opt.dataset.branchname;
    if(!original || !original.trim()) continue;
    if(detectTextLang(original) === LANG || !getAutoTranslateEnabled()){
      opt.textContent = original; // revert to original text
      continue;
    }
    const translated = await translateText(original, LANG);
    opt.textContent = translated;
  }
}
async function refreshDriverVehicleNames(){
  const sel = document.getElementById("drvPlate");
  if(!sel) return;
  const opts = Array.from(sel.options).filter(o=>o.value);
  for(const opt of opts){
    const original = opt.dataset.carname;
    const plate = opt.dataset.plate || "";
    if(!original || !original.trim()) continue;
    if(detectTextLang(original) === LANG || !getAutoTranslateEnabled()){
      opt.textContent = plate ? `${original} — ${plate}` : original; // revert to original text
      continue;
    }
    const translated = await translateText(original, LANG);
    opt.textContent = plate ? `${translated} — ${plate}` : translated;
  }
}

function submitExpenseUpload(){
  if(expenseUploadBusy) return;
  const msg = document.getElementById("expUpMsg");
  const g = (k)=> { const el = document.querySelector(`#expUpForm [data-field="${k}"]`); return el ? el.value.trim() : ""; };
  const missing = [];
  if(!g("submittedBy")) missing.push(t('expUpSubmitter'));
  if(!g("date")) missing.push(efl('date'));
  if(!g("vendor")) missing.push(efl('vendor'));
  if(!g("department")) missing.push(efl('department'));
  if(!g("category")) missing.push(efl('category'));
  if(!splitBranchNames(g("branch")).length) missing.push(efl('branch'));
  if(!(Number(g("amount")) > 0)) missing.push(efl('amount'));
  if(missing.length){ msg.textContent = t('expUpMissing') + "\n• " + missing.join("\n• "); return; }
  if(!expenseUploadPhotos.length){ msg.textContent = t('expUpNeedFile'); return; }
  if(expenseUploadPhotos.some(p=>p.uploading) || expenseUploadDocs.some(p=>p.uploading)){ msg.textContent = t('driverWaitUpload'); return; }

  const m = expenseModule();
  const rec = {
    id: uid(), date: g("date"), invoiceNo: g("invoiceNo"), vendor: g("vendor"), department: g("department"), category: g("category"),
    employee: g("employee"), branch: g("branch"), project: g("project"), projectStep: g("projectStep"), amount: g("amount"), vat: g("vat"),
    splitMode: g("splitMode") || EXPENSE_SPLIT_EQUAL, allocations: g("allocations"),
    paymentStatus: g("paymentStatus"), paymentMethod: g("paymentMethod"), notes: g("notes"), submittedBy: g("submittedBy"),
    reviewStatus: "جديدة",
  };
  rec.total = String(round2((Number(rec.amount)||0) + (Number(rec.vat)||0)));
  rec.accountingMonth = rec.date.slice(0,7);
  if(rec.splitMode === EXPENSE_SPLIT_CUSTOM){
    const picked = splitBranchNames(rec.branch);
    const typed = parseAllocations(rec.allocations).filter(a=> picked.includes(a.branch));
    const sum = round2(typed.reduce((s,a)=> s + (Number(a.total!==undefined?a.total:a.amount)||0), 0));
    if(Math.abs(sum - Number(rec.total)) > 0.01){ msg.textContent = t('expAllocMismatch', sum.toFixed(2), Number(rec.total).toFixed(2)); return; }
  }
  const dup = expenseDuplicateMessage(rec);
  if(dup && !confirm(dup)) return;
  const allocs = computeExpenseAllocations(rec);
  rec.allocations = allocs; rec.allocationText = expenseAllocationText(allocs);
  const keepFile = (p)=> p.storageUrl ? (({dataUrl, ...rest})=>({...rest, dataUrl:null}))(p) : p;
  rec.photos = expenseUploadPhotos.map(keepFile);
  rec.docFiles = expenseUploadDocs.map(keepFile);
  expenseUploadBusy = true;
  const btn = document.getElementById("expUpSubmit"); btn.disabled = true; btn.style.opacity = "0.6";
  rec.expNo = getNextRecordNumber(m);
  rec._updatedAt = Date.now();
  const arr = loadDataRaw("expenses");
  arr.push(rec);
  saveData("expenses", arr);
  cloudPushRecord("expenses", rec);
  fireWebhook("expense_submitted", { expNo: rec.expNo, vendor: rec.vendor, category: rec.category, branch: rec.branch, total: rec.total, submittedBy: rec.submittedBy, date: rec.date });
  expenseUploadPhotos = [];
  expenseUploadDocs = [];
  expenseUploadBusy = false;
  renderExpenseThankYouPage(rec.expNo);
}

let odometerPhotoEntry = null;
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}
// Picks the most plausible odometer reading instead of blindly concatenating every digit
// found anywhere on a busy dashboard (speed, clock, RPM, etc. would otherwise all get mashed together).
function pickOdometerCandidate(ocrData){
  const words = (ocrData.words || [])
    .map(w=> ({ text:(w.text||"").replace(/[^\d]/g,""), confidence:w.confidence||0 }))
    .filter(w=> w.text.length >= 3 && w.text.length <= 7);
  if(!words.length) return null;
  words.sort((a,b)=> b.confidence - a.confidence || b.text.length - a.text.length);
  return words[0].text;
}
async function captureOdometerPhoto(file){
  const previewEl = document.getElementById("odometerPhotoPreview");
  const inputEl = document.getElementById("drv_odometer");
  const reader = new FileReader();
  const dataUrl = await new Promise((resolve, reject)=>{
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  // Remove any PREVIOUS odometer photo (re-taking a photo replaces it, doesn't stack up)
  if(odometerPhotoEntry){
    const idx = driverPhotos.indexOf(odometerPhotoEntry);
    if(idx>=0) driverPhotos.splice(idx,1);
  }

  const photoEntry = {name: t('driverOdometerPhotoLabel'), dataUrl, uploading: hasAnyUploadServiceConfigured(), _tempId: uid()};
  odometerPhotoEntry = photoEntry;
  driverPhotos.push(photoEntry);
  renderOdometerPhotoPreview(t('driverOcrReading'));
  renderDriverPhotoWidget();
  resizeImageDataUrl(dataUrl, 400).then(smallUrl=>{
    if(odometerPhotoEntry === photoEntry){ photoEntry.dataUrl = smallUrl; }
    renderDriverPhotoWidget();
  });
  if(photoEntry.uploading){
    startAttachmentUpload(photoEntry, file, driverPhotos, renderDriverPhotoWidget);
  }

  try{
    await loadTesseract();
    const { data } = await window.Tesseract.recognize(dataUrl, "eng", {
      tessedit_char_whitelist: "0123456789",
    });
    const candidate = pickOdometerCandidate(data);
    if(candidate){
      inputEl.value = candidate;
      renderOdometerPhotoPreview(t('driverOcrSuccess'));
    } else {
      renderOdometerPhotoPreview(t('driverOcrFailed'));
    }
  } catch(err){
    console.error("Odometer OCR error:", err);
    renderOdometerPhotoPreview(t('driverOcrFailed'));
  }
}

/* ---------------- KPI COMPUTATION ---------------- */
function computeKPIs(){
  const reqs = loadData("requests");
  const pm = loadData("pm");
  const veh = loadData("vehcheck");
  const amc = loadData("amc");

  // 1) Request closure rate
  const closedReqs = reqs.filter(r=>(r.status||"").trim()==="مغلق").length;
  const closureRate = reqs.length ? Math.round((closedReqs/reqs.length)*100) : null;

  // 2) Avg response time (minutes) between reportDate and arrival
  const withBoth = reqs.filter(r=>r.reportDate && r.arrivalDate);
  let avgResponse = null;
  if(withBoth.length){
    const total = withBoth.reduce((s,r)=> s + Math.max(0,(new Date(r.arrivalDate)-new Date(r.reportDate))/60000), 0);
    avgResponse = Math.round(total/withBoth.length);
  }

  // 3) PM on-time rate
  const pmRelevant = pm.filter(r=>["منجز في موعده","منجز متأخر","متأخر"].includes((r.status||"").trim()));
  const pmOnTime = pm.filter(r=>(r.status||"").trim()==="منجز في موعده").length;
  const pmRate = pmRelevant.length ? Math.round((pmOnTime/pmRelevant.length)*100) : null;

  // 4) Fleet readiness — latest check per plate within last 30 days
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const byPlate = {};
  veh.forEach(r=>{
    if(!r.plate || !r.date || new Date(r.date) < cutoff) return;
    if(!byPlate[r.plate] || new Date(r.date) > new Date(byPlate[r.plate].date)) byPlate[r.plate] = r;
  });
  const plates = Object.values(byPlate);
  const readyCount = plates.filter(r => r.tires!=="ضعيفة" && r.oil!=="تسريب" && r.brakes!=="تحتاج فحص").length;
  const fleetRate = plates.length ? Math.round((readyCount/plates.length)*100) : null;

  // 5) AMC active
  const amcActive = amc.filter(r=>(r.status||"").trim()==="ساري").length;

  return { closureRate, avgResponse, pmRate, fleetRate, amcActive, amcTotal: amc.length };
}

function getFilteredData(m){
  const ms = state.moduleState[m.key];
  let data = loadData(m.key);
  if(ms.status !== "all" && m.statusField){
    data = data.filter(r => (r[m.statusField]||"") === ms.status);
  }
  if(ms.search.trim()){
    const q = ms.search.trim().toLowerCase();
    data = data.filter(r => Object.values(r).some(v => (v||"").toString().toLowerCase().includes(q)));
  }
  if(m.dateFieldForReports && ms.dateRange && ms.dateRange.preset !== "all"){
    const range = ms.dateRange.preset === "custom"
      ? { from: ms.dateRange.from || todayStr(), to: ms.dateRange.to || todayStr() }
      : computeRangeDates(ms.dateRange.preset);
    const fromD = new Date(range.from), toD = new Date(range.to); toD.setHours(23,59,59,999);
    data = data.filter(r=>{
      if(!r[m.dateFieldForReports]) return false;
      const d = new Date(r[m.dateFieldForReports]);
      return d>=fromD && d<=toD;
    });
  }
  if(ms.sortKey){
    const f = m.fields.find(x=>x.key===ms.sortKey);
    data = [...data].sort((a,b)=>{
      let va = a[ms.sortKey]||"", vb = b[ms.sortKey]||"";
      if(f && f.type==="number"){ va = Number(va)||0; vb = Number(vb)||0; return (va-vb)*ms.sortDir; }
      return va.toString().localeCompare(vb.toString(), LANG==="ar"?"ar":"en") * ms.sortDir;
    });
  }
  return data;
}

async function exportAssetsByBranchExcel(){
  const masters = loadMasters();
  const branches = masters.branches || [];
  const assets = loadData("assets");
  const vehicles = loadData("fleet");
  const noBranchLabel = t('assetsNoBranch');

  const groups = {};
  branches.forEach(b=> groups[b] = []);
  groups[noBranchLabel] = [];

  assets.forEach(a=>{
    const matched = splitBranchNames(a.branch).find(b=> groups[b]);
    const key = matched || noBranchLabel;
    const maint = computeMaintenanceStats(a.id, false);
    groups[key].push({ type:t('assetsExportTypeAsset'), name:glDisplay(a.name||""), details:glDisplay(a.category||""), status:optLabel(a.condition||""), maint });
  });
  vehicles.forEach(v=>{
    const matched = splitBranchNames(v.branch).find(b=> groups[b]);
    const key = matched || noBranchLabel;
    const maint = computeMaintenanceStats(v.id, true);
    groups[key].push({ type:t('assetsExportTypeVehicle'), name:v.carName||"", details:v.plate||"", status:optLabel(v.status||""), maint });
  });

  const headers = [t('bcBranch'), t('assetsExportType'), t('assetsExportName'), t('assetsExportDetails'), t('thStatus'), t('assetsMaintCount'), t('assetsMaintCost'), t('assetsMaintLast')];
  const rows = [];
  for(const branch of [...branches, noBranchLabel]){
    const branchShown = (LANG!=="ar" && branch!==noBranchLabel) ? await translateValueForExport({type:"text", key:"branch"}, branch) : branch;
    groups[branch].forEach(item=>{
      rows.push({
        [headers[0]]: branchShown,
        [headers[1]]: item.type,
        [headers[2]]: item.name,
        [headers[3]]: item.details,
        [headers[4]]: item.status,
        [headers[5]]: item.maint.count,
        [headers[6]]: item.maint.totalCost,
        [headers[7]]: item.maint.lastDate || "",
      });
    });
  }

  const workbook = new ExcelJS.Workbook();
  addStyledSheet(workbook, t('tabByBranch'), headers, rows, {});
  const buf = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${t('tabByBranch')}_${todayStr()}.xlsx`;
  a.click();
}
function computeMaintenanceStats(itemId, isVehicle){
  const linked = loadData("requests").filter(r=> isVehicle ? r.linkedVehicleId===itemId : r.linkedAssetId===itemId);
  const count = linked.length;
  const totalCost = linked.reduce((s,r)=> s + (Number(r.cost)||0), 0);
  const dates = linked.map(r=>r.reportDate).filter(Boolean).sort();
  const lastDate = dates.length ? dates[dates.length-1].slice(0,10) : "";
  return { count, totalCost, lastDate };
}

              ${photoCount? `<span class="photo-count-chip" data-photorow="${r.id}" style="cursor:zoom-in;">📷${photoCount}</span>`:""}

              <button class="btn btn-sm btn-outline" data-edit="${r.id}">${t('edit')}</button>
              <button class="btn btn-sm btn-danger" data-del="${r.id}">${t('delete')}</button>
            </div></td>
          </tr>
        `;}).join("") : `<tr class="empty-row"><td colspan="${cols.length+1}">${t('emptyState', ML(m,"singular"))}</td></tr>`}
        </tbody>
      </table>
    </div>
    ${totalPages > 1 ? `
    <div class="toolbar no-print" style="justify-content:center;">
      <button class="btn btn-outline btn-sm" id="pagePrev" ${ms.page<=1?'disabled':''}>${t('calendarPrevMonth')}</button>
      <div style="font-weight:800; font-size:13px; color:var(--navy); min-width:100px; text-align:center;">${t('pageIndicator', ms.page, totalPages)}</div>
      <button class="btn btn-outline btn-sm" id="pageNext" ${ms.page>=totalPages?'disabled':''}>${t('calendarNextMonth')}</button>
    </div>` : ""}
  `;

  let rankingHtml = "";
  if(m.key==="contractorEval"){
    const all = loadData(m.key);
    const byContractor = {};
    all.forEach(r=>{
      if(!r.contractor) return;
      if(!byContractor[r.contractor]) byContractor[r.contractor] = [];
      byContractor[r.contractor].push(Number(r.weightedTotal)||0);
    });
    const ranked = Object.keys(byContractor).map(name=>{
      const scores = byContractor[name];
      const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
      const contractorRecs = all.filter(r=>r.contractor===name).sort((a,b)=> new Date(a.date||0)-new Date(b.date||0));
      const lastThree = contractorRecs.slice(-3).map(r=>Number(r.weightedTotal)||0);
      const hasStreak = lastThree.length>=3 && lastThree.every(s=>s>=80);
      return {name, avg: Math.round(avg*10)/10, count: scores.length, hasStreak};
    }).sort((a,b)=> b.avg-a.avg);
    if(ranked.length){
      rankingHtml = `
        <div class="section-title">${t('rankingTitle')}</div>
        <div class="table-wrap" style="margin-bottom:20px;">
          <table><thead><tr><th>#</th><th>${t('quotesCompany')}</th><th>${t('rankingScore')}</th><th>${t('rankingCount')}</th></tr></thead>

  const si = document.getElementById("searchInput");
