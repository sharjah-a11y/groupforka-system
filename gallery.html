<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUP FORKA — معرض المرفقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#23211f">
<style>
  body{font-family:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif; background:#f6f3ee; margin:0; padding:24px 16px;}
  .header{text-align:center; margin-bottom:24px;}
  .header .title{font-family:'EB Garamond','IBM Plex Sans Arabic',serif; color:#23211f; font-weight:600; font-size:22px; letter-spacing:1px;}
  .header .sub{color:#8d877e; font-size:12.5px; margin-top:4px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; max-width:1100px; margin:0 auto;}
  .item{background:#fffdf9; border-radius:12px; overflow:hidden; border:1px solid #e5dfd5; text-align:center;}
  .item img, .item video{width:100%; height:200px; object-fit:cover; display:block; background:#000;}
  .item iframe{width:100%; height:200px; border:none; display:block;}
  .item a{display:block; padding:10px; color:#23211f; font-weight:700; text-decoration:none; font-size:13px; border-top:1px solid #e5dfd5;}
  .item a:hover{background:#fbf8f3;}
  .filetype{padding:40px 10px; font-size:44px; background:#f6f3ee;}
  .empty{text-align:center; color:#8d877e; padding:60px 20px; font-size:14px;}
</style>
</head>
<body>
<div class="header">
  <div class="title">GROUP FORKA — معرض المرفقات</div>
  <div class="sub">كل الصور والملفات المرفقة بهذا السجل</div>
</div>
<div class="grid" id="grid"></div>
<script>
  const params = new URLSearchParams(location.search);
  const urls = (params.get('urls')||'').split(',').map(u=>decodeURIComponent(u)).filter(Boolean);
  const grid = document.getElementById('grid');

  function isVideo(u){ return /\.(mp4|mov|webm|m4v)(\?|$)/i.test(u) || u.includes('/video/upload/'); }
  function isPdf(u){ return /\.pdf(\?|$)/i.test(u); }

  if(!urls.length){
    grid.outerHTML = '<div class="empty">لا توجد مرفقات لعرضها</div>';
  } else {
    urls.forEach((url, i)=>{
      const div = document.createElement('div');
      div.className = 'item';
      let mediaHtml;
      if(isVideo(url)){
        mediaHtml = `<video src="${url}" controls preload="metadata"></video>`;
      } else if(isPdf(url)){
        mediaHtml = `<div class="filetype">📄</div>`;
      } else {
        mediaHtml = `<img src="${url}" alt="مرفق ${i+1}" loading="lazy">`;
      }
      div.innerHTML = mediaHtml + `<a href="${url}" target="_blank" rel="noopener">فتح بالحجم الكامل ⤴️</a>`;
      grid.appendChild(div);
    });
  }
</script>
</body>
</html>
